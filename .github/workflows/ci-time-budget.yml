name: ci-time-budget
# Weekly trend of pull request CI wall time against the one budget in
# tools/ci/ci-time-budget.contract.json (root ADR-0203), and the runner wait per event beside it
# (root ADR-0582; reported, not judged). It gates no pull request:
# a red run here means last week's median PR waited longer than the budget.
on:
  schedule:
    - cron: "23 1 * * 1"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trend:
    name: CI time trend
    runs-on: ubuntu-24.04
    # The runner wait reads one jobs list per sampled run (root ADR-0582): 1 week measured 4 min 50 s.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Generate the declared artifacts (root ADR-0418)
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/ci/generate-declared.sh"
      - name: Unit tests
        run: python3 -m unittest scripts/ci/test_ci_time_budget.py -v
      # The runs API needs no extra scope on a public repository; the token only
      # lifts the anonymous rate limit.
      - name: Measure the last four weeks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/ci_time_budget.py measure --weeks 4 --out ci-time-trend.json --markdown "$GITHUB_STEP_SUMMARY"
      - name: Upload trend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (SHA pin, ADR 0028)
        with:
          name: ci-time-trend
          path: ci-time-trend.json
          retention-days: 7
      - name: Judge last week against the budget
        run: python3 scripts/ci/ci_time_budget.py judge ci-time-trend.json
