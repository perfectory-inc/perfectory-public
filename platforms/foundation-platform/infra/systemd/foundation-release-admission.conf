# Installed by foundation-release.sh for every registered data job's unit (root ADR-0134 §3).
# A template instance gets it on the template (`foundation-x@.service.d`), so an instance
# started by hand that no registry lists is checked as well.
# The + prefix runs this fixed check as the administrator even for an unprivileged job.
[Service]
UnsetEnvironment=PYTHONPATH PYTHONHOME BASH_ENV ENV SHELLOPTS BASHOPTS BASH_XTRACEFD LD_PRELOAD LD_LIBRARY_PATH LD_AUDIT LD_DEBUG LD_PROFILE CDPATH GLOBIGNORE
ExecStartPre=+/opt/perfectory-control/current/scripts/deploy/foundation-release-admission.py verify-current
