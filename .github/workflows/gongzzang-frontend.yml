name: frontend

on:
  # Required context must also be runnable for a history-free public root.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, w1kch9812-cmd/v8-probe-before-base]
  merge_group:
    # Intentionally unfiltered so required/gongzzang-frontend always reports.
  # The merge queue narrows to this area's inputs (root ADR-0313); every night main runs it whole.
  schedule:
    - cron: "41 17 * * *"

defaults:
  run:
    working-directory: products/gongzzang

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Root ADR-0202: whether this workflow's area changed (tools/ci/change-scope.json).
  # An untouched area skips every job below and required/* still reports success.
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.select.outputs.affected }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Select
        id: select
        working-directory: .
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: python3 scripts/ci/change_scope.py select --workflow gongzzang-frontend.yml

  frontend:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' }}
    name: lint / typecheck / unit / e2e / a11y / bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      valkey:
        image: valkey/valkey:8-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    # Placeholder production-grade env so `next build` passes lib/env.ts validation
    # (https URLs, explicit secrets). Mirrors what the deleted graph-build
    # next_production_build rule injected via its `env = {...}` map.
    env:
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_BASE_URL: https://api.gongzzang.invalid
      NEXT_PUBLIC_FOUNDATION_PLATFORM_BASE_URL: https://foundation-platform.gongzzang.invalid
      NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID: ci-build-naver-client-id
      ZITADEL_ISSUER: https://auth.gongzzang.invalid
      ZITADEL_CLIENT_ID: ci-production-client
      ZITADEL_AUDIENCE: ci-production-audience
      ZITADEL_REDIRECT_URI: https://gongzzang.invalid/api/auth/callback
      SESSION_SECRET: ci-production-session-secret-32-valid-x
      INTERNAL_AUTH_SECRET: ci-internal-auth-secret-32-valid-pad
      FOUNDATION_PLATFORM_WEBHOOK_SECRET: ci-foundation-platform-webhook-secret-32-valid
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8 (SHA pin, ADR 0028)
        with:
          version: 9.12.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0 (SHA pin, ADR 0028)
        with:
          node-version: "24.20.0"
      # setup-node's own pnpm cache saves on every ref, so each merge-queue branch kept a copy
      # no later run can read (root ADR-0269). The store is restored everywhere and saved from
      # main only, under the same node-cache- key.
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >>"$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 (SHA pin, ADR 0028)
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: node-cache-gongzzang-${{ runner.os }}-pnpm-${{ hashFiles('products/gongzzang/pnpm-lock.yaml') }}
          restore-keys: node-cache-gongzzang-${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Native replacements for the deleted graph-build frontend targets
      # (frontend_lint / frontend_typecheck / frontend_unit_test /
      #  frontend_build / frontend_bundle / frontend_e2e).
      - name: Biome check
        run: pnpm biome check .

      # Was pre-commit only until ADR-0149; the hook lints staged files, this lints them all.
      - name: Markdown lint
        run: pnpm markdownlint-cli2 "**/*.md" "#**/node_modules"

      - name: Typecheck
        run: pnpm turbo typecheck

      # Before either lane runs, so a file no project collects is reported as
      # itself rather than as two green lanes (ADR-0011 남은 부채 2). Needs the
      # install above; `vitest list --static-parse` collects without importing, so
      # this does not touch the Redis service.
      - name: Vitest lane completeness
        run: bash scripts/ci/vitest-lane-completeness.sh

      - name: Unit tests
        run: pnpm turbo test

      - name: Redis-backed integration tests
        run: pnpm --filter=@gongzzang/web run test:integration

      - name: Build
        run: pnpm turbo build
        env:
          # next build runs in production mode; lib/env.ts requires a non-loopback
          # rediss:// URL there. The job-level loopback REDIS_URL is for the unit
          # tests (real redis service); override it for the production build only.
          REDIS_URL: rediss://redis.gongzzang.invalid:6379

      - name: Bundle size
        run: pnpm --filter=@gongzzang/web run test:bundle

      - name: Install Playwright browsers
        run: pnpm --filter=@gongzzang/web exec playwright install chromium --with-deps
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright

      - name: Playwright e2e + a11y
        run: pnpm --filter=@gongzzang/web run test:e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
          NEXT_PUBLIC_FOUNDATION_PLATFORM_BASE_URL: http://localhost:18082
          NEXT_PUBLIC_NAVER_MAPS_CLIENT_ID: ci-e2e-naver-client
          ZITADEL_ISSUER: http://localhost:8443
          ZITADEL_CLIENT_ID: ci-placeholder
          ZITADEL_AUDIENCE: ci-placeholder
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-test-secret-32-bytes-or-more-padding-padding
          INTERNAL_AUTH_SECRET: ci-e2e-internal-auth-secret-32-valid
          FOUNDATION_PLATFORM_WEBHOOK_SECRET: ci-e2e-foundation-platform-webhook-secret-32
          # Playwright runtime derives the local callback URL from its managed baseURL.
          # Do not override ZITADEL_REDIRECT_URI here; that can desync CI from the
          # isolated Playwright port and attach tests to the wrong local app.

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (SHA pin, ADR 0028)
        with:
          name: playwright-report
          path: products/gongzzang/apps/web/playwright-report/
          retention-days: 7
      - name: Save pnpm store
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 (SHA pin, ADR 0028)
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: node-cache-gongzzang-${{ runner.os }}-pnpm-${{ hashFiles('products/gongzzang/pnpm-lock.yaml') }}

  required:
    name: required/gongzzang-frontend
    if: ${{ always() }}
    needs: [scope, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require the frontend gate
        env:
          CHANGE_SCOPE_RUN: ${{ needs.scope.outputs.affected }}
          REQUIRED_RESULT_SCOPE: ${{ needs.scope.result }}
          REQUIRED_RESULT_FRONTEND: ${{ needs.frontend.result }}
        working-directory: .
        run: bash scripts/ci/require-successful-needs.sh
