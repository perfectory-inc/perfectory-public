# The Dagster instance of root ADR-0333 stage 0: its own database and role on the platform's Postgres
# (airflow-runtime.sh makes both), nothing else written outside /var/lib/dagster.
storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      port:
        env: DAGSTER_PG_PORT
      db_name: dagster
      username: dagster
      password:
        env: DAGSTER_PG_PASSWORD

# Two kinds of run (root ADR-0431 §5, ADR-0435): the observer's asset-check runs (airlift's sensor asks
# for them) and the runs of jobs Dagster runs (run_jobs.py, tagged foundation/run=job by
# job_specs.JobSpec.dagster_tags). Airflow's parallelism (compose.orchestration.yml
# AIRFLOW__CORE__PARALLELISM, 5) bounds the runs it hands Dagster (proxied). The runs of jobs Dagster decides
# (the Gold group since root ADR-0583, tagged foundation/decided-by=dagster) are held to the pools' slots
# together (spark 3 + documents 1 = 4): a pool's run waits on its slots anyway, and Gold's spark runs take
# hours. The queue admits those four and two more job runs, so a proxied run (the asset reconciler's, every
# few minutes) always finds a place, and keeps one place free for a check run, so a check never waits
# behind an hours-long job run and a job run never waits behind checks. A pool's runs never outnumber its
# slots (jobs.v1.json pools: spark 3, documents 1); the host's start (job_units.py pool-full) still decides by
# priority class and slots, whoever starts. The queue starts higher `dagster/priority` first (the job's
# priority class, then its queue weight: job_specs.dagster_priority). test_dagster_observe.py holds these
# numbers to the job list and compose.
# Every run's process is a child of the daemon: its cap counts them (compose.orchestration.yml).
run_coordinator:
  module: dagster._core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 7
    tag_concurrency_limits:
      - key: foundation/run
        value: job
        limit: 6
      - key: foundation/decided-by
        value: dagster
        limit: 4
      - key: foundation/pool
        value: spark
        limit: 3
      - key: foundation/pool
        value: documents
        limit: 1

# The default run launcher cannot tell whether a run's process is alive (dagster 1.13.27: no worker
# health check), so a run whose process died stays STARTED until its max runtime: a job's run says its
# own (job_specs.run_tags, `dagster/max_runtime_seconds`), every other run (an asset check) this hour.
# 2026-11-14 03:12Z a deploy restarted the daemon under a check run, which stayed STARTED four days.
run_monitoring:
  enabled: true
  max_runtime_seconds: 3600

local_artifact_storage:
  module: dagster._core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /var/lib/dagster/artifacts

compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /var/lib/dagster/compute-logs

# The sensor ticks every 30 s; a tick that saw nothing is not worth keeping past a week.
retention:
  sensor:
    purge_after_days:
      skipped: 7
      failure: 90
      success: -1

telemetry:
  enabled: false
