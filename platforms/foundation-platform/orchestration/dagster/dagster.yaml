# The Dagster instance of root ADR-0333 stage 0: its own database and role on the platform's Postgres
# (airflow-runtime.sh makes both), nothing else written outside /var/lib/dagster.
storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      port:
        env: DAGSTER_PG_PORT
      db_name: dagster
      username: dagster
      password:
        env: DAGSTER_PG_PASSWORD

# Two kinds of run (root ADR-0431 §5, ADR-0435): the observer's asset-check runs (airlift's sensor asks
# for them) and the runs of jobs Dagster runs (run_jobs.py, tagged foundation/run=job by
# job_specs.JobSpec.dagster_tags). Airflow's parallelism (compose.orchestration.yml
# AIRFLOW__CORE__PARALLELISM, 5) bounds the runs it hands Dagster (proxied). At most seven runs at once (the
# code server's memory, compose): the pools' slots (spark 1 + duckdb 2 + gpu 1), one default-pool load
# beside full pools, a proxied run and a check run. A pool's runs never outnumber its slots: each job's op
# names its Dagster pool (run_jobs.py) and `concurrency.pools` below counts runs, with the limits the
# deploy sets from jobs.v1.json pools (writer_gate.py ask pools, root ADR-0605). The host's start
# (job_units.py pool-full) counts the same slots for a start outside Dagster until root ADR-0583's last PR.
# The queue starts higher `dagster/priority` first (the job's priority class, then its queue weight:
# job_specs.dagster_priority), and a free place goes to the highest queued run its pool admits.
#
# No tag limit (root ADR-0612). Dagster's dequeue (1.13.27 and upstream master,
# queued_run_coordinator_daemon._get_runs_to_dequeue) counts a run against every tag limit it carries
# before it asks the run's pool, so a run its full pool holds back still uses up a place of each tag
# limit. 2026-11-23 06:40Z, after the outage: 27 spark runs queued above everything else, spark 1 full,
# 3 runs in progress; the first two spark runs used up foundation/decided-by=dagster's last two places on
# every pass, and 17 duckdb runs waited 75 minutes beside two free duckdb slots. The two limits only held
# places for the proxied and airlift runs, which end with Airflow (11-25). test_dagster_observe.py runs
# that queue through Dagster's own dequeue; test_job_specs.py holds the numbers to the job list and compose.
# Every run's process is a child of the daemon: its cap counts them (compose.orchestration.yml).
run_coordinator:
  module: dagster._core.run_coordinator
  class: QueuedRunCoordinator
  config:
    # A launch the code server does not answer in time goes back into the queue, up to three times a minute
    # apart, instead of failing (dagster 1.13.27 QueuedRunCoordinatorDaemon: DagsterUserCodeUnreachableError,
    # which a gRPC timeout raises). 2026-11-20 15:35Z, load in the 20s-40s, map_edit_fold_admin's tick run
    # was failed on "Unexpected error in IPC client"; its worker started later and was ignored, so the tick
    # was lost (the next one ran). A re-queued run is QUEUED, so such a late worker is still ignored and
    # the retry launches it once.
    max_user_code_failure_retries: 3
    user_code_failure_retry_delay: 60

# Dagster's own pools (root ADR-0605): a run holds one slot of its op's pool from dequeue to its end
# (granularity run; op granularity would start runs whose one op then waits, each a 170 MiB process). A
# pool's limit is the job list's, set by the deploy; a pool it has not set yet starts one run at a time.
concurrency:
  pools:
    granularity: run
    default_limit: 1
  # The run queue's limits (above). With a `concurrency` section Dagster reads them only here: one left in
  # run_coordinator's config makes the instance refuse to load (dagster 1.13.27
  # validate_concurrency_config; 2026-11-23 from about 01:35Z the daemon and both webservers restarted in a
  # loop on the root ADR-0605 deploy, and no run Dagster decides was queued or started).
  runs:
    max_concurrent_runs: 7

# The default run launcher cannot tell whether a run's process is alive (dagster 1.13.27: no worker
# health check), so a run whose process died stays STARTED until its max runtime: a job's run says its
# own (job_specs.run_tags, `dagster/max_runtime_seconds`), every other run (an asset check) this hour.
# 2026-11-14 03:12Z a deploy restarted the daemon under a check run, which stayed STARTED four days.
run_monitoring:
  enabled: true
  max_runtime_seconds: 3600
  # A cancelled or failed run's pool slot is freed this long after it ends: Dagster frees none by itself,
  # so one cancelled run would hold a one-slot pool for good (dagster 1.13 docs, concurrency pools).
  free_slots_after_run_end_seconds: 300

local_artifact_storage:
  module: dagster._core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /var/lib/dagster/artifacts

compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /var/lib/dagster/compute-logs

# The sensor ticks every 30 s; a tick that saw nothing is not worth keeping past a week.
retention:
  sensor:
    purge_after_days:
      skipped: 7
      failure: 90
      success: -1

telemetry:
  enabled: false
