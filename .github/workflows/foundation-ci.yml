name: Foundation Platform CI

on:
  # A history-free public-root push has no comparable parent for path filters;
  # keep an explicit, auditable way to run this required context on that root.
  workflow_dispatch:
  # Pull requests are intentionally unfiltered. A path-filtered workflow can
  # leave its required check pending forever when GitHub skips the workflow.
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    paths:
      - "platforms/foundation-platform/**"
      - "scripts/tiles/**"
      - "scripts/verify/integration.sh"
      - "scripts/verify/foundation-kafka-live.sh"
      - "scripts/verify/foundation-r2-lakehouse-live.sh"
      - "scripts/guard/foundation-r2-lakehouse-live-self-test.sh"
      - "scripts/guard/foundation-kafka-contract.sh"
      - "scripts/ci/osv-vulnerability-gate.sh"
      - "scripts/guard/check-osv-vulnerability-baseline.py"
      - "scripts/guard/osv-vulnerability-ratchet-self-test.sh"
      - "tools/osv-scanner.env"
      - "tools/osv-vulnerability-baseline.tsv"
      - "**/Cargo.lock"
      - "**/pnpm-lock.yaml"
      - "platforms/intelligence-platform/docker/c2-event-backbone.compose.yml"
      - "docs/technology-stack.md"
      - "docs/adr/**"
      # `administrative_boundary_contract` asserts on these two documents, so a
      # change to either must rerun the test that guards it.
      # `area-ci-input-coverage` derives this requirement from the sources.
      - "docs/architecture/**"
      - ".github/workflows/foundation-ci.yml"
      - ".github/workflows/gongzzang-frontend.yml"
      # Shared verification SSOT (ADR-0004): xtask / the cargo alias / the
      # toolchain pin change how THIS area is verified, so they must retrigger it.
      # monorepo-guard `xtask-path-coverage` enforces this for every area CI.
      - "tools/xtask/**"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
permissions:
  contents: read

defaults:
  run:
    working-directory: platforms/foundation-platform

concurrency:
  group: foundation-platform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.96.0"
  CARGO_DENY_VERSION: "0.19.8"
  SYFT_VERSION: "v1.44.0"
  SYFT_LINUX_AMD64_SHA256: "0e91737aee2b5baf1d255b959630194a302335d848ff97bb07921eb6205b5f5a"

jobs:
  rust-quality:
    name: Rust fmt, unit tests, clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false

      - name: Verify Foundation CI scope selection
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/test_foundation_ci_scope.py -v

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8 (SHA pin, ADR 0028)
        with:
          version: 9.12.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (SHA pin, ADR 0028)
        with:
          node-version: "20.19.0"
          cache: pnpm
          cache-dependency-path: platforms/foundation-platform/services/foundation-profile-gateway/pnpm-lock.yaml

      # Foundation-specific: the committed Catalog OpenAPI artifact must match a
      # fresh export (this builds+runs export-catalog-openapi, which compiles what
      # it needs — the standalone build step is redundant with xtask clippy below).
      - name: Verify generated Catalog OpenAPI artifact
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet -p foundation-api --bin export-catalog-openapi -- /tmp/catalog.v1.json
          cmp docs/openapi/catalog.v1.json /tmp/catalog.v1.json

      # Single verification SSOT (ADR-0004): xtask owns fmt+clippy+test with the
      # one flag policy. Runs from the repo root (this job defaults to the area).
      - name: Verify (fmt, clippy, test)
        working-directory: ${{ github.workspace }}
        run: cargo xtask verify foundation

      - name: Verify exact static-release executable toolchain
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          tool_directory="$RUNNER_TEMP/static-release-toolchain"
          python3 scripts/tiles/static_release_toolchain_contract.py install \
            --destination "$tool_directory" --platform linux-x86_64 --timeout-seconds 30
          export PATH="$tool_directory:$PATH"
          cd platforms/foundation-platform
          timeout --foreground 300s cargo run --locked -p foundation-outbox-publisher -- \
            verify-static-release-toolchain

      - name: Verify R2 live lane fails closed without credentials
        working-directory: ${{ github.workspace }}
        run: bash scripts/guard/foundation-r2-lakehouse-live-self-test.sh

  static-release-toolchain-windows:
    name: Static-release executable toolchain (Windows)
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select Windows static-release toolchain gate
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          FOUNDATION_CI_EVENT_NAME: ${{ github.event_name }}
          FOUNDATION_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FOUNDATION_CI_HEAD: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
          FOUNDATION_CI_REPOSITORY: ${{ github.workspace }}
        run: |
          python scripts/ci/foundation_ci_scope.py `
            --gate static-release-toolchain-windows `
            --event-name $env:FOUNDATION_CI_EVENT_NAME `
            --base $env:FOUNDATION_CI_BASE `
            --head $env:FOUNDATION_CI_HEAD `
            --repository $env:FOUNDATION_CI_REPOSITORY `
            --github-env $env:GITHUB_ENV

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          if ($env:FOUNDATION_CI_GATE_SELECTED -ne "true") {
            Write-Host "Static-release Windows toolchain is unaffected; gate succeeds without tool installation."
            exit 0
          }
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN

      - name: Verify exact static-release executable toolchain
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          if ($env:FOUNDATION_CI_GATE_SELECTED -ne "true") {
            Write-Host "Static-release Windows toolchain is unaffected; gate succeeds without verification."
            exit 0
          }
          $toolDirectory = Join-Path $env:RUNNER_TEMP "static-release-toolchain"
          python scripts/tiles/static_release_toolchain_contract.py install `
            --destination $toolDirectory --platform windows-x86_64 --timeout-seconds 30
          $env:PATH = "$toolDirectory$([IO.Path]::PathSeparator)$env:PATH"
          Set-Location platforms/foundation-platform
          cargo run --locked -p foundation-outbox-publisher -- verify-static-release-toolchain

  supply-chain:
    name: Supply-chain release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - name: Install supply-chain tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          fi
          if ! command -v syft >/dev/null 2>&1; then
            version="${SYFT_VERSION#v}"
            archive="/tmp/syft_${version}_linux_amd64.tar.gz"
            curl -sSfL --output "$archive" \
              "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${version}_linux_amd64.tar.gz"
            echo "$SYFT_LINUX_AMD64_SHA256  $archive" | sha256sum --check --strict -
            tar xzf "$archive" -C "$HOME/.local/bin" syft
          fi

      - name: Run supply-chain tools (cargo-deny, SBOM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/supply-chain-tools
          cargo-deny check --hide-inclusion-graph
          source_version="${GITHUB_SHA:-$(git rev-parse --verify HEAD)}"
          syft "dir:." --exclude='./.git/**' --exclude='./target/**' --source-name=foundation-platform --source-version="$source_version" --output=cyclonedx-json=target/supply-chain-tools/cyclonedx-bom.json

      - name: Run repository OSV vulnerability ratchet
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/osv-vulnerability-gate.sh --report-path platforms/foundation-platform/target/supply-chain-tools/osv-report.json

      - name: Upload supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 (SHA pin, ADR 0028)
        with:
          name: supply-chain-reports
          # path: is relative to $GITHUB_WORKSPACE — defaults.run.working-directory does NOT apply to uses: steps
          path: |
            platforms/foundation-platform/target/supply-chain-tools/cyclonedx-bom.json
            platforms/foundation-platform/target/supply-chain-tools/osv-report.json
          if-no-files-found: warn

  postgres-integration:
    name: Postgres integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine@sha256:fe9821935d163abca5611e3e0a6a7c73c8c547f3412ed2036ec0ed8f789390da
        ports:
          - 5432/tcp
        env:
          POSTGRES_USER: foundation_platform
          POSTGRES_PASSWORD: foundation_platform_dev_2026
          POSTGRES_DB: foundation_platform
        options: >-
          --health-cmd "pg_isready -U foundation_platform -d foundation_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false

      - name: Set dynamic database URL
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: echo "DATABASE_URL=postgres://foundation_platform:foundation_platform_dev_2026@localhost:${POSTGRES_PORT}/foundation_platform" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Install database client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1 && sudo -n true; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends postgresql-client
            else
              echo "::error::postgresql-client is missing and the GitHub-hosted runner does not provide passwordless sudo"
              exit 1
            fi
          fi
          psql --version

      - name: Run migrations through the production runner
        run: FOUNDATION_MIGRATOR_DATABASE_URL="$DATABASE_URL" cargo run --locked --quiet -p foundation-api --bin foundation-migrate

      - name: Seed local vector tile manifest
        run: psql "$DATABASE_URL" -f infra/db/seeds/local_vector_tile_manifest.sql

      # The integration test COMMAND is the single SSOT in xtask (ADR-0004), the
      # same one `scripts/verify/integration.sh foundation` runs locally against a
      # disposable DB. DATABASE_URL (set above) is the already-provisioned database.
      - name: Run ignored integration tests (xtask SSOT)
        working-directory: ${{ github.workspace }}
        env:
          FOUNDATION_PLATFORM_RUNTIME_ENV: ci
          FOUNDATION_PLATFORM_EXECUTION_CONTEXT: ci
        run: cargo xtask integration foundation

  kafka-integration:
    name: Kafka and Schema Registry integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      FOUNDATION_KAFKA_COMPOSE_PROJECT: foundation-kafka-ci-${{ github.run_id }}
      FOUNDATION_TEST_KAFKA_REQUIRED: "1"
      INTELLIGENCE_TEST_KAFKA_HOST_PORT: 19092
      INTELLIGENCE_TEST_KARAPACE_HOST_PORT: 18081

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select Kafka integration gate
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          FOUNDATION_CI_EVENT_NAME: ${{ github.event_name }}
          FOUNDATION_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FOUNDATION_CI_HEAD: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
          FOUNDATION_CI_REPOSITORY: ${{ github.workspace }}
        run: |
          python3 scripts/ci/foundation_ci_scope.py \
            --gate kafka-integration \
            --event-name "$FOUNDATION_CI_EVENT_NAME" \
            --base "$FOUNDATION_CI_BASE" \
            --head "$FOUNDATION_CI_HEAD" \
            --repository "$FOUNDATION_CI_REPOSITORY" \
            --github-env "$GITHUB_ENV"

      - name: Start Postgres service
        shell: bash
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Kafka contracts are unaffected; Postgres is not started."
            exit 0
          fi
          set -euo pipefail
          docker run -d --rm --name foundation-kafka-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=foundation_platform \
            --env POSTGRES_PASSWORD=foundation_platform_dev_2026 \
            --env POSTGRES_DB=foundation_platform \
            --health-cmd "pg_isready -U foundation_platform -d foundation_platform" \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            postgis/postgis:17-3.5-alpine@sha256:fe9821935d163abca5611e3e0a6a7c73c8c547f3412ed2036ec0ed8f789390da
          for _ in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' foundation-kafka-postgres)" = healthy ]; then
              echo "DATABASE_URL=postgres://foundation_platform:foundation_platform_dev_2026@localhost:5432/foundation_platform" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Kafka integration Postgres did not become healthy"
          exit 1

      - name: Install Rust toolchain
        shell: bash
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Kafka contracts are unaffected; Rust toolchain installation is not needed."
            exit 0
          fi
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Install database client
        shell: bash
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Kafka contracts are unaffected; database client installation is not needed."
            exit 0
          fi
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Install Kafka Rust native build dependencies
        shell: bash
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Kafka contracts are unaffected; native dependency installation is not needed."
            exit 0
          fi
          set -euo pipefail
          # Keep this host-side live gate on the same complete native header set
          # declared by tools/xtask for Foundation's --all-features build.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev

      - name: Run migrations through the production runner
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Kafka contracts are unaffected; migrations are not needed."
            exit 0
          fi
          FOUNDATION_MIGRATOR_DATABASE_URL="$DATABASE_URL" cargo run --locked --quiet -p foundation-api --bin foundation-migrate

      - name: Run real Kafka/Schema Registry live gate
        working-directory: ${{ github.workspace }}
        env:
          FOUNDATION_PLATFORM_RUNTIME_ENV: ci
          FOUNDATION_PLATFORM_EXECUTION_CONTEXT: ci
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Kafka contracts are unaffected; live gate succeeds without starting Kafka."
            exit 0
          fi
          bash scripts/verify/foundation-kafka-live.sh

      - name: Clean Kafka compose resources
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Kafka contracts are unaffected; no containers require cleanup."
            exit 0
          fi
          cleanup_status=0
          timeout --foreground 120s docker compose -p "$FOUNDATION_KAFKA_COMPOSE_PROJECT" -f platforms/intelligence-platform/docker/c2-event-backbone.compose.yml down -v --remove-orphans || cleanup_status=$?
          docker rm -f foundation-kafka-postgres >/dev/null 2>&1 || true
          exit "$cleanup_status"

  compose-smoke:
    name: Independent Foundation Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOUNDATION_ADMIN_PASSWORD: compose_admin_ci
      FOUNDATION_MIGRATOR_PASSWORD: compose_migrator_ci
      FOUNDATION_API_PASSWORD: compose_api_ci
      FOUNDATION_DB_PORT: 15434
      FOUNDATION_API_PORT: 18080
      FOUNDATION_REDIS_PORT: 16379
      FOUNDATION_PLATFORM_RUNTIME_ENV: ci
      FOUNDATION_PLATFORM_EXECUTION_CONTEXT: ci
      FOUNDATION_PLATFORM_OBJECT_STORAGE_DRIVER: log
      IDENTITY_API_BASE_URL: https://identity.example.test
      ZITADEL_ISSUER_URL: http://127.0.0.1:18081
      FOUNDATION_PLATFORM_ZITADEL_AUDIENCE: foundation-api

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select Compose smoke gate
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          FOUNDATION_CI_EVENT_NAME: ${{ github.event_name }}
          FOUNDATION_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FOUNDATION_CI_HEAD: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
          FOUNDATION_CI_REPOSITORY: ${{ github.workspace }}
        run: |
          python3 scripts/ci/foundation_ci_scope.py \
            --gate compose-smoke \
            --event-name "$FOUNDATION_CI_EVENT_NAME" \
            --base "$FOUNDATION_CI_BASE" \
            --head "$FOUNDATION_CI_HEAD" \
            --repository "$FOUNDATION_CI_REPOSITORY" \
            --github-env "$GITHUB_ENV"

      - name: Build and start clean Compose stack
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Foundation Compose inputs are unaffected; stack startup is not needed."
            exit 0
          fi
          scripts/compose-smoke.sh -- start-api

      - name: Wait for Foundation API readiness
        shell: bash
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Foundation Compose inputs are unaffected; readiness is already satisfied."
            exit 0
          fi
          set -euo pipefail
          container_id="$(timeout --foreground 10s docker compose --profile compose-smoke ps -q foundation-api-smoke)"
          test -n "$container_id"
          test "$(timeout --foreground 10s docker inspect --format '{{.State.Health.Status}}' "$container_id")" = healthy

      - name: Verify one-shot helper UIDs
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Foundation Compose inputs are unaffected; UID verification is not needed."
            exit 0
          fi
          scripts/compose-smoke.sh -- verify-uids

      - name: Re-run migration chain on the same volume
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Foundation Compose inputs are unaffected; migration replay is not needed."
            exit 0
          fi
          scripts/compose-smoke.sh -- rerun-api

      - name: Verify migration and least-privilege runtime contract
        shell: bash
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Foundation Compose inputs are unaffected; runtime contract is already satisfied."
            exit 0
          fi
          set -euo pipefail
          contract="$(docker compose exec -T postgres psql -X -A -t -v ON_ERROR_STOP=1 -U foundation_admin -d foundation -c "
            SELECT
              NOT EXISTS (
                SELECT 1 FROM pg_catalog.pg_roles
                WHERE rolname IN ('foundation_migrator','foundation_api')
                  AND (rolsuper OR rolcreatedb OR rolcreaterole OR rolinherit OR rolreplication OR rolbypassrls)
              )
              AND has_schema_privilege('foundation_api', 'catalog', 'USAGE')
              AND NOT has_schema_privilege('foundation_api', 'catalog', 'CREATE')
              AND has_table_privilege('foundation_api', 'catalog.industrial_complex', 'SELECT,INSERT,UPDATE,DELETE')
              AND NOT EXISTS (
                SELECT 1 FROM public._sqlx_migrations
                WHERE NOT success
              );")"
          test "$contract" = "t"
          ! docker compose exec -T foundation-api env | grep -E 'FOUNDATION_(ADMIN|MIGRATOR)_PASSWORD|foundation_(admin|migrator)'

      - name: Clean Compose resources
        if: always()
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Foundation Compose inputs are unaffected; no containers require cleanup."
            exit 0
          fi
          timeout --foreground 120s docker compose down -v --remove-orphans

  boundary-slice:
    name: Boundary vertical slice
    runs-on: ubuntu-24.04
    # The slice compiles the publisher from source inside a pinned container before it can publish,
    # so its budget is closer to compose-smoke's than to a test job's.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select boundary slice gate
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          FOUNDATION_CI_EVENT_NAME: ${{ github.event_name }}
          FOUNDATION_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FOUNDATION_CI_HEAD: ${{ github.event.pull_request.head.sha || github.event.after || github.sha }}
          FOUNDATION_CI_REPOSITORY: ${{ github.workspace }}
        run: |
          python3 scripts/ci/foundation_ci_scope.py \
            --gate boundary-slice \
            --event-name "$FOUNDATION_CI_EVENT_NAME" \
            --base "$FOUNDATION_CI_BASE" \
            --head "$FOUNDATION_CI_HEAD" \
            --repository "$FOUNDATION_CI_REPOSITORY" \
            --github-env "$GITHUB_ENV"

      # The only path that carries a publication unit from a source snapshot all the way to a
      # decoded tile: PostGIS projection load, CAS runtime-manifest promotion, Martin serving the
      # release the pointer names, and an MVT decoder asserting the layer and its properties. Every
      # step of it was already covered by some test; that a step's output is the next step's input
      # was not, and no amount of per-step testing can show it. It provisions its own Postgres and
      # Martin from digest-pinned images and needs no credentials, so it runs here unchanged rather
      # than as a second copy shaped for CI.
      #
      # It covers `admin` and `complex` in one run, sharing the containers rather than paying for a
      # second job's images and compile. For `complex` it also proves the negative: the layer is
      # empty in a tile Martin cuts from a written-but-unpromoted load, and populated in the same
      # tile after the promotion.
      #
      # It is slower than its work: the stock `rust` image does not carry the components
      # `rust-toolchain.toml` asks for, so rustup fetches four of them at run time — the same hidden
      # download that was moved into the verification image. Baking a slice image would remove it,
      # and that is a separate change: this job's images are digest-pinned public ones, while the
      # verification image is built locally and CI has no copy.
      - name: Prove the boundary serving path end to end
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Boundary publication inputs are unaffected; vertical slice succeeds without containers."
            exit 0
          fi
          bash scripts/tiles/boundary-slice-proof.sh

  required:
    name: required/foundation
    if: ${{ always() }}
    needs: [rust-quality, static-release-toolchain-windows, supply-chain, postgres-integration, kafka-integration, compose-smoke, boundary-slice]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require every Foundation gate
        env:
          REQUIRED_RESULT_RUST_QUALITY: ${{ needs.rust-quality.result }}
          REQUIRED_RESULT_STATIC_RELEASE_TOOLCHAIN_WINDOWS: ${{ needs.static-release-toolchain-windows.result }}
          REQUIRED_RESULT_SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          REQUIRED_RESULT_POSTGRES_INTEGRATION: ${{ needs.postgres-integration.result }}
          REQUIRED_RESULT_KAFKA_INTEGRATION: ${{ needs.kafka-integration.result }}
          REQUIRED_RESULT_COMPOSE_SMOKE: ${{ needs.compose-smoke.result }}
          REQUIRED_RESULT_BOUNDARY_SLICE: ${{ needs.boundary-slice.result }}
        working-directory: .
        run: bash scripts/ci/require-successful-needs.sh
