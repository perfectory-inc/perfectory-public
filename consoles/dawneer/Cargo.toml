[workspace]
resolver = "2"
members = ["server"]

[workspace.package]
edition = "2021"
rust-version = "1.99.1"
license-file = "../../LICENSES/LicenseRef-Proprietary.txt"
authors = ["Perfectory"]
publish = false

# Dawneer staff console (root ADR-0114, ADR-0116). The server is the BFF: it holds staff tokens and
# relays an allow-list of platform routes. It owns no domain data.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_imports = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Rust 1.99 `assert_is_empty`: its fix (`assert_eq!(x, [] as [T; 0])`) reads worse than
# `assert!(x.is_empty())` at ~260 sites; revisit when the suggestion improves (toolchain wave 2026-10-21).
assert_is_empty = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
axum-extra = { version = "0.12", default-features = false, features = ["cookie"] }
base64 = "0.22"
# The cookie crate axum-extra builds on, for its `time` re-export (Max-Age).
cookie = "0.18"
getrandom = "0.3"
# Test-only: the fake issuer signs its ID tokens with an RSA key made at test time.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.8"
rsa = "0.10"
# OpenID Connect relying party: discovery, PKCE, nonce and ID token verification (root ADR-0116 §1).
openidconnect = { version = "4.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Staff sessions in Postgres (root ADR-0116 §7): records and their expiry from tower-sessions; the
# memory store for tests and a local http run.
tower-sessions-core = { version = "0.15", features = ["deletion-task"] }
tower-sessions-memory-store = "0.15"
tower-sessions-sqlx-store = { version = "0.16", features = ["postgres"] }
time = "0.3"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }

# The fake issuer's RSA key is made at test time (no private key is committed); unoptimized,
# its prime search takes tens of seconds.
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.rsa]
opt-level = 3
