route:
  receiver: prelaunch-audit
  group_by:
    - alertname
    - service
    - environment
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Every `severity: ticket` alert but the security advisories (root ADR-0591): one message per rule,
    # naming each of its alerts, at most once an hour while the set changes and once a day while it
    # stays, and none when it resolves. 2026-11-14..19 #alerts got about 480 messages a day, about two
    # thirds of them tickets sent one per item and again on resolve, so no line meant anything. A
    # ticket is read in a batch; a page (below) is read when it comes.
    # The operations map's problems (root ADR-0195), which had their own per-job route, are all
    # tickets and come here.
    - matchers:
        - severity = "ticket"
        - service != "security"
      receiver: prelaunch-audit-ticket
      group_by:
        - alertname
      group_wait: 5m
      group_interval: 1h
      repeat_interval: 24h
    # A host unit that reports its successes as well as its failures
    # (scripts/ops/notify-unit-failure.sh): one notice per unit when it starts failing, one when a
    # run succeeds again, and a reminder a day while it keeps failing. 2026-10-28/29 the hourly
    # by-PNU serving monitors sent a notice per lane every hour and buried the real failures.
    - matchers:
        - service = "unit-failure"
      group_by:
        - alertname
        - unit
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 24h
    # A unit that stayed failed six hours, or a failed unit with no owner (root ADR-0445): the owner
    # is called by name with a channel mention, and again every twelve hours until the unit runs
    # cleanly. 2026-11-01..07 nine units stayed failed for days after a single notice each.
    - matchers:
        - service = "unit-state"
      group_by:
        - alertname
        - unit
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
    # A job whose unit succeeds and that produces nothing it is expected to (root ADR-0480): one notice
    # per job and expectation, a reminder every twelve hours until it meets it, as a unit that stays
    # failed is called (unit-state). 2026-11-06..09 a check waited for a chain never provisioned and ten
    # refused loads said `waiting`, with no failed unit and so no notice at all.
    - matchers:
        - service = "job-outcome"
      group_by:
        - alertname
        - job_id
        - expectation
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
    # Users see old data (FoundationByPnuServingStale, root ADR-0306): one notice per bake that publishes
    # the stale lanes, naming each lane, and a reminder every twelve hours until it publishes, as a unit
    # that stays failed is called (unit-state; every four hours until 2026-11-20, root ADR-0591: three
    # bakes stale since 11-14 made eighteen messages a day). The daily
    # reminder of a failed unit was read past for eight days (2026-10-28..11-05, the 공매 lane's 191-hour
    # pre-photo manifest). One notice per lane was one condition counted eight times: 2026-10-31..11-07
    # the panel bake's eight lanes made 2,057 monitor failures out of one unpublished bake (W83b).
    - matchers:
        - service = "serving-freshness"
      group_by:
        - alertname
        - bake_job
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
    # Dagster decided a job's run differently from Airflow in the dual run (root ADR-0458): one notice
    # per job, and a reminder a day while the comparisons keep differing; the job's agreeing count
    # starts again from the difference, so it does not move to Dagster until the rules agree.
    - matchers:
        - service = "dual-run"
      group_by:
        - alertname
        - job
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 24h
    # A provider that refuses our account, and the staging smoke inputs that skipped (root ADR-0363,
    # scripts/ops/provider_alert.py). 2026-10-30 VWorld wanted new terms accepted: one notice per
    # provider with the owner action when it starts, one when a login works again, a reminder a day.
    - matchers:
        - service = "provider-account"
      group_by:
        - alertname
        - provider
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 24h
    # The repository's open security advisories (root ADR-0278): one notice per advisory when it
    # opens and one when it is gone, the same way as the operations map's problems.
    - matchers:
        - service = "security"
      group_by:
        - alertname
        - source
        - advisory
        - package
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 8760h

# A job waiting on a failed one says "blocked"; while any job has failed, its own notice is the
# one to read, and every blocked job would only repeat it.
inhibit_rules:
  - source_matchers:
      - alertname = "FoundationScheduledJobProblem"
      - kind = "failed"
    target_matchers:
      - alertname = "FoundationScheduledJobProblem"
      - kind = "blocked"
    equal:
      - alertname
  # A job that failed is not done: its failure notice, and its unit's, already say so (root ADR-0442 §5:
  # one event, one notice). A job that is not done and has not failed (it waits, is skipped, refused or
  # never started) has no other notice, and keeps this one.
  - source_matchers:
      - alertname = "FoundationScheduledJobProblem"
      - kind = "failed"
    target_matchers:
      - alertname =~ "FoundationJobOutcomeMissing(Long)?"
      - expectation = "done"
    equal:
      - job_id
  - source_matchers:
      - alertname = "FoundationUnitFailedLong"
    target_matchers:
      - alertname =~ "FoundationJobOutcomeMissing(Long)?"
      - expectation = "done"
    equal:
      - unit

  # The long notice of a job's missing outcome is the short one six hours on (root ADR-0480); while
  # it fires the short one only repeats it (root ADR-0591).
  - source_matchers:
      - alertname = "FoundationJobOutcomeMissingLong"
    target_matchers:
      - alertname = "FoundationJobOutcomeMissing"
    equal:
      - job_id
      - expectation
  # foundation-api is the one exporter of the security series (root ADR-0278): while Prometheus cannot
  # scrape it, "advisories unreadable" is that scrape failure said again (2026-11-19, root ADR-0591).
  # One target, so no label to match on.
  - source_matchers:
      - alertname = "FoundationPlatformApiScrapeDown"
    target_matchers:
      - alertname = "FoundationSecurityAdvisoriesUnreadable"

receivers:
  - name: prelaunch-audit
    # The bot token is a credential and lives outside this file: the compose file mounts it from
    # the host, because a receiver with no destination is how six weeks of alerts went nowhere
    # (2026-09-02 finding; the runbook owns the setup and ends with a delivery proof).
    #
    # Token mode, not webhook mode, by owner decision (2026-09-03): api_url is Slack's Web API
    # and the Authorization header carries the bot token. One caveat the delivery proof exists
    # for: the Web API answers HTTP 200 even for logical failures (unknown channel, revoked
    # token), so only a message seen in the channel counts as delivered.
    slack_configs:
      - channel: '#alerts'
        api_url: https://slack.com/api/chat.postMessage
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/secrets/slack-bot-token
        send_resolved: true
        title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}
  # The same channel and bot for the tickets, without a message when they resolve (`send_resolved`
  # defaults to false for Slack): a batch read later needs no "it is gone" line (root ADR-0591).
  - name: prelaunch-audit-ticket
    slack_configs:
      - channel: '#alerts'
        api_url: https://slack.com/api/chat.postMessage
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/secrets/slack-bot-token
        title: 'TICKET {{ .CommonLabels.alertname }} ({{ len .Alerts }})'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}
