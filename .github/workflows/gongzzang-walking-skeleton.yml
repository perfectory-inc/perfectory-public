name: walking-skeleton

on:
  # Required context must also be runnable for a history-free public root.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    # Intentionally unfiltered so required/gongzzang-e2e always reports.

defaults:
  run:
    working-directory: products/gongzzang

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  POSTGRES_USER: gongzzang
  POSTGRES_PASSWORD: ci_only_changeme
  POSTGRES_DB: gongzzang

jobs:
  # Root ADR-0201: whether this workflow's area changed (tools/ci/change-scope.json).
  # An untouched area skips every job below and required/* still reports success.
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.select.outputs.affected }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Select
        id: select
        working-directory: .
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: python3 scripts/ci/change_scope.py select --workflow gongzzang-walking-skeleton.yml

  e2e:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' }}
    name: API + Auth E2E (mock JWT mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine@sha256:fe9821935d163abca5611e3e0a6a7c73c8c547f3412ed2036ec0ed8f789390da
        env:
          POSTGRES_USER: gongzzang
          POSTGRES_PASSWORD: ci_only_changeme
          POSTGRES_DB: gongzzang
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gongzzang"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://gongzzang:ci_only_changeme@localhost:5432/gongzzang

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false

      - name: Set up Rust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          workspaces: |
            products/gongzzang
            tools/xtask
          shared-key: walking-skeleton
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install sqlx-cli + postgres client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl postgresql-client python3
          cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features postgres,rustls

      # Native replacement for the deleted ci_walking_skeleton_e2e graph-build
      # transition target (was just a wrapper around
      # run_ci_transition_task.sh::run_walking_skeleton_e2e).
      - name: Run walking-skeleton E2E
        run: bash scripts/ci/walking-skeleton-e2e.sh

      - name: Dump API log on failure
        if: failure()
        run: |
          echo "=== gongzzang-api.log ==="
          if [ -f /tmp/gongzzang-api.log ]; then
            cat /tmp/gongzzang-api.log
          else
            echo "gongzzang-api.log missing"
          fi

  required:
    name: required/gongzzang-e2e
    if: ${{ always() }}
    needs: [scope, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require the walking-skeleton gate
        env:
          CHANGE_SCOPE_RUN: ${{ needs.scope.outputs.affected }}
          REQUIRED_RESULT_SCOPE: ${{ needs.scope.result }}
          REQUIRED_RESULT_E2E: ${{ needs.e2e.result }}
        working-directory: .
        run: bash scripts/ci/require-successful-needs.sh
