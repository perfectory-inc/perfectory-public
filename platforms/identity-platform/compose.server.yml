# Server overlay for the identity runtime (root ADR-0080).
# identity-api joins the shared network where Zitadel lives, and a socat
# sidecar borrows its network namespace so the configured issuer
# http://127.0.0.1:18453 answers from inside the container. The sidecar is a
# compose service on purpose: recreating identity-api recreates it too.
services:
  identity-api:
    networks:
      default:
      identity-shared:
        aliases:
          - identity-api

  zitadel-loopback:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    restart: unless-stopped
    network_mode: "service:identity-api"
    command: ["TCP-LISTEN:18453,fork,reuseaddr,bind=127.0.0.1", "TCP:zitadel:18453"]
    depends_on:
      identity-api:
        condition: service_started

networks:
  identity-shared:
    external: true
