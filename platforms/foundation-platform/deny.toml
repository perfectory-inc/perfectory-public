[graph]
# hakari writes the workspace-hack crate (root ADR-0269); its plain version lines are the point,
# not a second declaration. Every crate it names is a dependency of a member, so out of the graph
# it takes nothing out of the licence, advisory and ban checks.
exclude = ["foundation-workspace-hack"]
all-features = true

[advisories]
yanked = "deny"
# Fail on unmaintained/unsound advisories anywhere in the dependency graph, not just
# workspace-local crates, so transitive advisories are caught rather than silently
# scope-excluded. Accepted findings must be listed explicitly in `ignore` with a
# justification (see foundation-platform adversarial review PCR2-73 / remediation #10).
unmaintained = "all"
unsound = "all"
# An ignore the graph no longer needs fails, and every ignore carries its osv-scanner.toml ignoreUntil as its expiry (root ADR-0414).
unused-ignored-advisory = "deny"
# Accepted, tracked transitive finding (remove once fixed upstream):
# RUSTSEC-2024-0436 is pulled in only by Apache Parquet 59.1.0. Apache removed
# `paste` upstream, but as of 2026-07-23 no released 59.x version contains that
# change (and the newer 58.4.0 patch release still declares `paste`). Pinning an
# unreleased Git revision or downgrading the Arrow/Parquet stack would widen risk,
# so retain this compile-time-only maintenance exception until a compatible
# release is published, then upgrade Parquet and delete it.
ignore = [
    { id = "RUSTSEC-2024-0436", expiry = "2027-02-02", reason = "parquet 59.1.0 still directly depends on paste; no compatible released Parquet 59.x removes it as of 2026-07-23; rav1e 0.8.1 (the AVIF encoder of the photo ladder, root ADR-0427) uses it as a compile-time proc-macro too" },
    { id = "RUSTSEC-2026-0543", expiry = "2027-02-16", reason = "chrono is unmaintained (informational, all versions; no fixed release exists as of 2026-11-18, latest 0.4.45); it is a direct dependency here and is also pulled by sqlx-core, arrow, parquet, iceberg, calamine, croner and serde_with, so it cannot leave the lockfile by our change alone; mirrors osv-scanner.toml (root ADR-0414); review by 2027-02-16" },
    { id = "RUSTSEC-2026-0574", expiry = "2026-12-19", reason = "heapless 0.8.0 via rstar 0.12.2 via geo 0.33.1 (catalog-domain); unsound (informational), fixed only in heapless >=0.9.4, which needs rstar 0.14, which geo supports only on main (georust/geo#1641, merged 2026-11-12, unreleased; crates.io geo 0.33.1 requires rstar ^0.12); rstar uses only heapless::binary_heap (none of the flagged APIs; -0577's IntoIter::drop needs a panicking element Drop, rstar's elements are a reference and a distance); mirrors osv-scanner.toml (root ADR-0414); review by 2026-12-19" },
    { id = "RUSTSEC-2026-0575", expiry = "2026-12-19", reason = "same as RUSTSEC-2026-0574 (heapless <0.9.4 unsound via rstar 0.12.2 via geo 0.33.1; georust/geo#1641 unreleased); review by 2026-12-19" },
    { id = "RUSTSEC-2026-0576", expiry = "2026-12-19", reason = "same as RUSTSEC-2026-0574 (heapless <0.9.4 unsound via rstar 0.12.2 via geo 0.33.1; georust/geo#1641 unreleased); review by 2026-12-19" },
    { id = "RUSTSEC-2026-0577", expiry = "2026-12-19", reason = "same as RUSTSEC-2026-0574 (heapless <0.9.4 unsound via rstar 0.12.2 via geo 0.33.1; georust/geo#1641 unreleased); review by 2026-12-19" },
    { id = "RUSTSEC-2026-0578", expiry = "2026-12-19", reason = "same as RUSTSEC-2026-0574 (heapless <0.9.4 unsound via rstar 0.12.2 via geo 0.33.1; georust/geo#1641 unreleased); review by 2026-12-19" },
    { id = "RUSTSEC-2026-0579", expiry = "2026-12-19", reason = "same as RUSTSEC-2026-0574 (heapless <0.9.4 unsound via rstar 0.12.2 via geo 0.33.1; georust/geo#1641 unreleased); review by 2026-12-19" },
    { id = "RUSTSEC-2026-0580", expiry = "2026-12-19", reason = "same as RUSTSEC-2026-0574 (heapless <0.9.4 unsound via rstar 0.12.2 via geo 0.33.1; georust/geo#1641 unreleased); review by 2026-12-19" },
    { id = "RUSTSEC-2026-0581", expiry = "2026-12-19", reason = "same as RUSTSEC-2026-0574 (heapless <0.9.4 unsound via rstar 0.12.2 via geo 0.33.1; georust/geo#1641 unreleased); review by 2026-12-19" },
    { id = "RUSTSEC-2026-0582", expiry = "2026-12-19", reason = "same as RUSTSEC-2026-0574 (heapless <0.9.4 unsound via rstar 0.12.2 via geo 0.33.1; georust/geo#1641 unreleased); review by 2026-12-19" },
]

[licenses]
confidence-threshold = 0.92
unused-allowed-license = "allow"
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
# libfuzzer-sys (NCSA, OSI approved) is a `cfg(fuzzing)` dependency of rav1e, the AVIF encoder of
# the photo ladder (root ADR-0427): it is never compiled into any of our builds, but cargo-deny
# reads every target. The exception names that one crate; NCSA is not allowed anywhere else.
# borrow-or-share (MIT-0, OSI approved: MIT without the attribution clause) is a dependency of
# fluent-uri under jsonschema's `referencing`, the validator the takeover verdict holds each document
# to the schema registry with (root ADR-0564 Revision 2026-11-22, second). MIT-0 asks less than MIT.
exceptions = [
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
    { crate = "borrow-or-share", allow = ["MIT-0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = false
unused = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
