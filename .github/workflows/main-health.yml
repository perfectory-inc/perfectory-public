name: main-health
# Says when main is red: a pull request and the merge queue run only what a change reaches, and a
# push to main repeats nothing the queue passed, so a break past the selection shows nowhere on main
# itself (root ADR-0554). Every 10 minutes this reads the runs GitHub already made, and the run fails,
# naming each job in an annotation, while a job fails on main or for two pull requests in a row in
# the queue. The host's service checks read the newest verdict into Slack #alerts (Alertmanager). It
# gates no pull request.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  watch:
    name: Main health
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/main_health.py
            tools/ci/change-scope.json
          sparse-checkout-cone-mode: false
      - name: Say whether main is red
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/main_health.py
