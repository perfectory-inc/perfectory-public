# Scratch on the data disk ages out by itself (root ADR-0198).
#
# Agents and operators measure, stage reload intermediates and build throwaway trees under
# claude-scratch. Nothing removed them: on 2026-10-12 the tree had reached 198 GB and was deleted
# by hand. systemd-tmpfiles-clean.timer (daily, shipped with the OS) now removes what has not been
# modified for 3 days; `e` adjusts nothing and never creates or removes the directory itself, and
# `mM:` ages by modification time alone, so a file that is only read still ages out.
#
# Only this one tree is named. Production state (/var/lib/foundation-*, the by-PNU bake's work
# files, backups, the releases under /opt) is never matched; test_host_retention.py refuses a rule
# that names or contains any of them.
#
# Type Path                                      Mode User Group Age
e     /data/foundation-platform/claude-scratch   -    -    -     mM:3d
