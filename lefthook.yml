# Root lefthook.
#
# PRINCIPLE (ADR-0005): git hooks are ADVISORY, not authoritative. CI
# (.github/workflows/*) is the single source of truth. Hooks are a fast local
# convenience and MUST skip — never fail — when a required host tool is absent.
# This repo builds Rust only inside Docker, so `cargo` (and sometimes `pnpm`) may
# not be usable on the host. A launcher alone is insufficient: `pnpm` can exist
# without a platform Biome binary and `cargo` without rustfmt. Every direct
# launcher hook therefore probes the concrete invoked subtool in `skip.run`.
#
# Area-scoped commands use `root:` so globs/tools run in that area.
pre-commit:
  parallel: true
  commands:
    gitleaks:
      # `gitleaks protect` was removed in v8.19; staged scan is now `git --pre-commit --staged`
      run: gitleaks git --pre-commit --staged --redact -v --config .gitleaks.toml
      skip:
        - merge
        - rebase
        - run: "! command -v gitleaks >/dev/null 2>&1"
    gz-biome:
      root: "products/gongzzang/"
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css}"
      run: pnpm biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
      skip:
        - merge
        - rebase
        - run: "! (cd products/gongzzang && pnpm biome --version) >/dev/null 2>&1"
    gz-rustfmt:
      root: "products/gongzzang/"
      glob: "*.rs"
      run: cargo fmt -- {staged_files}
      stage_fixed: true
      skip:
        - merge
        - rebase
        - run: "! (cd products/gongzzang && cargo fmt --version) >/dev/null 2>&1"
    gz-markdownlint:
      root: "products/gongzzang/"
      glob: "*.md"
      run: pnpm markdownlint-cli2 {staged_files}
      skip:
        - merge
        - rebase
        - run: "! (cd products/gongzzang && pnpm markdownlint-cli2 --version) >/dev/null 2>&1"
    gz-panel-no-framework-import-kind:
      root: "products/gongzzang/"
      run: bash scripts/lefthook/panel-no-framework-import-kind.sh
    gz-panel-no-direct-codec:
      root: "products/gongzzang/"
      run: bash scripts/lefthook/panel-no-direct-codec.sh
    gz-panel-no-state-without-router:
      root: "products/gongzzang/"
      run: bash scripts/lefthook/panel-no-state-without-router.sh

# Local hooks are a fast pre-filter; the merge gate is CI (root ADR-0005, ADR-0098, ADR-0149).
# Budget: each step finishes in seconds and the whole hook in under two minutes on a 16 GB
# laptop — no Rust build, no Docker, no full guard sweep, no JS build/test runner. Every step
# here also runs in a required CI job; a green hook is a convenience, never a verification
# claim. To add a check: put it in CI first, then optionally mirror it here.
# `scripts/guard/lefthook-time-budget.sh` enforces both rules (budget class and CI twin).
#
# Moved to CI only by ADR-0149: the Foundation ownership boundary scan (65 s locally; one perl
# process per Rust file) — gongzzang-ci.yml `Repo guardrails`, required/gongzzang-core.
pre-push:
  parallel: true
  commands:
    fast-ratchets:
      run: bash scripts/guard/technology-version-consistency.sh && bash scripts/guard/build-coupling-baseline.sh && bash scripts/guard/pipeline-graph-covers-every-dataset.sh && bash scripts/guard/foundation-parcel-current-selector.sh
      skip: [merge, rebase]
    generated-docs-freshness:
      run: python3 scripts/catalog/render-document-catalog.py --check && python3 scripts/catalog/audit-documentation.py --check --strict && python3 scripts/catalog/render-foundation-baseline.py --check && python3 scripts/catalog/render-pipeline-map.py --check
      skip:
        - merge
        - rebase
        - run: "! command -v python3 >/dev/null 2>&1"
    gz-no-fake-pass:
      root: "products/gongzzang/"
      run: bash scripts/lefthook/check-no-fake-pass.sh
      skip: [merge, rebase]
    gz-forbidden-markers:
      root: "products/gongzzang/"
      run: bash scripts/lefthook/check-forbidden-implementation-markers.sh
      skip: [merge, rebase]
