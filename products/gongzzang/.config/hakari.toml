# cargo-hakari settings (root ADR-0269). `cargo xtask verify gongzzang` refuses a workspace-hack
# crate that `cargo hakari generate --diff` would change, or a member that does not depend on it.
# Every member then builds the third-party crates with one feature set, whichever members a run
# selects: `-p` on a pull request and `--workspace` on main reuse the same dependency builds.
hakari-package = "gongzzang-workspace-hack"
dep-format-version = "4"
workspace-hack-line-style = "workspace-dotted"
resolver = "2"
# CI and the servers are Linux; the laptops and one Foundation CI job are Windows.
platforms = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

# Left out of the unified set, so every service still builds these with exactly the features its own
# manifest asks for (root ADR-0269, measured with `cargo tree -p <service>` before and after):
# - rustls and its backends: with both `ring` and `aws-lc-rs` on, rustls cannot pick a default
#   crypto provider, and no code here installs one;
# - hyper, hyper-util and h2: hyper-util's auto connection builder serves cleartext HTTP/2 to anyone
#   who sends its preface once `http2` is compiled in, so every axum server would accept a protocol
#   it refuses today;
# - DuckDB's bundled C++ build and the Korean dictionary download (`build_rs`) belong only to the
#   crates that query or tokenize.
[final-excludes]
third-party = [
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    { name = "h2" },
    { name = "hyper" },
    { name = "hyper-rustls" },
    { name = "hyper-util" },
    { name = "ring" },
    { name = "rustls" },
    { name = "rustls-webpki" },
    { name = "tokio-rustls" },
]
