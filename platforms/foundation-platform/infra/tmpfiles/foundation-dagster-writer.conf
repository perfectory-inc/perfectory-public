# The writable Dagster webserver's unix socket (root ADR-0565 §8, compose.orchestration.yml): the host's
# deploy and run-now (root) ask Dagster through it, and nothing else can. 0700 owned by uid 10001, the
# Dagster image's account, which on this host is also foundation-api's (infra/sysusers): the API
# container does not mount it. /run is emptied at boot; this makes it again before Docker starts the
# container, which would otherwise make it root 0755 and the webserver could not bind.
d /run/foundation-dagster 0700 foundation-api foundation-api -
