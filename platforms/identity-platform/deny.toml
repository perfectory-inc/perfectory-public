# identity-platform cargo-deny policy (derived from foundation-platform's config;
# advisory exceptions reset — this workspace's accepted findings must be earned here).

[graph]
# hakari writes the workspace-hack crate (root ADR-0269); its plain version lines are the point,
# not a second declaration. Every crate it names is a dependency of a member, so out of the graph
# it takes nothing out of the licence, advisory and ban checks.
exclude = ["identity-workspace-hack"]
all-features = true

[advisories]
yanked = "deny"
# Fail on unmaintained/unsound advisories anywhere in the dependency graph, not just
# workspace-local crates, so transitive advisories are caught rather than silently
# scope-excluded. Accepted findings must be listed explicitly in `ignore` with a
# justification (see foundation-platform adversarial review PCR2-73 / remediation #10).
unmaintained = "all"
unsound = "all"
ignore = [
    # webpki-roots 0.26.x via sqlx-core (pins ^0.26); fix only in >=1.0.10, semver-unreachable
    # without a breaking sqlx major. Used only as sqlx's TLS root store for our own Postgres
    # endpoints, not arbitrary-server validation, so the distrusted-emSign path is not an exposure.
    # The 1.x copy is bumped to 1.0.10; -0382/-0383 are fixed by the bump. Review by 2026-11-20:
    # delete once sqlx releases on webpki-roots >= 1.0.10.
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.26.x via sqlx-core (^0.26, no patched 0.26.x); sqlx TLS roots for our own Postgres, not arbitrary-server validation; 1.x bumped to 1.0.10; review by 2026-11-20" },
]

[licenses]
confidence-threshold = 0.92
unused-allowed-license = "allow"
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = false
unused = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
