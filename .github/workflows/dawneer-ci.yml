name: dawneer-ci
on:
  # Required context must also be runnable for a history-free public root.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  # A pull request verifies only the crates it reaches (root ADR-0269); every night
  # main verifies every crate, as the merge queue does.
  schedule:
    - cron: "41 17 * * *"
    # Intentionally unfiltered so required/dawneer always reports.
defaults:
  run:
    working-directory: consoles/dawneer
permissions:
  contents: read

concurrency:
  group: dawneer-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Root ADR-0202: whether this workflow's area changed (tools/ci/change-scope.json).
  # An untouched area skips every job below and required/* still reports success.
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.select.outputs.affected }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Select
        id: select
        working-directory: .
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: python3 scripts/ci/change_scope.py select --workflow dawneer-ci.yml

  rust:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' }}
    name: Dawneer Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Restore pinned release binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}
          restore-keys: pinned-release-binaries-v1-${{ runner.os }}-
      - name: Set up Rust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          workspaces: |
            consoles/dawneer
            tools/xtask
          shared-key: dawneer-dependencies
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Single verification SSOT (ADR-0004): xtask owns fmt+clippy+test with the one
      # flag policy. The sign-in suite brings its own fake issuer and Foundation.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8 (SHA pin, ADR 0028)
        with:
          version: 9.12.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (SHA pin, ADR 0028)
        with:
          node-version: "24.20.0"
      # setup-node's own pnpm cache saves on every ref, so each merge-queue branch kept a copy
      # no later run can read (root ADR-0269). The store is restored everywhere and saved from
      # main only, under the same node-cache- key.
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >>"$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 (SHA pin, ADR 0028)
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: node-cache-dawneer-${{ runner.os }}-pnpm-${{ hashFiles('consoles/dawneer/web/pnpm-lock.yaml') }}
          restore-keys: node-cache-dawneer-${{ runner.os }}-pnpm-
      - name: Verify (fmt, clippy, test)
        working-directory: ${{ github.workspace }}
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: cargo xtask verify dawneer --affected
      - name: Save pnpm store
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 (SHA pin, ADR 0028)
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: node-cache-dawneer-${{ runner.os }}-pnpm-${{ hashFiles('consoles/dawneer/web/pnpm-lock.yaml') }}

  supply-chain:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' }}
    name: Dawneer supply-chain policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: consoles/dawneer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Restore pinned release binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}
          restore-keys: pinned-release-binaries-v1-${{ runner.os }}-
      - name: Set up Rust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          # Reads the area's one dependency cache, which rust saves (root ADR-0269).
          workspaces: |
            consoles/dawneer
            tools/xtask
          shared-key: dawneer-dependencies
          save-if: false
      - name: Install cargo-deny
        working-directory: ${{ github.workspace }}
        run: cargo xtask ci install-cargo-deny
      - name: cargo-deny
        run: cargo-deny --locked check

  required:
    name: required/dawneer
    if: ${{ always() }}
    needs: [scope, rust, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require every Dawneer gate
        env:
          CHANGE_SCOPE_RUN: ${{ needs.scope.outputs.affected }}
          REQUIRED_RESULT_SCOPE: ${{ needs.scope.result }}
          REQUIRED_RESULT_RUST: ${{ needs.rust.result }}
          REQUIRED_RESULT_SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
        working-directory: .
        run: bash scripts/ci/require-successful-needs.sh
