route:
  receiver: prelaunch-audit
  group_by:
    - alertname
    - service
    - environment
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: prelaunch-audit
    # The bot token is a credential and lives outside this file: the compose file mounts it from
    # the host, because a receiver with no destination is how six weeks of alerts went nowhere
    # (2026-09-02 finding; the runbook owns the setup and ends with a delivery proof).
    #
    # Token mode, not webhook mode, by owner decision (2026-09-03): api_url is Slack's Web API
    # and the Authorization header carries the bot token. One caveat the delivery proof exists
    # for: the Web API answers HTTP 200 even for logical failures (unknown channel, revoked
    # token), so only a message seen in the channel counts as delivered.
    slack_configs:
      - channel: '#alerts'
        api_url: https://slack.com/api/chat.postMessage
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/secrets/slack-bot-token
        send_resolved: true
        title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}
