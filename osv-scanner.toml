# OSV-Scanner 의 허용 목록(root ADR-0414). `cargo xtask ci osv-gate` 가 `--config` 로 모든 lockfile 에 건다.
# 여기 없는 권고, 또는 ignoreUntil 이 지난 권고는 게이트를 다시 실패시킨다. 별칭(GHSA·CVE)도 함께 무시된다.
# 항목을 더할 때는 이유와 다시 볼 날짜(ignoreUntil, 길어야 90일)를 함께 적는다.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
ignoreUntil = 2027-02-02
reason = "atomic-polyfill: Gongzzang lockfile의 1.0.3 전이 의존성 교체는 lockfile을 바꾸는 별도 보수 작업이라 이 게이트 도입 범위에서 열어 둔다."

[[IgnoredVulns]]
