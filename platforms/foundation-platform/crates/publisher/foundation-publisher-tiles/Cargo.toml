[package]
name = "foundation-publisher-tiles"
version = "0.1.0"
description = "The outbox-publisher tile and static-release lane: lakehouse tile bake, boundary static-release publication, vector tile runtime promotion, static-release readdress and toolchain (root ADR-0200)."
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
catalog-application = { workspace = true }
catalog-domain = { workspace = true }
catalog-infrastructure = { workspace = true }
flate2 = { workspace = true }
foundation-outbox = { workspace = true }
foundation-publisher-core = { workspace = true }
foundation-shared-kernel = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres"] }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
foundation-workspace-hack.workspace = true

[dev-dependencies]
foundation-disposable-database = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
