# The journal on the root disk is bounded by us, not by the default (root ADR-0198). systemd's
# default is 10% of the file system up to 4 GB and keeps only 15% free; at 2.9 GB the journal held
# 23 days of every unit's output. 2 GB keeps about two weeks, and journald drops old entries sooner
# whenever the root disk has less than 20 GB free.
[Journal]
SystemMaxUse=2G
SystemKeepFree=20G
