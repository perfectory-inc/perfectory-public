# promtool unit tests for the foundation-dagster rules (root ADR-0431, ADR-0458): a code location that
# does not load and a dual run that records no comparison are each said, a healthy or switched-off
# Dagster says nothing, and a reconciler that stops writing dagster.prom is reported. Run by the guard
# prometheus-rules-pass-their-tests.
rule_files:
  - foundation-api.rules.yml
evaluation_interval: 1m

tests:
  # 2026-11-06 21:16Z..11-09: the UI answered, the location failed every load, no check ran. Both say so.
  - interval: 1m
    input_series:
      - series: 'foundation_dagster_observing'
        values: '1x180'
      - series: 'foundation_dagster_answered'
        values: '1x180'
      - series: 'foundation_dagster_code_location_loaded{location="definitions.py"}'
        values: '0x180'
      - series: 'foundation_dual_run_jobs'
        values: '64x180'
      - series: 'node_textfile_mtime_seconds{file="/textfile-jobs/dagster.prom"}'
        values: '0+60x180'
    alert_rule_test:
      - eval_time: 14m
        alertname: FoundationDagsterCodeLocationDown
        exp_alerts: []
      - eval_time: 20m
        alertname: FoundationDagsterCodeLocationDown
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: dual-run
            exp_annotations:
              summary: 'Dagster 코드 위치가 15분 넘게 뜨지 않아요 — 이중 실행이 비교를 하나도 남기지 못하고 옮기는 문턱이 멈춰요. docker logs airflow-dagster-daemon-1 의 마지막 오류를 보세요'
              runbook: docs/runbooks/production-orchestrator-cutover.md
      - eval_time: 50m
        alertname: FoundationDualRunSilent
        exp_alerts: []
      - eval_time: 1h10m
        alertname: FoundationDualRunSilent
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: dual-run
            exp_annotations:
              summary: '이중 실행의 작업 64개가 26시간 넘게 비교를 하나도 남기지 않았어요 — 원장(/var/lib/dagster/dual-run/comparisons.jsonl)이 자라지 않아 옮기는 문턱이 서 있어요. Dagster 의 dual_run_matches_airflow 검사 run 과 센서 틱을 보세요'
              runbook: docs/runbooks/production-orchestrator-cutover.md
      - eval_time: 1h10m
        alertname: FoundationDagsterUnread
        exp_alerts: []

  # The webserver does not answer at all.
  - interval: 1m
    input_series:
      - series: 'foundation_dagster_observing'
        values: '1x60'
      - series: 'foundation_dagster_answered'
        values: '0x60'
      - series: 'foundation_dual_run_jobs'
        values: '64x60'
      - series: 'node_textfile_mtime_seconds{file="/textfile-jobs/dagster.prom"}'
        values: '0+60x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: FoundationDagsterCodeLocationDown
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: dual-run
            exp_annotations:
              summary: 'Dagster 코드 위치가 15분 넘게 뜨지 않아요 — 이중 실행이 비교를 하나도 남기지 못하고 옮기는 문턱이 멈춰요. docker logs airflow-dagster-daemon-1 의 마지막 오류를 보세요'
              runbook: docs/runbooks/production-orchestrator-cutover.md

  # Healthy: the location loads and a job compared a minute ago, every minute. Nothing for two hours.
  - interval: 1m
    input_series:
      - series: 'foundation_dagster_observing'
        values: '1x180'
      - series: 'foundation_dagster_answered'
        values: '1x180'
      - series: 'foundation_dagster_code_location_loaded{location="definitions.py"}'
        values: '1x180'
      - series: 'foundation_dual_run_jobs'
        values: '64x180'
      - series: 'foundation_dual_run_last_comparison_timestamp_seconds{job_id="synthetic_hourly"}'
        values: '0+60x180'
      - series: 'foundation_dual_run_last_comparison_timestamp_seconds{job_id="synthetic_daily"}'
        values: '0x180'
      - series: 'node_textfile_mtime_seconds{file="/textfile-jobs/dagster.prom"}'
        values: '0+60x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: FoundationDagsterCodeLocationDown
        exp_alerts: []
      - eval_time: 2h
        alertname: FoundationDualRunSilent
        exp_alerts: []
      - eval_time: 2h
        alertname: FoundationDagsterUnread
        exp_alerts: []

  # Only daily jobs are left: the last comparison was at 0. Quiet through 26 hours, said an hour after.
  - interval: 1m
    input_series:
      - series: 'foundation_dagster_observing'
        values: '1x1700'
      - series: 'foundation_dagster_answered'
        values: '1x1700'
      - series: 'foundation_dagster_code_location_loaded{location="definitions.py"}'
        values: '1x1700'
      - series: 'foundation_dual_run_jobs'
        values: '3x1700'
      - series: 'foundation_dual_run_last_comparison_timestamp_seconds{job_id="synthetic_daily"}'
        values: '0x1700'
      - series: 'node_textfile_mtime_seconds{file="/textfile-jobs/dagster.prom"}'
        values: '0+60x1700'
    alert_rule_test:
      - eval_time: 26h50m
        alertname: FoundationDualRunSilent
        exp_alerts: []
      - eval_time: 27h20m
        alertname: FoundationDualRunSilent
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: dual-run
            exp_annotations:
              summary: '이중 실행의 작업 3개가 26시간 넘게 비교를 하나도 남기지 않았어요 — 원장(/var/lib/dagster/dual-run/comparisons.jsonl)이 자라지 않아 옮기는 문턱이 서 있어요. Dagster 의 dual_run_matches_airflow 검사 run 과 센서 틱을 보세요'
              runbook: docs/runbooks/production-orchestrator-cutover.md

  # Dagster switched off (observers.dagster.enabled false): the reconciler writes only that.
  - interval: 1m
    input_series:
      - series: 'foundation_dagster_observing'
        values: '0x180'
      - series: 'node_textfile_mtime_seconds{file="/textfile-jobs/dagster.prom"}'
        values: '0+60x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: FoundationDagsterCodeLocationDown
        exp_alerts: []
      - eval_time: 2h
        alertname: FoundationDualRunSilent
        exp_alerts: []
      - eval_time: 2h
        alertname: FoundationDagsterUnread
        exp_alerts: []

  # The reconciler stopped: its file is an hour old.
  - interval: 1m
    input_series:
      - series: 'foundation_dagster_observing'
        values: '1x120'
      - series: 'node_textfile_mtime_seconds{file="/textfile-jobs/dagster.prom"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 1h
        alertname: FoundationDagsterUnread
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: dual-run
              file: /textfile-jobs/dagster.prom
            exp_annotations:
              summary: Dagster 상태(dagster.prom)를 30분 넘게 못 읽었어요 — 코드 위치가 죽어도 알림이 안 가요. journalctl -u foundation-asset-reconcile.service 를 보세요
              runbook: docs/runbooks/asset-reconcile.md

  # Root ADR-0565 §11: a job at `dagster` and a location that does not load is no job started. It pages,
  # and the dual-run ticket says nothing. Job ids are synthetic.
  - interval: 1m
    input_series:
      - series: 'foundation_dagster_observing'
        values: '1x60'
      - series: 'foundation_dagster_answered'
        values: '1x60'
      - series: 'foundation_dagster_code_location_loaded{location="foundation"}'
        values: '0x60'
      - series: 'foundation_dagster_decided_jobs'
        values: '3x60'
      - series: 'node_textfile_mtime_seconds{file="/textfile-jobs/dagster.prom"}'
        values: '0+60x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: FoundationDagsterCodeLocationDown
        exp_alerts: []
      - eval_time: 20m
        alertname: FoundationDagsterDecidesNothing
        exp_alerts:
          - exp_labels:
              severity: page
              service: orchestration
            exp_annotations:
              summary: 'Dagster 코드 위치가 15분 넘게 뜨지 않아요 — Dagster 가 결정하는 작업 3개가 하나도 시작되지 않아요. docker logs airflow-dagster-code-server-1 의 마지막 오류를 보세요'
              runbook: docs/runbooks/production-orchestrator-cutover.md

  # A sensor stopped by the deploy that holds its job says nothing; one stopped outside it, or whose
  # ticks fail, is said after 30 minutes; a run past its limit after 15.
  - interval: 1m
    input_series:
      # Every series has job="node-exporter" (the scrape's label; the textfile's job id is job_id): under
      # `unless on(job)` the held sensor silenced every stopped one (production until root ADR-0605's follow-up).
      - series: 'foundation_dagster_sensor_running{job="node-exporter",job_id="synthetic_held"}'
        values: '0x60'
      - series: 'foundation_dagster_sensor_held{job="node-exporter",job_id="synthetic_held"}'
        values: '1x60'
      - series: 'foundation_dagster_sensor_running{job="node-exporter",job_id="synthetic_stopped"}'
        values: '0x60'
      - series: 'foundation_dagster_sensor_held{job="node-exporter",job_id="synthetic_stopped"}'
        values: '0x60'
      - series: 'foundation_dagster_sensor_running{job="node-exporter",job_id="synthetic_failing"}'
        values: '1x60'
      - series: 'foundation_dagster_sensor_tick_failed{job="node-exporter",job_id="synthetic_failing"}'
        values: '1x60'
      - series: 'foundation_dagster_run_overdue_seconds{run_job="foundation_job__synthetic_a"}'
        values: '900+60x60'
      - series: 'foundation_dagster_run_overdue_seconds{run_job="foundation_job__synthetic_b"}'
        values: '0x60'
      # Root ADR-0605 §5: one run waits past its class's 360 minutes; another of the same pool and class, and
      # one of another class, wait inside theirs. The scrape's own `job` label is the same on all of them
      # (node-exporter), as on ai-server: the rule matches on job_id, and its alert carries only the on() labels.
      - series: 'foundation_dagster_run_queued_seconds{job="node-exporter",job_id="synthetic_starved",pool="duckdb",priority_class="default"}'
        values: '21000+60x60'
      - series: 'foundation_dagster_run_queue_budget_seconds{job="node-exporter",job_id="synthetic_starved",pool="duckdb",priority_class="default"}'
        values: '21600x60'
      - series: 'foundation_dagster_run_queued_seconds{job="node-exporter",job_id="synthetic_beside",pool="duckdb",priority_class="default"}'
        values: '60+60x60'
      - series: 'foundation_dagster_run_queue_budget_seconds{job="node-exporter",job_id="synthetic_beside",pool="duckdb",priority_class="default"}'
        values: '21600x60'
      - series: 'foundation_dagster_run_queued_seconds{job="node-exporter",job_id="synthetic_waiting",pool="spark",priority_class="publish"}'
        values: '600+60x60'
      - series: 'foundation_dagster_run_queue_budget_seconds{job="node-exporter",job_id="synthetic_waiting",pool="spark",priority_class="publish"}'
        values: '7200x60'
      - series: 'foundation_dagster_pool_limit_matches{pool="duckdb"}'
        values: '0x60'
      - series: 'foundation_dagster_pool_limit_matches{pool="spark"}'
        values: '1x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: FoundationDagsterPoolLimitDrift
        exp_alerts: []
      - eval_time: 35m
        alertname: FoundationDagsterPoolLimitDrift
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: orchestration
              pool: duckdb
            exp_annotations:
              summary: 'Dagster 의 duckdb 풀 한도가 작업 목록의 칸과 달라요 — 배포가 쓰지 못했거나 손으로 바뀌었어요. airflow-runtime 로그의 pools 줄을 보고, 같은 명령(writer_gate.py ask pools)으로 다시 쓰세요'
              runbook: docs/runbooks/production-orchestrator-cutover.md
      - eval_time: 15m
        alertname: FoundationDagsterRunQueuedOverBudget
        exp_alerts: []
      - eval_time: 25m
        alertname: FoundationDagsterRunQueuedOverBudget
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: orchestration
              job_id: synthetic_starved
              pool: duckdb
              priority_class: default
            exp_annotations:
              summary: 'synthetic_starved 의 Dagster run 이 duckdb 풀 자리를 6h 15m 0s째 기다려요(default 예산 넘음). Dagster UI 의 Deployment → Concurrency 에서 그 풀을 무엇이 쥐고 있는지 보세요'
              runbook: docs/runbooks/production-orchestrator-cutover.md
      - eval_time: 29m
        alertname: FoundationDagsterSensorStopped
        exp_alerts: []
      - eval_time: 35m
        alertname: FoundationDagsterSensorStopped
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: orchestration
              job: node-exporter
              job_id: synthetic_stopped
            exp_annotations:
              summary: 'synthetic_stopped 을 결정하는 Dagster 센서가 30분 넘게 멈춰 있는데 배포가 쥐고 있지 않아요 — 그 작업은 시작되지 않아요. 되돌리기: python3 scripts/deploy/job_orchestrator.py unpause orchestration/jobs.v1.json synthetic_stopped'
              runbook: docs/runbooks/production-orchestrator-cutover.md
      - eval_time: 35m
        alertname: FoundationDagsterSensorTickFailing
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: orchestration
              job: node-exporter
              job_id: synthetic_failing
            exp_annotations:
              summary: 'synthetic_failing 을 결정하는 Dagster 센서의 틱이 30분 넘게 실패해요 — 실패하는 동안 그 작업은 시작되지 않아요. Dagster UI 의 센서 foundation_decide__synthetic_failing 틱 오류를 보세요'
              runbook: docs/runbooks/production-orchestrator-cutover.md
      - eval_time: 20m
        alertname: FoundationDagsterRunOverdue
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: orchestration
              run_job: foundation_job__synthetic_a
            exp_annotations:
              summary: 'Dagster 작업 foundation_job__synthetic_a 의 run 이 한도를 35m 0s 넘겨 열려 있어요 — run monitoring 이 닫지 못했어요. 그 run 의 프로세스가 살아 있는지 보고, 아니면 Dagster UI 에서 끝내세요(유닛은 systemd 의 것이라 따로 돌아요)'
              runbook: docs/runbooks/production-orchestrator-cutover.md
