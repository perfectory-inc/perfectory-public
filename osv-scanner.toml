[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-11-30
reason = "minimatch: Dawneer 웹과 Gongzzang 의 openapi-typescript 7.13.0(최신)→@redocly/openapi-core 1.34.x 가 고정하는 5.1.9. 수정판은 11.0.1 뿐인데 11 은 require(\"minimatch\") 를 함수로 내보내지 않아 redocly 를 깨므로 override 로 올리지 못한다. API 타입 생성 개발 도구라 서비스 실행 경로에 없고 우리 OpenAPI 문서의 고정 패턴만 맞춘다. 10.x 는 override(11.0.1)로 닫았다. redocly 1.x 가 minimatch 를 올리거나 openapi-typescript 가 openapi-core 2.x 로 옮길 때 닫는다."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2027-02-02
reason = "paste: 취약점이 아니라 '관리 중단' 권고다. 사진 사다리(root ADR-0427)의 AVIF 인코더 rav1e 0.8.1(최신)이 컴파일 때만 쓰는 proc-macro 로 끌어온다 — 실행 바이너리에 코드가 없다. deny.toml 이 같은 권고를 parquet 때문에 이미 열어 두었다. rav1e 가 paste 를 떼면(업스트림 이슈) 닫는다."


[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2027-02-02
reason = "libsqlite3-sys(번들 C SQLite CVE-2026-119375): 네 Rust lockfile 의 0.30.1 은 sqlx 0.8.6 의 sqlx-macros-core 가 sqlite 기능 없이도 lockfile 에만 풀어 넣는 sqlx-sqlite 의 것이다(sqlx 의 알려진 동작). 2026-11-09 네 워크스페이스 모두 `cargo tree --workspace --all-features --target all -e normal,build,dev -i libsqlite3-sys` 가 비었다 — 어느 빌드도 컴파일하지 않고 SQLite 를 열지 않는다. 수정판 0.39 는 sqlx 0.9 가 끌어오므로 sqlx 승급 때 닫는다."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
ignoreUntil = 2027-02-16
reason = "chrono: 취약점이 아니라 '관리 중단' 권고이고 모든 판이 해당한다 — 올릴 수정판이 없다(2026-11-18 crates.io 최신 0.4.45). 네 Rust lockfile(foundation·identity·intelligence·gongzzang)의 직접 의존 63개 Cargo.toml 에 더해 sqlx-core·arrow·parquet·iceberg·calamine·croner·serde_with 가 끌어오므로 우리 쪽만 jiff/time 으로 옮겨서는 lockfile 에서 빠지지 않는다. 부모들이 옮기는 동안 열어 두고, 우리 직접 의존의 이전은 별도 작업으로 다룬다. 각 deny.toml 의 ignore 도 같은 이유다."

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
ignoreUntil = 2026-12-18
reason = "picomatch(CVE-2026-112366, 단일 가지 반복 extglob ReDoS): 권고가 'through 4.0.7'(last_affected) 이고 2026-11-18 npm 최신이 4.0.7 이라 올릴 수정판이 없다. 일곱 pnpm 트리 모두 vite·vitest·tinyglobby·fdir(빌드·시험 도구)와 gongzzang 의 micromatch(fast-glob·markdownlint-cli2)·@parcel/watcher(next-intl 메시지 추출) 가 끌어오고, 패턴은 우리 설정·소스의 고정 glob 뿐이다 — 요청 입력이 glob 이 되는 실행 경로가 없다. 수정판이 나오면 security-overrides 계약으로 올리고 닫는다(30일 뒤 다시 본다)."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0574"
ignoreUntil = 2026-12-19
reason = "heapless 0.8.0 ← rstar 0.12.2 ← geo 0.33.1(foundation catalog-domain), gongzzang lockfile 의 heapless 0.6.1·0.7.17·0.8.0 은 geo-types 0.7.20 의 선택 의존 rstar 0.8~0.13 이 lockfile 에만 남긴 것(cargo tree 로 빌드되지 않음 확인). 수정판은 heapless >=0.9.4(2026-11-18) 인데 그 heapless 를 쓰는 rstar 0.14 를 geo 가 지원하는 변경(georust/geo#1641, 2026-11-12 병합)이 아직 릴리스되지 않았다 — crates.io 최신 geo 0.33.1 은 rstar ^0.12, geo-types 0.7.20 에는 rstar_0_14 기능이 없다. 권고는 'unsound'(정보성)이고, rstar 0.12.2 가 쓰는 heapless 는 nearest_neighbor 의 binary_heap 하나다: 권고가 가리키는 Deque·IndexMap·SortedLinkedList·Spsc·pool·HistoryBuf 는 쓰지 않고, into_vec 뒤 vec::IntoIter::drop(-0577)은 원소의 Drop 이 패닉할 때만이며 원소는 참조와 거리뿐이다. geo 가 rstar 0.14 로 릴리스되면 올리고 닫는다(30일 뒤 다시 본다)."

