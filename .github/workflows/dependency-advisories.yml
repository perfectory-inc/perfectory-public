name: dependency-advisories
# A RUSTSEC advisory or a yank reaches main without a commit. This daily run finds it before an
# unrelated pull request does (root ADR-0271): the check names each one in an `advisory` annotation,
# and the host's service checks carry it to Slack #alerts (root ADR-0278, the cargo-advisories
# source). It gates no pull request. The fixes themselves arrive as Renovate pull requests
# (.github/renovate.json).
on:
  schedule:
    - cron: "41 21 * * *"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Cargo advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Whether main has advisories, for the Renovate pulse (root ADR-0570): the check step's own outcome,
    # not the job's (a failed setup is not an advisory).
    outputs:
      advisories: ${{ steps.workspaces.outcome }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Generate the declared artifacts (root ADR-0418)
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/ci/generate-declared.sh"
      # A run that fails before the check still uploads a (empty) summary.
      - name: Start the summary
        run: mkdir -p target/supply-chain && touch target/supply-chain/cargo-advisories.md
      - name: Restore pinned release binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}
          restore-keys: pinned-release-binaries-v1-${{ runner.os }}-
      - name: Set up Rust
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      # Keeps ~/.cargo/registry, the crates `cargo metadata` downloads for every workspace, between
      # daily runs; nothing is built, so one workspace keys it.
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          workspaces: |
            tools/xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-deny
        shell: bash
        run: cargo xtask ci install-cargo-deny
      # Every day the check first refuses a planted advisory, so a check that can no longer fail
      # cannot report a clean main.
      - name: The check refuses a planted advisory
        run: bash scripts/ci/cargo-advisories-self-test.sh
      - name: Every Cargo workspace on main
        id: workspaces
        run: bash scripts/ci/cargo-advisories.sh check target/supply-chain/cargo-advisories.md
      - name: Upload supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (SHA pin, ADR 0028)
        with:
          name: cargo-advisories
          path: target/supply-chain/
          if-no-files-found: error
          retention-days: 7
  # Root ADR-0414 (revision 2026-11-25): every advisory on main, filed as a code scanning alert in the
  # repository's Security tab by the same pinned OSV-Scanner the gate runs. It gates nothing: a pull
  # request fails only on what its own lockfile changes bring, and the fixes arrive as Renovate pull
  # requests. A scan that does not complete fails the job; findings do not.
  osv:
    name: OSV scan of main (code scanning)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Scan every tracked lockfile
        run: bash scripts/ci/osv-scan.sh sarif target/supply-chain/osv.sarif
      - name: File the findings as code scanning alerts
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: target/supply-chain/osv.sarif
          category: osv-scanner
  # Root ADR-0570: the repository against tools/github (the part the workflow token can read) and
  # Renovate's pulse while main has advisories. The job fails on drift or silence and names each
  # finding in a `repository-drift` annotation; the host's service checks carry it to Slack #alerts
  # (the `repository` part). A run that cannot read GitHub is no verdict. Reads GitHub only, no crates.
  repository:
    name: Repository drift and Renovate pulse
    needs: [check]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/ci/repository_drift.py
            scripts/github/github-policy-json.py
            tools/github
          sparse-checkout-cone-mode: false
      - name: Compare with tools/github and read Renovate's pulse
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ADVISORIES: ${{ needs.check.outputs.advisories }}
        run: |
          mkdir -p target/repository-drift
          python3 scripts/ci/repository_drift.py check target/repository-drift/summary.md --advisories "$ADVISORIES"
      # The check records success|failure|unreadable and exits 0 (a crash leaves no record, and this
      # step does not run); this step turns the record into the job's verdict.
      - name: Say whether the repository drifted
        run: python3 scripts/ci/repository_drift.py report target/repository-drift/summary.md
