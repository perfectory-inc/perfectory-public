  "postcss@>=8.0.0 <9.0.0": "^8.5.23"
  "sharp@>=0.0.0 <0.36.0": "^0.35.5"
  "source-map-js@>=1.0.0 <2.0.0": "^1.2.2"
  "undici@>=7.0.0 <8.0.0": "^7.30.1"
  "vite": "8.3.4"
  "ws@>=8.0.0 <9.0.0": "^8.21.0"
