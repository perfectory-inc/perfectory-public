listen_addresses: 0.0.0.0:3000
on_invalid: abort
# Dynamic PostGIS is a mutable projection. Martin's supported cache switch is the explicit
# `cache: disable` mapping. A numeric `cache_size_mb` key is not part of Martin 1.12's config
# schema and would make the server reject this file (or silently leave stale tiles in place).
cache: disable
postgres:
  connection_string: ${DATABASE_URL}
  pool_size: 4
  auto_bounds: calc
  auto_publish: false
  tables:
    parcels:
      schema: serving_postgis
      table: parcel_boundary_current
      srid: 5179
      geometry_column: geom
      geometry_type: MULTIPOLYGON
      layer_id: parcels
      minzoom: 14
      maxzoom: 16
      properties:
        pnu: Parcel number
        official_complex_code: Industrial-complex code
    admin:
      schema: serving_postgis
      table: administrative_unit_boundary_current
      srid: 4326
      geometry_column: geom
      geometry_type: MULTIPOLYGON
      layer_id: admin
      minzoom: 5
      maxzoom: 16
      properties:
        administrative_unit_id: Stable administrative-unit identity
        scope_kind: Administrative scope kind
        canonical_code: Official administrative code
        display_name: Official administrative name
    parcel_anchor_aggregate:
      schema: serving_postgis
      table: tiles_slice_parcel_anchor_aggregate
      srid: 4326
      geometry_column: geom
      geometry_type: POINT
      layer_id: parcel_anchor_aggregate
      minzoom: 0
      maxzoom: 11
      properties:
        pnu: Representative parcel number
        official_complex_code: Industrial-complex code
        count: Aggregated parcel count
    parcel_anchor:
      schema: serving_postgis
      table: tiles_slice_parcel_anchor
      srid: 4326
      geometry_column: geom
      geometry_type: POINT
      layer_id: parcel_anchor
      minzoom: 12
      maxzoom: 16
      properties:
        pnu: Parcel number
        official_complex_code: Industrial-complex code
