# The Dagster instance of root ADR-0333 stage 0: its own database and role on the platform's Postgres
# (airflow-runtime.sh makes both), nothing else written outside /var/lib/dagster.
storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      port:
        env: DAGSTER_PG_PORT
      db_name: dagster
      username: dagster
      password:
        env: DAGSTER_PG_PASSWORD

# Two kinds of run (root ADR-0431 §5, ADR-0435): the observer's asset-check runs (airlift's sensor asks
# for them) and the runs of jobs Dagster runs (run_jobs.py, tagged foundation/run=job by
# job_specs.JobSpec.dagster_tags). While Airflow decides, Airflow holds the pools and its parallelism
# (compose.orchestration.yml AIRFLOW__CORE__PARALLELISM, 5) bounds the job runs it can have open at once;
# this queue admits that many job runs and keeps one place free for a check run, so a check never waits
# behind an hours-long job run and a job run never waits behind checks. A pool's runs never outnumber its
# slots (jobs.v1.json pools: spark 3, documents 1); the host's start (job_units.py pool-full) still decides by
# priority class and slots, whoever starts. The queue starts higher `dagster/priority` first (the job's
# priority class value). test_dagster_observe.py holds these numbers to the job list and compose.
# Every run's process is a child of the daemon: its cap counts them (compose.orchestration.yml).
run_coordinator:
  module: dagster._core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 6
    tag_concurrency_limits:
      - key: foundation/run
        value: job
        limit: 5
      - key: foundation/pool
        value: spark
        limit: 3
      - key: foundation/pool
        value: documents
        limit: 1

run_monitoring:
  enabled: true

local_artifact_storage:
  module: dagster._core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /var/lib/dagster/artifacts

compute_logs:
  module: dagster._core.storage.local_compute_log_manager
  class: LocalComputeLogManager
  config:
    base_dir: /var/lib/dagster/compute-logs

# The sensor ticks every 30 s; a tick that saw nothing is not worth keeping past a week.
retention:
  sensor:
    purge_after_days:
      skipped: 7
      failure: 90
      success: -1

telemetry:
  enabled: false
