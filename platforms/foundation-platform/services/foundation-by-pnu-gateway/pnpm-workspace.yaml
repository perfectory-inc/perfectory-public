# Dependencies whose install scripts run (pnpm 11 and later fail an install on any other build script):
# esbuild and workerd, wrangler's bundler and local runtime, ran by default under pnpm 9.
# `overrides` below is rendered from tools/npm/security-overrides.contract.json (root ADR-0158).
allowBuilds:
  esbuild: true
  workerd: true

overrides:
