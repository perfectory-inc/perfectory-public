[package]
name = "foundation-publisher-core"
version = "0.1.0"
description = "What every outbox-publisher lane shares: control support, R2 key layout, gateway contracts, handoff manifests, lakehouse snapshot scans (root ADR-0200)."
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# What the publisher's own tests share (approved-link builders, the embedded migrator, the environment
# lock); switched on from dev-dependencies only, never in a release build.
test-fixtures = []

[dependencies]
anyhow = { workspace = true }
apache-avro = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
catalog-domain = { workspace = true }
chrono = { workspace = true }
collection-domain = { workspace = true }
foundation-normalization-application = { workspace = true }
foundation-normalization-domain = { workspace = true }
foundation-normalization-infrastructure = { workspace = true }
foundation-outbox = { workspace = true }
foundation-shared-kernel = { workspace = true }
lakehouse-application = { workspace = true }
lakehouse-domain = { workspace = true }
lakehouse-infrastructure = { workspace = true }
parquet = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "migrate"] }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }
