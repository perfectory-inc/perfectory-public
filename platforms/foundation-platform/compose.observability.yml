# Every service names this cap: one uncapped json-file log filled the host disk (root ADR-0118 §6,
# guard every-container-has-a-memory-cap).
x-log-cap: &log-cap
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  prometheus:
    logging: *log-cap
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    mem_limit: 256m
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${FOUNDATION_PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/foundation-api.rules.yml:/etc/prometheus/foundation-api.rules.yml:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      foundation-api:
        condition: service_healthy
      alertmanager:
        condition: service_healthy

  alertmanager:
    logging: *log-cap
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    mem_limit: 128m
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
    ports:
      - "127.0.0.1:${FOUNDATION_ALERTMANAGER_PORT:-19093}:9093"
    volumes:
      - alertmanager_data:/alertmanager
      - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # The file holds one line — the Slack bot token — and never enters this repo. If it is
      # absent Alertmanager fails its health check, and foundation-api's depends_on makes that
      # failure block the next deploy: an Alertmanager without a delivery secret is a receiver
      # with no destination, and that silence already cost six weeks. The runbook's Slack
      # section owns creating it.
      - ${FOUNDATION_ALERTMANAGER_SLACK_TOKEN_FILE:-/etc/foundation-platform/secrets/alertmanager-slack-bot-token}:/etc/alertmanager/secrets/slack-bot-token:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12

  # The host's own state as series. The textfile collector serves the files a host script writes,
  # the way Prometheus documents for batch jobs (root ADR-0321 §5): the deploy writes what it is
  # doing and since when (scripts/deploy/deploy-start-once.sh deploy_metric_*), and the
  # FoundationDeploy* rules alert on how long a drain, a deploy or a pause lasts. The host
  # collectors are root ADR-0385's: free space of every disk (filesystem, through the host's root
  # mounted read-only at /host, whose /proc names the host's mounts), memory (meminfo), the
  # kernel's OOM kill count (vmstat) and CPU time (cpu). meminfo, vmstat and cpu read the
  # container's /proc, which shows the host's numbers: those files are not per namespace.
  node-exporter:
    logging: *log-cap
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    mem_limit: 64m
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    # The second directory is the scheduled jobs' own textfiles, which their unprivileged account
    # writes (jobs.v1.json state_directories, made by the release before this mount): the Onbid
    # collector's detail coverage for the FoundationOnbidDetailCoverage* rules (root ADR-0330 §4).
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/textfile
      - --collector.textfile.directory=/textfile-jobs
      - --collector.filesystem
      - --collector.meminfo
      - --collector.vmstat
      - --collector.cpu
      - --path.rootfs=/host
      - --path.procfs=/host/proc
    volumes:
      - ${FOUNDATION_HOST_METRICS_DIR:-/var/lib/perfectory/metrics}:/textfile:ro
      - ${FOUNDATION_JOB_METRICS_DIR:-/var/lib/foundation-jobs/metrics}:/textfile-jobs:ro
      - /:/host:ro,rslave

  # Each container's and each systemd service's working set against its cap, and its CPU (root
  # ADR-0343 §6, ADR-0385). Read from the cgroup files alone (raw cgroups under /system.slice/,
  # where the systemd cgroup driver puts both docker-<id>.scope and every unit), so it needs no
  # container-engine socket and no privilege: those files are world-readable. Without the socket
  # a container is named by its cgroup id; the asset reconciler writes the id-to-name table
  # (docker-containers.prom) and the alert looks the name up.
  cadvisor:
    logging: *log-cap
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    mem_limit: 192m
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    command:
      - --docker_only=false
      - --raw_cgroup_prefix_whitelist=/system.slice/
      - --enable_metrics=cpu,memory
      - --store_container_labels=false
      - --housekeeping_interval=30s
    volumes:
      - /sys:/sys:ro
    tmpfs:
      - /tmp:size=16m,mode=1777

volumes:
  prometheus_data:
  alertmanager_data:
