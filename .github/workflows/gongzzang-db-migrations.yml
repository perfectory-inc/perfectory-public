name: db-migrations

on:
  # Required context must also be runnable for a history-free public root.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, w1kch9812-cmd/v8-probe-before-base]
  merge_group:
  # A pull request verifies only the crates it reaches (root ADR-0269); every night
  # main verifies every crate, as the merge queue does.
  schedule:
    - cron: "41 17 * * *"
    # Intentionally unfiltered so required/gongzzang-migrations always reports.

defaults:
  run:
    working-directory: products/gongzzang

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  POSTGRES_USER: gongzzang
  POSTGRES_PASSWORD: ci_only_changeme
  POSTGRES_DB: postgres

jobs:
  # Root ADR-0202: whether this workflow's area changed (tools/ci/change-scope.json).
  # An untouched area skips every job below and required/* still reports success.
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.select.outputs.affected }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Select
        id: select
        working-directory: .
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: python3 scripts/ci/change_scope.py select --workflow gongzzang-db-migrations.yml

  migrate:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' }}
    name: Full migrations + schema invariants
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine@sha256:fe9821935d163abca5611e3e0a6a7c73c8c547f3412ed2036ec0ed8f789390da
        env:
          POSTGRES_USER: gongzzang
          POSTGRES_PASSWORD: ci_only_changeme
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gongzzang"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://gongzzang:ci_only_changeme@localhost:5432/gongzzang_migration_smoke

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set up Rust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          # Reads the dependency cache gongzzang's `rust` job saves (root ADR-0269); its own 315 MB
          # entry was a second copy of those builds. sqlx-cli itself is cached alone, below.
          workspaces: |
            products/gongzzang
            tools/xtask
          shared-key: gongzzang-dependencies
          save-if: false
      # sqlx publishes no release binaries, so the pinned fetcher (ADR-0197) has nothing to verify.
      # On a miss cargo builds it from crates.io (every crate checked against the index checksum,
      # dependencies pinned by --locked); only the two executables are kept, keyed by the version.
      - name: Restore sqlx-cli
        id: sqlx-cli
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 (SHA pin, ADR 0028)
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-0.8.6-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install sqlx-cli + postgres client
        env:
          SQLX_CLI_CACHED: ${{ steps.sqlx-cli.outputs.cache-hit }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          if [ "${SQLX_CLI_CACHED}" != true ]; then
            cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features postgres,rustls
          fi
      - name: Save sqlx-cli
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 (SHA pin, ADR 0028)
        with:
          path: |
            ~/.cargo/bin/sqlx
            ~/.cargo/bin/cargo-sqlx
          key: sqlx-cli-0.8.6-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Wait for Postgres
        run: |
          for _ in {1..30}; do
            pg_isready -h localhost -p 5432 -U gongzzang && break
            sleep 1
          done

      # Native replacements for the deleted ci_migration_v001_full /
      # ci_migration_v002_audit_immutable graph-build transition targets, which
      # only invoked these same shell scripts via run_ci_transition_task.sh.
      - name: Apply full migration chain + schema invariants
        run: bash tests/migrations/test_v001_full.sh

      - name: Apply V002 migrations + audit immutable
        run: bash tests/migrations/test_v002_audit_immutable.sh

      # The live-resource lane in tools/xtask is the SSOT for this command
      # (ADR-0010). The raw `cargo test -p gongzzang-persistence --features
      # integration` it replaces did run the suite, but it was a second, private
      # definition of what "the gongzzang postgres suite" means: nothing tied it
      # to the lane table, so `live-lane-completeness.sh` proved a set of targets
      # that no CI job actually executed. Routing this step through the lane
      # makes the proven set and the executed set the same set, and makes the
      # lane's own gating flags exercised rather than assumed.
      - name: Run the gongzzang postgres lane (xtask SSOT)
        working-directory: ${{ github.workspace }}
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: cargo xtask integration gongzzang postgres --affected

  required:
    name: required/gongzzang-migrations
    if: ${{ always() }}
    needs: [scope, migrate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require the migration gate
        env:
          CHANGE_SCOPE_RUN: ${{ needs.scope.outputs.affected }}
          REQUIRED_RESULT_SCOPE: ${{ needs.scope.result }}
          REQUIRED_RESULT_MIGRATE: ${{ needs.migrate.result }}
        working-directory: .
        run: bash scripts/ci/require-successful-needs.sh
