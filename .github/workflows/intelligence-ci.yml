name: intelligence-ci
on:
  # Required context must also be runnable for a history-free public root.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  # A pull request verifies only the crates it reaches (root ADR-0269); every night
  # main verifies every crate, as the merge queue does.
  schedule:
    - cron: "41 17 * * *"
    # Intentionally unfiltered so required/intelligence always reports.
defaults:
  run:
    working-directory: platforms/intelligence-platform
permissions:
  contents: read

concurrency:
  group: intelligence-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Root ADR-0202: whether this workflow's area changed (tools/ci/change-scope.json).
  # An untouched area skips every job below and required/* still reports success.
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.select.outputs.affected }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Select
        id: select
        working-directory: .
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: python3 scripts/ci/change_scope.py select --workflow intelligence-ci.yml

  rust:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' }}
    name: Intelligence Rust quality and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: intelligence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Restore pinned release binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}
          restore-keys: pinned-release-binaries-v1-${{ runner.os }}-
      - name: Set up Rust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          workspaces: |
            platforms/intelligence-platform
            tools/xtask
          shared-key: intelligence-dependencies
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Single verification SSOT (ADR-0004): xtask owns fmt+clippy+test with the one
      # flag policy and the native deps (cmake+libsasl2 for rdkafka). Runs from the
      # repo root (this job defaults to the area). The default suite is backend-free;
      # DB-backed contracts run in the explicit Postgres lane below.
      - name: Verify (fmt, clippy, test)
        working-directory: ${{ github.workspace }}
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: cargo xtask verify intelligence --affected
      - name: Run Postgres integration lane
        working-directory: ${{ github.workspace }}
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
          INTELLIGENCE_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/intelligence
        run: cargo xtask integration intelligence postgres --affected

  supply-chain:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' }}
    name: Intelligence supply-chain policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: platforms/intelligence-platform
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Restore pinned release binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}
          restore-keys: pinned-release-binaries-v1-${{ runner.os }}-
      - name: Set up Rust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          # Reads the area's one dependency cache, which rust saves (root ADR-0269).
          workspaces: |
            platforms/intelligence-platform
            tools/xtask
          shared-key: intelligence-dependencies
          save-if: false
      - name: Install cargo-deny
        working-directory: ${{ github.workspace }}
        run: cargo xtask ci install-cargo-deny
      - name: cargo-deny
        run: cargo-deny --locked check

  required:
    name: required/intelligence
    if: ${{ always() }}
    needs: [scope, rust, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require every Intelligence gate
        env:
          CHANGE_SCOPE_RUN: ${{ needs.scope.outputs.affected }}
          REQUIRED_RESULT_SCOPE: ${{ needs.scope.result }}
          REQUIRED_RESULT_RUST: ${{ needs.rust.result }}
          REQUIRED_RESULT_SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
        working-directory: .
        run: bash scripts/ci/require-successful-needs.sh
