# promtool unit tests for the foundation-host rules (root ADR-0385): each alert fires on the
# synthetic series of the incident it names and stays quiet on a healthy host. Run by the guard
# prometheus-rules-pass-their-tests (`promtool test rules host-resources.rules.test.yml`).
rule_files:
  - foundation-api.rules.yml
evaluation_interval: 1m

tests:
  # A root disk at 5% free for 30 minutes (2026-10-02: a 32GB log filled it); /data at 50% is quiet.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{device="/dev/sda2",fstype="ext4",mountpoint="/"}'
        values: '5x40'
      - series: 'node_filesystem_size_bytes{device="/dev/sda2",fstype="ext4",mountpoint="/"}'
        values: '100x40'
      - series: 'node_filesystem_readonly{device="/dev/sda2",fstype="ext4",mountpoint="/"}'
        values: '0x40'
      - series: 'node_filesystem_avail_bytes{device="/dev/sdb1",fstype="ext4",mountpoint="/data"}'
        values: '50x40'
      - series: 'node_filesystem_size_bytes{device="/dev/sdb1",fstype="ext4",mountpoint="/data"}'
        values: '100x40'
      - series: 'node_filesystem_readonly{device="/dev/sdb1",fstype="ext4",mountpoint="/data"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: FoundationHostDiskAlmostFull
        exp_alerts: []
      - eval_time: 31m
        alertname: FoundationHostDiskAlmostFull
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: host
              device: /dev/sda2
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: '/ 디스크가 5% 남았어요 — 다 차면 운영 DB·수집·적재가 멈춰요. du -xh --max-depth=2 / 로 무엇이 큰지 보세요'
              runbook: docs/runbooks/host-resources.md

  # 39% free and losing 3 points an hour: full within a day. A disk losing the same with 66% or more free is quiet.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{device="/dev/sda2",fstype="ext4",mountpoint="/"}'
        values: '39-0.05x480'
      - series: 'node_filesystem_size_bytes{device="/dev/sda2",fstype="ext4",mountpoint="/"}'
        values: '100x480'
      - series: 'node_filesystem_readonly{device="/dev/sda2",fstype="ext4",mountpoint="/"}'
        values: '0x480'
      - series: 'node_filesystem_avail_bytes{device="/dev/sdb1",fstype="ext4",mountpoint="/data"}'
        values: '90-0.05x480'
      - series: 'node_filesystem_size_bytes{device="/dev/sdb1",fstype="ext4",mountpoint="/data"}'
        values: '100x480'
      - series: 'node_filesystem_readonly{device="/dev/sdb1",fstype="ext4",mountpoint="/data"}'
        values: '0x480'
    alert_rule_test:
      - eval_time: 30m
        alertname: FoundationHostDiskFillingUp
        exp_alerts: []
      - eval_time: 7h
        alertname: FoundationHostDiskFillingUp
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: host
              device: /dev/sda2
              fstype: ext4
              mountpoint: /
            exp_annotations:
              summary: '/ 디스크가 지난 6시간 속도로는 하루 안에 다 차요 — 커지는 로그나 남은 임시 파일을 찾아 지우세요'
              runbook: docs/runbooks/host-resources.md

  # 5% of memory available for 15 minutes; 52% (measured 2026-11-03) is quiet.
  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes'
        values: '52x5 5x20'
      - series: 'node_memory_MemTotal_bytes'
        values: '100x25'
    alert_rule_test:
      - eval_time: 5m
        alertname: FoundationHostMemoryLow
        exp_alerts: []
      - eval_time: 21m
        alertname: FoundationHostMemoryLow
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: host
            exp_annotations:
              summary: '호스트 메모리가 5% 남았어요 — 더 줄면 커널이 프로세스를 죽여요. docker stats --no-stream 과 systemctl status ollama 를 보세요'
              runbook: docs/runbooks/host-resources.md

  # One kill at minute 10 (the 2026-11-03 onbid Silver kills, one an hour): it fires, and an hour
  # after the kill it resolves.
  - interval: 1m
    input_series:
      - series: 'node_vmstat_oom_kill'
        values: '112x9 113x120'
    alert_rule_test:
      - eval_time: 5m
        alertname: FoundationHostOomKill
        exp_alerts: []
      - eval_time: 30m
        alertname: FoundationHostOomKill
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: host
            exp_annotations:
              summary: '지난 1시간 동안 커널이 메모리 부족으로 프로세스를 1번 죽였어요. journalctl -k --since -1h | grep "Killed process" 로 무엇이 어느 상한(oom_memcg)에서 죽었는지 보세요'
              runbook: docs/runbooks/host-resources.md
      - eval_time: 75m
        alertname: FoundationHostOomKill
        exp_alerts: []

  # A container at 95% of its cap for 15 minutes is named from the reconciler's table; one at 80%,
  # one with no cap (0) and a unit at 95% for only 10 minutes are quiet. A unit not in the table
  # is named by its cgroup.
  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{id="/system.slice/docker-a1.scope"}'
        values: '95x20'
      - series: 'container_spec_memory_limit_bytes{id="/system.slice/docker-a1.scope"}'
        values: '100x20'
      - series: 'foundation_docker_container_info{id="/system.slice/docker-a1.scope",name="synthetic-spark-run"}'
        values: '1x20'
      - series: 'container_memory_working_set_bytes{id="/system.slice/docker-b2.scope"}'
        values: '80x20'
      - series: 'container_spec_memory_limit_bytes{id="/system.slice/docker-b2.scope"}'
        values: '100x20'
      - series: 'container_memory_working_set_bytes{id="/system.slice/martin.scope"}'
        values: '500x20'
      - series: 'container_spec_memory_limit_bytes{id="/system.slice/martin.scope"}'
        values: '0x20'
      - series: 'container_memory_working_set_bytes{id="/system.slice/synthetic-bake.service"}'
        values: '50x10 95x10'
      - series: 'container_spec_memory_limit_bytes{id="/system.slice/synthetic-bake.service"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: FoundationContainerMemoryNearCap
        exp_alerts: []
      - eval_time: 16m
        alertname: FoundationContainerMemoryNearCap
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: host
              id: /system.slice/docker-a1.scope
            exp_annotations:
              summary: 'synthetic-spark-run 가 15분째 메모리 상한의 95% 를 쓰고 있어요 — 곧 OOM 으로 죽어요. 상한을 잰 값으로 고치거나 run 을 줄이세요'
              runbook: docs/runbooks/host-resources.md

  - interval: 1m
    input_series:
      - series: 'container_memory_working_set_bytes{id="/system.slice/synthetic-bake.service"}'
        values: '95x20'
      - series: 'container_spec_memory_limit_bytes{id="/system.slice/synthetic-bake.service"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: FoundationContainerMemoryNearCap
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: host
              id: /system.slice/synthetic-bake.service
            exp_annotations:
              summary: '/system.slice/synthetic-bake.service 가 15분째 메모리 상한의 95% 를 쓰고 있어요 — 곧 OOM 으로 죽어요. 상한을 잰 값으로 고치거나 run 을 줄이세요'
              runbook: docs/runbooks/host-resources.md

  # cAdvisor down for 30 minutes while node-exporter's series are there.
  - interval: 1m
    input_series:
      - series: 'up{job="cadvisor",instance="cadvisor:8080"}'
        values: '0x40'
      - series: 'node_memory_MemAvailable_bytes'
        values: '52x40'
      - series: 'node_vmstat_oom_kill'
        values: '112x40'
      - series: 'node_filesystem_avail_bytes{device="/dev/sda2",fstype="ext4",mountpoint="/"}'
        values: '50x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: FoundationHostMetricsUnread
        exp_alerts: []
      - eval_time: 31m
        alertname: FoundationHostMetricsUnread
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: host
              job: cadvisor
              instance: cadvisor:8080
            exp_annotations:
              summary: 호스트 자원 지표(cAdvisor·node-exporter 수집기)를 30분째 못 읽어요 — 디스크가 차거나 메모리가 모자라도 알림이 안 가요
              runbook: docs/runbooks/host-resources.md

  # 2026-10-28..11-05: the 공매 lane served a manifest 191 hours old against its 48-hour budget.
  # The stale lane fires with the lane named; a lane inside its budget stays quiet. The 공매 lane's
  # data time is unknown here, so its manifest's age is held (root ADR-0444). 2026-11-07: zoning's
  # manifest was 498 hours old but it served every change there was; parcel's was 202 hours old and
  # 290 hours behind a transfer history load.
  - interval: 1h
    input_series:
      - series: 'foundation_by_pnu_served_manifest_age_seconds{lane="parcel-zoning"}'
        values: '1792800x3'
      - series: 'foundation_by_pnu_serving_freshness_budget_seconds{lane="parcel-zoning"}'
        values: '172800x3'
      - series: 'foundation_by_pnu_lane_behind_seconds{lane="parcel-zoning",bake_job="by_pnu_serving_bake"}'
        values: '0x3'
      - series: 'foundation_by_pnu_lane_behind_seconds{lane="parcel",bake_job="by_pnu_serving_bake"}'
        values: '1044000x3'

      - series: 'foundation_by_pnu_served_manifest_age_seconds{lane="parcel-public-auction"}'
        values: '687600x3'
      - series: 'foundation_by_pnu_serving_freshness_budget_seconds{lane="parcel-public-auction"}'
        values: '172800x3'
      - series: 'foundation_by_pnu_served_manifest_age_seconds{lane="parcel"}'
        values: '3600x3'
      - series: 'foundation_by_pnu_serving_freshness_budget_seconds{lane="parcel"}'
        values: '172800x3'
    alert_rule_test:
      - eval_time: 1h
        alertname: FoundationByPnuServingStale
        exp_alerts:
          - exp_labels:
              severity: page
              service: serving-freshness
              lane: parcel
              bake_job: by_pnu_serving_bake
            exp_annotations:
              summary: 'parcel 레인 화면이 입력보다 12d 2h 0m 0s 뒤처진 데이터를 보여 주고 있어요(예산을 넘김) — 그 뒤 굽기가 발행하지 못했거나 그 Gold 가 다시 지어지지 않았어요. 굽기의 거부 이유(journalctl -u foundation-by-pnu-lane-bake@parcel.service, 필지·건물 레인은 foundation-by-pnu-serving-bake.service)와 Gold 재빌드 작업을 보세요'
              runbook: docs/runbooks/parcel-by-pnu-serving-bake.md
          - exp_labels:
              severity: page
              service: serving-freshness
              lane: parcel-public-auction
            exp_annotations:
              summary: 'parcel-public-auction 레인 화면이 입력보다 7d 23h 0m 0s 뒤처진 데이터를 보여 주고 있어요(예산을 넘김) — 그 뒤 굽기가 발행하지 못했거나 그 Gold 가 다시 지어지지 않았어요. 굽기의 거부 이유(journalctl -u foundation-by-pnu-lane-bake@parcel-public-auction.service, 필지·건물 레인은 foundation-by-pnu-serving-bake.service)와 Gold 재빌드 작업을 보세요'
              runbook: docs/runbooks/parcel-by-pnu-serving-bake.md

  # A monitor that stopped measuring (its timer gone) is said, not taken for a fresh lane.
  - interval: 1h
    input_series:
      - series: 'foundation_by_pnu_serving_monitor_timestamp_seconds{lane="parcel"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 2h
        alertname: FoundationByPnuServingMonitorSilent
        exp_alerts: []
      - eval_time: 4h
        alertname: FoundationByPnuServingMonitorSilent
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: serving-freshness
              lane: parcel
            exp_annotations:
              summary: 'parcel 레인의 서빙 모니터가 4h 0m 0s째 화면을 재지 못했어요 — 오래된 데이터를 보여 줘도 알 수 없어요. systemctl status foundation-by-pnu-serving-monitor@parcel.timer 를 보세요'
              runbook: docs/runbooks/parcel-by-pnu-serving-bake.md

  # Root ADR-0522. 2026-11-11 parcel-nearby had been registered (its bake enabled) with no serving
  # monitor and no series. Past the 48-hour budget unmeasured it pages; a lane registered 40 hours ago
  # and a lane its monitor measures stay quiet; a lane with no enabled bake (since 0) is said at once
  # once nothing measures it.
  - interval: 1h
    input_series:
      - series: 'foundation_serving_freshness_budget_seconds'
        values: '172800x60'
      - series: 'foundation_by_pnu_lane_registered_since_timestamp_seconds{lane="parcel-nearby"}'
        values: '0x60'
      - series: 'foundation_by_pnu_lane_registered_since_timestamp_seconds{lane="parcel-real-transaction"}'
        values: '36000x60'
      - series: 'foundation_by_pnu_lane_registered_since_timestamp_seconds{lane="parcel-court-auction"}'
        values: '0x60'
      - series: 'foundation_by_pnu_served_manifest_age_seconds{lane="parcel-court-auction"}'
        values: '16000x60'
    alert_rule_test:
      - eval_time: 47h
        alertname: FoundationByPnuLaneUnmeasured
        exp_alerts: []
      - eval_time: 50h
        alertname: FoundationByPnuLaneUnmeasured
        exp_alerts:
          - exp_labels:
              severity: page
              service: serving-freshness
              lane: parcel-nearby
            exp_annotations:
              summary: 'parcel-nearby 레인은 서빙하기로 등록됐는데, 신선도 예산이 지나도록 화면에 나간 manifest 를 재는 것이 없어요 — 첫 발행이 안 됐거나 서빙 모니터 타이머가 꺼져 있어요. 그 레인의 cut-over 기록(by-pnu-auto-promote)과 systemctl status foundation-by-pnu-serving-monitor@parcel-nearby.timer 를 보세요'
              runbook: docs/runbooks/parcel-by-pnu-serving-bake.md

  # Root ADR-0522. 2026-11-11 the parcels tiles served a 2026-09-28 release about 26 days behind
  # gold.parcel_boundary_served; admin served a 10-16 release that held every change (0, quiet); the
  # zoning unit the runtime manifest lacks is not on the map; complex's table could not be read.
  - interval: 1m
    input_series:
      - series: 'foundation_serving_freshness_budget_seconds'
        values: '172800x90'
      - series: 'foundation_tile_unit_behind_seconds{unit="parcels"}'
        values: '2300000x90'
      - series: 'foundation_tile_unit_behind_seconds{unit="admin"}'
        values: '0x90'
      - series: 'foundation_tile_unit_served{unit="parcels"}'
        values: '1x90'
      - series: 'foundation_tile_unit_served{unit="admin"}'
        values: '1x90'
      - series: 'foundation_tile_unit_served{unit="complex"}'
        values: '1x90'
      - series: 'foundation_tile_unit_served{unit="zoning"}'
        values: '0x90'
    alert_rule_test:
      - eval_time: 1m
        alertname: FoundationTileUnitBehind
        exp_alerts:
          - exp_labels:
              severity: page
              service: serving-freshness
              unit: parcels
            exp_annotations:
              summary: '지도 타일 parcels 이 입력보다 26d 14h 53m 20s 뒤처진 릴리스를 보여 주고 있어요(예산을 넘김) — 그 뒤 타일 굽기·릴리스가 발행하지 못했어요. 레인 색인(config/by-pnu-lane-index.v1.json tile_units)의 그 유닛 굽기 작업 journalctl 과 거부 이유를 보세요'
              runbook: docs/runbooks/parcel-tile-bake.md
      - eval_time: 20m
        alertname: FoundationTileUnitNotServed
        exp_alerts: []
      - eval_time: 31m
        alertname: FoundationTileUnitNotServed
        exp_alerts:
          - exp_labels:
              severity: page
              service: serving-freshness
              unit: zoning
            exp_annotations:
              summary: '지도 타일 zoning 이 정의에는 있는데 지도가 읽는 런타임 manifest 에 없어요 — 그 층이 지도에 안 나와요. /catalog/v1/vector-tiles/runtime-manifest 의 publication_units 와 그 유닛의 승격 기록을 보세요'
              runbook: docs/runbooks/parcel-tile-bake.md
      - eval_time: 61m
        alertname: FoundationTileUnitUnmeasured
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: serving-freshness
              unit: complex
            exp_annotations:
              summary: '지도 타일 complex의 신선도를 1시간째 재지 못했어요 — 뒤처진 릴리스를 보여 줘도 알 수 없어요. journalctl -u foundation-asset-reconcile.service 의 "could not read the tile runtime manifest" 나 "could not read" 줄을 보세요'
              runbook: docs/runbooks/asset-reconcile.md

  # The runtime manifest unreadable: no unit series at all, said once.
  - interval: 1m
    input_series:
      - series: 'foundation_serving_freshness_budget_seconds'
        values: '172800x90'
    alert_rule_test:
      - eval_time: 61m
        alertname: FoundationTileUnitUnmeasured
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: serving-freshness
            exp_annotations:
              summary: '지도 타일의 신선도를 1시간째 재지 못했어요 — 뒤처진 릴리스를 보여 줘도 알 수 없어요. journalctl -u foundation-asset-reconcile.service 의 "could not read the tile runtime manifest" 나 "could not read" 줄을 보세요'
              runbook: docs/runbooks/asset-reconcile.md

  # Root ADR-0490 §7: 202609 waited 37 days past its measurement while 202606 was served, against a
  # 14-day budget; a newer edition five days in is the work, not a stall.
  - interval: 1m
    input_series:
      - series: 'foundation_parcel_served_edition_behind_seconds{served="202606",newest="202609"}'
        values: '3196800x5'
      - series: 'foundation_parcel_served_edition_behind_seconds{served="209906",newest="209909"}'
        values: '432000x5'
      - series: 'foundation_parcel_served_edition_behind_budget_seconds'
        values: '1209600x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: FoundationParcelServedEditionBehind
        exp_alerts:
          - exp_labels:
              severity: page
              service: serving-freshness
              served: '202606'
              newest: '202609'
            exp_annotations:
              summary: '지도와 필지 패널이 202606 판을 보여 주는데, Silver 에 있는 새 판 202609 가 37d 0h 0m 0s째 승격되지 못했어요 — 그 사이 바뀐 법정동 코드의 필지는 화면에서 못 찾아요. 판 준비 판정(journalctl -u foundation-parcel-edition-readiness.service)이 어느 단계에서 멈췄는지 보세요'
              runbook: docs/runbooks/vworld-parcel-editions.md

  # 2026-11-04..11 every judgement left Silver unmeasured: said after an hour, not taken for no lag.
  - interval: 1m
    input_series:
      - series: 'foundation_parcel_edition_silver_measured'
        values: '0x90'
    alert_rule_test:
      - eval_time: 30m
        alertname: FoundationParcelEditionSilverUnmeasured
        exp_alerts: []
      - eval_time: 61m
        alertname: FoundationParcelEditionSilverUnmeasured
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: serving-freshness
            exp_annotations:
              summary: '판 준비 판정이 Silver 의 판별 행 수를 읽지 못했어요 — 새 판이 준비됐는지, 서빙판이 뒤처졌는지 모르는 상태예요. journalctl -u foundation-parcel-edition-readiness.service 의 "silver not measured" 이유를 보세요'
              runbook: docs/runbooks/vworld-parcel-editions.md

  # The daily judgement that stopped running is said after three days.
  - interval: 1h
    input_series:
      - series: 'foundation_parcel_edition_readiness_timestamp_seconds'
        values: '0x100'
    alert_rule_test:
      - eval_time: 2d
        alertname: FoundationParcelEditionReadinessSilent
        exp_alerts: []
      - eval_time: 4d
        alertname: FoundationParcelEditionReadinessSilent
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: serving-freshness
            exp_annotations:
              summary: '판 준비 판정이 4d 0h 0m 0s째 돌지 않았어요 — 서빙판이 뒤처져도 알 수 없어요. systemctl status foundation-parcel-edition-readiness.service 를 보세요'
              runbook: docs/runbooks/vworld-parcel-editions.md
