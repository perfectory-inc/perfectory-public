name: foundation-release-build
# Each commit on main is built once into the release's artifacts, listed in one manifest and signed
# with a Sigstore keyless SLSA provenance attestation over the manifest and every blob it names
# (root ADR-0276 §2, §3, §9). The host installs only this (stage R3, ADR-0309): it pulls the release
# by digest and verifies the attestation offline. It gates no pull request: a pull request does not
# build a release.
# workflow_dispatch rebuilds the same ref.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

# One group per commit: every commit on main gets its own release (root ADR-0276 §9). Grouped by
# ref, GitHub keeps one pending run and cancels the others, and the commits between have none.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Root ADR-0309: a commit that changes nothing the release is made of or the host reads
  # (tools/ci/change-scope.json) gets no release, and the host does not deploy it. A manual run
  # always builds. 2026-10-27: the web-only #879 got a 10.5 min release build and a 12 min deploy.
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.select.outputs.affected }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Generate the declared artifacts (root ADR-0418)
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/ci/generate-declared.sh"
      - name: Select
        id: select
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.after || github.sha }}
        run: python3 scripts/ci/change_scope.py select --workflow foundation-release-build.yml

  build:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' }}
    name: Build and attest the release
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # The job that signs and publishes the release (root ADR-0276 §3, §5): the OIDC token Sigstore's
    # certificate is issued for, the attestation it records, and its own GITHUB_TOKEN's write to this
    # repository's package in GitHub's container registry. No stored secret; only aws-images below,
    # which signs the AWS images of the same commit, holds the same (root ADR-0620).
    outputs:
      publisher: ${{ steps.release-images.outputs.publisher }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false
      - name: Generate the declared artifacts (root ADR-0418)
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/ci/generate-declared.sh"
      # The publisher's build peaked at 16.7 GiB anonymous memory on the server (ADR-0137); the
      # runner has 16 GB. Room for the build: the preinstalled toolchains it never uses, and swap.
      - name: Room for the build
        run: bash scripts/ci/release-build-runner-room.sh
      # BuildKit's cache lives beside the release in its public package, as buildcache-<image> tags
      # (root ADR-0276 §14): cargo-chef's dependency layer is 25 of the publisher's 31 minutes, and
      # it changes only with Cargo.lock. Only this job may write the package.
      - name: Sign in to GitHub's container registry for the build cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # The DuckDB extension files the release carries are pinned downloads (root ADR-0559 §6): the
      # build takes them from the cache main filled, not from the network a release would wait on.
      - name: Restore pinned release binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}
          restore-keys: pinned-release-binaries-v1-${{ runner.os }}-
      # The engine's Spark packages (Iceberg, Hadoop's S3 layer, Sedona: 508 MB of jars) are Ivy's cache,
      # saved from main and keyed by the engine contract: scripts/ci/spark-packages.sh then resolves them
      # with no network. 2026-11-19: Maven Central refused the runners, Ivy reported "module not found",
      # and the merge queue merged nothing for two and a half hours.
      - name: Restore Spark packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/spark-packages/cache
          key: spark-packages-v1-${{ runner.os }}-${{ hashFiles('platforms/foundation-platform/infra/lakehouse/contracts/lakehouse-engine.contract.json') }}
      - name: Build the release artifacts
        run: python3 scripts/deploy/foundation-release-build.py --out "$RUNNER_TEMP/release" --cache-ref "ghcr.io/$GITHUB_REPOSITORY_OWNER/foundation-release" --ivy-cache "$HOME/.cache/perfectory/spark-packages"
      # scripts/ci/spark-packages.sh asks for a save only when it had to download; main alone saves.
      - name: Save Spark packages
        if: ${{ always() && env.PERFECTORY_SPARK_PACKAGES_SAVE != '' && (github.event_name == 'push' || github.event_name == 'schedule') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/spark-packages/cache
          key: spark-packages-v1-${{ runner.os }}-${{ hashFiles('platforms/foundation-platform/infra/lakehouse/contracts/lakehouse-engine.contract.json') }}
      - name: Attest the manifest and every blob
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 (SHA pin, ADR 0028)
        with:
          subject-checksums: ${{ runner.temp }}/release/subjects.sha256
      - name: Keep the bundle beside the manifest
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$RUNNER_TEMP/release/manifest.sigstore.json"
      - name: Publish to GitHub's container registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci/release-push.sh "$RUNNER_TEMP/release" "$GITHUB_REPOSITORY_OWNER"
      # The release's linux/amd64 publisher, which the AWS publisher index joins (root ADR-0620).
      - name: Name the release's publisher
        id: release-images
        run: python3 -c 'import json, sys; print("publisher=" + json.load(open(sys.argv[1]))["images"]["publisher"]["oci_manifest"])' "$RUNNER_TEMP/release/manifest.json" >>"$GITHUB_OUTPUT"
      - name: Report what was built
        run: python3 scripts/ci/release-build-summary.py "$RUNNER_TEMP/release" >>"$GITHUB_STEP_SUMMARY"
      - name: Upload the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (SHA pin, ADR 0028)
        with:
          name: foundation-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  # The AWS images of the same commit (root ADR-0619 §7, ADR-0620): AWS runs on Graviton, so the
  # publisher is built natively on GitHub's arm64 runner and joined with the release's amd64 one into
  # one index, and the code location only AWS runs is built for arm64. The second and last signing
  # job: the same workflow, so the same certificate identity the release is verified by. It starts
  # after the release is published and never holds it back.
  aws-images:
    needs: [scope, build]
    if: ${{ needs.scope.outputs.affected == 'true' }}
    name: Build and attest the AWS images
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false
      - name: Generate the declared artifacts (root ADR-0418)
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/ci/generate-declared.sh"
      - name: Room for the build
        run: bash scripts/ci/release-build-runner-room.sh
      - name: Install skopeo
        run: bash "$GITHUB_WORKSPACE/scripts/ci/apt-install.sh" skopeo
      # The linux-aarch64 extension files are pinned downloads too, from this runner's own cache: its key
      # names the architecture, because runner.os is Linux on both runners and the x86 cache holds no
      # aarch64 file (root ADR-0559 §6). This job fills and saves it on main, below.
      - name: Restore pinned release binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}-${{ runner.arch }}
          restore-keys: pinned-release-binaries-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Sign in to GitHub's container registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GITHUB_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Build, check and publish the AWS images
        env:
          RELEASE_PUBLISHER: ${{ needs.build.outputs.publisher }}
        run: python3 scripts/deploy/aws-images-build.py --out "$RUNNER_TEMP/aws" --repository "ghcr.io/$GITHUB_REPOSITORY_OWNER/foundation-release" --release-publisher "$RELEASE_PUBLISHER"
      # The images and their record (aws-images.json), under one attestation.
      - name: Attest the AWS images
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 (SHA pin, ADR 0028)
        with:
          subject-checksums: ${{ runner.temp }}/aws/subjects.sha256
      # Only an attested record goes up: <commit>-aws-images is the one input an apply reads (root ADR-0616 §2-4).
      - name: Publish the AWS image record
        run: python3 scripts/deploy/aws-images-build.py --publish-record --out "$RUNNER_TEMP/aws" --repository "ghcr.io/$GITHUB_REPOSITORY_OWNER/foundation-release"
      - name: Report what was built
        run: cat "$RUNNER_TEMP/aws/aws-images.json" >>"$GITHUB_STEP_SUMMARY"
      - name: Fill pinned release binaries
        if: github.event_name == 'push' || github.event_name == 'schedule'
        run: python3 scripts/ci/fetch_pinned.py prefetch --prune
      - name: Save pinned release binaries
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/pinned-artifacts.json', 'tools/*.env', 'platforms/foundation-platform/infra/lakehouse/contracts/duckdb-extensions.contract.json') }}
