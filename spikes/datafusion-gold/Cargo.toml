# A spike (root ADR-0192): its own workspace, outside every area, wired into nothing.
[workspace]

[package]
name = "foundation-datafusion-gold-spike"
version = "0.0.0"
edition = "2021"
rust-version = "1.96.0"
license-file = "../../LICENSES/LicenseRef-Proprietary.txt"
publish = false

[dependencies]
arrow-json = "59.2"
# Without "compression" (CSV/JSON codecs): its bzip2 licence is not on the deny list's allow list.
datafusion = { version = "55.2", default-features = false, features = ["nested_expressions", "crypto_expressions", "datetime_expressions", "encoding_expressions", "regex_expressions", "string_expressions", "unicode_expressions", "parquet", "recursive_protection", "sql"] }
duckdb = { version = "=1.10506.0", default-features = false, features = ["bundled", "json", "parquet"] }
hex = "0.4"
mimalloc = "0.1"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
debug = false
