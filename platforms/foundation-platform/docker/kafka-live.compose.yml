# OCI index digests resolved from the named registry tags with
# `docker buildx imagetools inspect` on 2026-07-23.
services:
  redpanda:
    image: redpandadata/redpanda:v24.3.18@sha256:5c6bdbaf30c97de1ebc2ad417b7d02e0bdb5bf88e243bd3079d74bfde9c7754f
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:${FOUNDATION_TEST_KAFKA_HOST_PORT:-19092}
    ports:
      - "127.0.0.1:${FOUNDATION_TEST_KAFKA_HOST_PORT:-19092}:19092"

  karapace:
    image: ghcr.io/aiven-open/karapace:6.2.4@sha256:005eda40272a09f34e60605ae40b1c205c0a5119164b8a090a51ad7f939f79f3
    command:
      - python3
      - -m
      - karapace
    depends_on:
      - redpanda
    ports:
      - "127.0.0.1:${FOUNDATION_TEST_KARAPACE_HOST_PORT:-18081}:8081"
    environment:
      KARAPACE_ADVERTISED_HOSTNAME: karapace
      KARAPACE_BOOTSTRAP_URI: redpanda:9092
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8081
      KARAPACE_REGISTRY_HOST: 0.0.0.0
      KARAPACE_REGISTRY_PORT: 8081
      KARAPACE_COMPATIBILITY: BACKWARD_TRANSITIVE
      KARAPACE_MASTER_ELECTION_STRATEGY: highest
      KARAPACE_NAME_STRATEGY: topic_name
