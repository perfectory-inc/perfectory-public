# Trino's own single-node config, as the image ships it, plus explicit memory limits
# (root ADR-0118 §6). The container is capped in compose.lakehouse.yml, and the image's
# jvm.config sizes the heap at 80% of that cap: 20g -> 16GB heap.
#
# The largest query measured on ai-server (2026-09-25, 100 retained) reserved 7.0GB. The default
# per-node limit would be 30% of the heap (4.8GB) and would refuse it, so the limit is stated:
# 10GB per query, which with the default 30% heap headroom (4.8GB) still fits in 16GB.
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
query.max-memory=10GB
query.max-memory-per-node=10GB
