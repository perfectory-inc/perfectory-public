[workspace]
resolver = "2"
members = ["server"]

[workspace.package]
edition = "2021"
rust-version = "1.96.0"
license-file = "../../LICENSES/LicenseRef-Proprietary.txt"
authors = ["Perfectory"]
publish = false

# Dawneer staff console (root ADR-0114, ADR-0116). The server is the BFF: it holds staff tokens and
# relays an allow-list of platform routes. It owns no domain data.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_imports = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }
