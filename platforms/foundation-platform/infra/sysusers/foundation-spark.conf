# The account of the Spark containers (compose.lakehouse.yml user: FOUNDATION_PLATFORM_LAKEHOUSE_UID,
# 185, the apache/spark image's own uid): the host names it so the directories only Spark writes
# belong to it (orchestration/jobs.v1.json state_directories; root ADR-0270 §1). No login, no home.
g foundation-spark 185
u foundation-spark 185:185 "Spark containers (compose.lakehouse.yml)" / /usr/sbin/nologin
