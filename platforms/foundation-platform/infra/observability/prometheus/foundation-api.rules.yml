groups:
  - name: foundation-api
    rules:
      - alert: FoundationPlatformApiScrapeDown
        expr: foundation_api_up != 1 or absent(foundation_api_up)
        for: 2m
        labels:
          severity: page
          service: foundation-api
        annotations:
          summary: Foundation Platform API metrics scrape is not healthy
          description: foundation_api_up is missing or not equal to 1 for more than 2 minutes.
          runbook: docs/runbooks/slo-alert-policy.md
      - alert: FoundationPlatformApiDatabaseUnavailable
        expr: foundation_api_database_ready != 1
        for: 2m
        labels:
          severity: page
          service: foundation-api
        annotations:
          summary: Foundation Platform API database readiness is down
          description: foundation_api_database_ready is not equal to 1 for more than 2 minutes.
          runbook: docs/runbooks/slo-alert-policy.md
      - alert: FoundationPlatformApiSchemaBehind
        # Connectivity is not readiness: the deployment host once held 4 of 33 migrations for
        # six weeks while the database answered SELECT 1, so DatabaseUnavailable never fired
        # and the API answered 500 (root ADR-0071). This gauge compares the ledger against the
        # migrations the running binary was built with.
        expr: foundation_api_schema_ready != 1
        for: 5m
        labels:
          severity: page
          service: foundation-api
        annotations:
          summary: Foundation Platform API database schema is behind the running binary
          description: foundation_api_schema_ready is not equal to 1 for more than 5 minutes. The database does not hold every migration the binary shipped with; run foundation-migrate.
          runbook: docs/runbooks/slo-alert-policy.md
      - alert: FoundationPlatformApiHigh5xxRate
        expr: sum(rate(foundation_api_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(foundation_api_http_requests_total[5m])), 1) > 0.01
        for: 5m
        labels:
          severity: page
          service: foundation-api
        annotations:
          summary: Foundation Platform API 5xx rate is high
          description: More than 1 percent of Foundation Platform API requests returned 5xx status over the last 5 minutes.
          runbook: docs/runbooks/slo-alert-policy.md
      - alert: FoundationPlatformApiRequestTimeouts
        expr: sum(rate(foundation_api_http_request_timeout_total[5m])) > 0
        for: 5m
        labels:
          severity: ticket
          service: foundation-api
        annotations:
          summary: Foundation Platform API request timeouts observed
          description: Foundation Platform API returned timeout responses during the last 5 minutes.
          runbook: docs/runbooks/slo-alert-policy.md
      - alert: FoundationPlatformApiOverloadRejected
        expr: sum(rate(foundation_api_http_overload_rejected_total[5m])) > 0
        for: 5m
        labels:
          severity: ticket
          service: foundation-api
        annotations:
          summary: Foundation Platform API overload rejections observed
          description: Foundation Platform API rejected requests before route handling because an app-level overload budget was exceeded.
          runbook: docs/runbooks/slo-alert-policy.md
      - alert: FoundationPlatformApiDbPoolExhausted
        expr: foundation_api_db_pool_idle_connections == 0 and foundation_api_db_pool_size >= foundation_api_db_pool_max_connections
        for: 5m
        labels:
          severity: ticket
          service: foundation-api
        annotations:
          summary: Foundation Platform API DB pool is exhausted
          description: Foundation Platform API PostgreSQL pool has no idle connections and has reached the configured maximum pool size.
          runbook: docs/runbooks/slo-alert-policy.md
      - alert: FoundationPlatformApiHighLatency
        expr: histogram_quantile(0.95, sum(rate(foundation_api_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: ticket
          service: foundation-api
        annotations:
          summary: Foundation Platform API request latency is high
          description: Foundation Platform API p95 request latency exceeded 1 second over the last 5 minutes.
          runbook: docs/runbooks/slo-alert-policy.md
      - alert: FoundationPlatformLakehouseBatchStale
        expr: time() - foundation_platform_lakehouse_batch_last_success_recorded_at_seconds > 86400
        for: 15m
        labels:
          severity: ticket
          service: foundation-api
        annotations:
          summary: Foundation Platform lakehouse batch is stale
          description: Latest successful lakehouse batch audit record is older than 24 hours for at least one contract.
          runbook: docs/runbooks/slo-alert-policy.md
      - alert: FoundationPlatformIngestionRunStale
        expr: time() - foundation_platform_ingestion_run_last_finished_at_seconds > 86400
        for: 15m
        labels:
          severity: ticket
          service: foundation-api
        annotations:
          summary: Foundation Platform ingestion source is stale
          description: Latest finished Bronze ingestion run is older than 24 hours for at least one source.
          runbook: docs/runbooks/slo-alert-policy.md
      - alert: FoundationPlatformIngestionRunFailed
        expr: foundation_platform_ingestion_run_last_finished_at_seconds{status="failed"} > 0
        for: 10m
        labels:
          severity: ticket
          service: foundation-api
        annotations:
          summary: Foundation Platform latest ingestion run failed
          description: The latest finished Bronze ingestion run has failed status for at least one source.
          runbook: docs/runbooks/slo-alert-policy.md
      - alert: FoundationPlatformIngestionRunSlow
        expr: foundation_platform_ingestion_run_last_duration_seconds > 3600
        for: 10m
        labels:
          severity: ticket
          service: foundation-api
        annotations:
          summary: Foundation Platform latest ingestion run is slow
          description: Latest finished Bronze ingestion run duration exceeded 3600 seconds for at least one source.
          runbook: docs/runbooks/slo-alert-policy.md
      - alert: FoundationPlatformOutboxOldestPendingStale
        expr: foundation_platform_outbox_oldest_pending_age_seconds > 600
        for: 10m
        labels:
          severity: ticket
          service: foundation-api
        annotations:
          summary: Foundation Platform outbox pending age is high
          description: Oldest unpublished outbox event age exceeded 600 seconds for at least one scope.
          runbook: docs/runbooks/slo-alert-policy.md
      - alert: FoundationPlatformOutboxRetryBacklog
        expr: foundation_platform_outbox_retry_event_count > 0
        for: 10m
        labels:
          severity: ticket
          service: foundation-api
        annotations:
          summary: Foundation Platform outbox retry backlog is non-empty
          description: At least one unpublished outbox event has retry_count greater than zero for 10 minutes.
          runbook: docs/runbooks/slo-alert-policy.md
      # The operations map's problems (root ADR-0195), one alert per job and kind. Alertmanager
      # sends one notice when it starts and one when it resolves; the labels change only when a
      # new run changes what the problem is (services/foundation-api/src/routes/data_catalog/alerts.rs).
      # keep_firing_for holds it through a restart or a scrape the map could not read, so neither
      # is reported as resolved and then again as new.
      - alert: FoundationScheduledJobProblem
        expr: foundation_scheduled_job_problem == 1
        for: 1m
        keep_firing_for: 15m
        labels:
          severity: ticket
          service: data-flow
        annotations:
          summary: '{{ $labels.job_id }} [{{ $labels.kind }}] {{ $labels.summary }}{{ if $labels.link }} — {{ $labels.link }}{{ end }}'
          runbook: docs/runbooks/operations-map.md
      - alert: FoundationScheduledJobsUnreadable
        # Without the runs the map knows no problem, so the alert above cannot fire either.
        expr: foundation_scheduled_jobs_readable == 0
        for: 30m
        labels:
          severity: ticket
          service: data-flow
        annotations:
          summary: 데이터 흐름 지도가 30분째 작업 실행 기록을 못 읽어요 — 문제가 생겨도 알림이 안 와요
          runbook: docs/runbooks/operations-map.md
      # The repository's open security advisories (root ADR-0278): Dependabot alerts and what the
      # daily OSV and Cargo ratchets on main refuse, one alert per source, advisory and package.
      # Alertmanager sends one notice when it opens and one when a read finds it gone; a source
      # that cannot be read keeps its last findings (services/foundation-api/src/routes/data_catalog/security_alerts.rs).
      - alert: FoundationSecurityAdvisory
        expr: foundation_security_advisory == 1
        for: 1m
        keep_firing_for: 15m
        labels:
          severity: ticket
          service: security
        annotations:
          summary: '보안 권고 [{{ $labels.source }}] {{ $labels.advisory }} {{ $labels.package }}{{ if $labels.advisory_severity }} ({{ $labels.advisory_severity }}){{ end }} — {{ $labels.link }}'
          runbook: docs/runbooks/security-advisories.md
      - alert: FoundationSecurityAdvisoriesUnreadable
        # A source not read for six hours (no token, GitHub refusing, the service checks stopped)
        # can miss a new advisory; what it last knew still pages.
        expr: foundation_security_advisories_readable == 0 or absent(foundation_security_advisories_readable)
        for: 6h
        labels:
          severity: ticket
          service: security
        annotations:
          summary: '보안 권고 출처 {{ with $labels.source }}{{ . }}{{ else }}전체{{ end }} 를 6시간째 못 읽어요{{ with $labels.reason }} ({{ . }}){{ end }} — 새 권고가 와도 알림이 안 갈 수 있어요'
          runbook: docs/runbooks/security-advisories.md
      # What the deploy is doing (root ADR-0321 §5, closing ADR-0301 §3): 2026-10-26 step 0 waited
      # 1.5h on the by-PNU bake with every DAG paused and collection stopped for 2h, and nothing
      # said so. Each series is a start time that stays the same for the phase or pause it names,
      # so Alertmanager sends one notice when the bound is crossed and one when it ends. Measured on
      # the host (journal of foundation-autodeploy.service, 9 deploys since ADR-0301 stage 1 on
      # 10-27): the drain took 1.1–2.6 min, every DAG was paused 2.9–4.5 min, the held ones
      # 11.3–14.5 min, a whole deploy 11.7–14.9 min. Each bound is several times the longest.
      - alert: FoundationDeployDrainLong
        expr: time() - foundation_deploy_phase_started_timestamp_seconds{phase="drain"} > 1200
        labels:
          severity: ticket
          service: deploy
        annotations:
          summary: '배포 0단계(드레인)가 20분 넘게 끝나지 않아요 — 그동안 모든 DAG 이 멈춰 있어요. journalctl -u foundation-autodeploy.service 로 무엇을 기다리는지 보세요'
          runbook: docs/runbooks/deploy-alerts.md
      - alert: FoundationDeployLong
        expr: time() - foundation_deploy_started_timestamp_seconds > 3600
        labels:
          severity: ticket
          service: deploy
        annotations:
          summary: '{{ $labels.sha }} 배포가 1시간 넘게 진행 중이에요 — journalctl -u foundation-autodeploy.service'
          runbook: docs/runbooks/deploy-alerts.md
      - alert: FoundationDeployDagsPausedLong
        # Every DAG (scope all) or the jobs the release holds (scope held). The series outlives a
        # deploy that left DAGs paused, and is gone once they are unpaused.
        expr: >-
          time() - foundation_deploy_dags_paused_since_timestamp_seconds{scope="all"} > 1800
          or time() - foundation_deploy_dags_paused_since_timestamp_seconds{scope="held"} > 3600
        labels:
          severity: ticket
          service: deploy
        annotations:
          summary: '배포가 DAG({{ $labels.scope }})을 {{ humanizeDuration $value }}째 멈춰 두고 있어요 — 수집·적재가 돌지 않아요. 배포가 끝났는데도 남아 있으면 jobs.v1.json 의 켜진 작업을 손으로 unpause 하세요'
          runbook: docs/runbooks/deploy-alerts.md
      - alert: FoundationDeployMetricsUnread
        # Without the textfile the three alerts above cannot fire.
        expr: up{job="node-exporter"} != 1 or absent(up{job="node-exporter"}) or node_textfile_scrape_error != 0
        for: 30m
        labels:
          severity: ticket
          service: deploy
        annotations:
          summary: 배포 상태 지표(node-exporter textfile)를 30분째 못 읽어요 — 배포가 DAG 을 오래 멈춰도 알림이 안 가요
          runbook: docs/runbooks/deploy-alerts.md
      # 공매 물건상세·사진 커버리지 (root ADR-0330 §4). 2026-10-28: the collector succeeded every hour
      # while the media cap silently skipped the photos of most conditions it had marked detailed —
      # 622 of 72,188 listed conditions had a photo and nothing said so. The collector writes the
      # share of open conditions whose detail and media all landed; a drop of more than 5 points
      # from the last day's best that lasts three hourly runs is a regression, not a new pass's
      # fresh conditions (those are asked first and settle within a run or two).
      - alert: FoundationOnbidDetailCoverageRegressed
        expr: >-
          max_over_time(foundation_onbid_item_detail_coverage_ratio[1d])
          - foundation_onbid_item_detail_coverage_ratio > 0.05
        for: 3h
        labels:
          severity: ticket
          service: data-flow
        annotations:
          summary: '공매 물건상세·사진 커버리지가 하루 최고치보다 {{ $value | humanizePercentage }} 떨어졌어요 — 열린 회차의 상세·사진이 밀리고 있어요. onbid 수집 run.log 의 onbid-media-summary-json 을 보세요'
          runbook: docs/runbooks/data-go-kr-onbid.md
      - alert: FoundationOnbidDetailCoverageStale
        # The collector runs hourly; three hours without a write means it stopped or cannot write,
        # and the rule above cannot fire on numbers that no longer change.
        expr: time() - foundation_onbid_item_detail_written_timestamp_seconds > 3 * 3600
        for: 15m
        labels:
          severity: ticket
          service: data-flow
        annotations:
          summary: 공매 물건상세 커버리지 지표가 3시간째 갱신되지 않아요 — onbid 수집이 멈췄거나 /var/lib/foundation-jobs/metrics 에 못 써요
          runbook: docs/runbooks/data-go-kr-onbid.md
      - alert: FoundationSecurityTokenExpiring
        expr: foundation_security_token_expires_days < 14
        for: 1h
        labels:
          severity: ticket
          service: security
        annotations:
          summary: 'Dependabot 알림을 읽는 GitHub 토큰이 {{ $value }}일 뒤 만료돼요 — 런북대로 새 토큰을 넣어 주세요'
          runbook: docs/runbooks/security-advisories.md
