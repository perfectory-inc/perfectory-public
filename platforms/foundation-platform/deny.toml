[graph]
# hakari writes the workspace-hack crate (root ADR-0269); its plain version lines are the point,
# not a second declaration. Every crate it names is a dependency of a member, so out of the graph
# it takes nothing out of the licence, advisory and ban checks.
exclude = ["foundation-workspace-hack"]
all-features = true

[advisories]
yanked = "deny"
# Fail on unmaintained/unsound advisories anywhere in the dependency graph, not just
# workspace-local crates, so transitive advisories are caught rather than silently
# scope-excluded. Accepted findings must be listed explicitly in `ignore` with a
# justification (see foundation-platform adversarial review PCR2-73 / remediation #10).
unmaintained = "all"
unsound = "all"
# Accepted, tracked transitive finding (remove once fixed upstream):
# RUSTSEC-2024-0436 is pulled in only by Apache Parquet 59.1.0. Apache removed
# `paste` upstream, but as of 2026-07-23 no released 59.x version contains that
# change (and the newer 58.4.0 patch release still declares `paste`). Pinning an
# unreleased Git revision or downgrading the Arrow/Parquet stack would widen risk,
# so retain this compile-time-only maintenance exception until a compatible
# release is published, then upgrade Parquet and delete it.
#
# RUSTSEC-2026-0253 (`lru` panic-safety in `LruCache::pop()`) is reached only through
# `aws-sdk-s3`, which is not optional for R2 access. The advisory is patched in
# `lru >= 0.18.2`, but every published `aws-sdk-s3` release declares `lru = "^0.16.3"` —
# checked 2026-08-13 against both our locked 1.132.0 and the newest 1.141.0 — so the fix
# is semver-unreachable from any released SDK, not merely un-upgraded here. Dropping the
# S3 SDK or pinning an unreleased revision would widen risk. Remove this entry once
# `aws-sdk-s3` publishes a release that depends on `lru >= 0.18.2`.
#
# zip: on 2026-10-16 03:32-03:35 UTC upstream yanked every release line but 9.0.x, and on
# 2026-10-09/10 RUSTSEC-2026-0367 (SUID/SGID bits kept), -0368 (symlink targets outside the
# destination) and -0369 (permissions applied through symlinks) were published, all patched in
# zip >= 9.0.0 and all about `ZipArchive::extract` / `ZipStreamReader::extract` writing to disk.
# Our own dependency is on zip 9, and duckdb 1.10506.1's libduckdb-sys builds with zip ^9. The one
# copy left is zip 8.6.0 under calamine: its newest release, 0.36.1 (checked 2026-10-17), still
# requires `zip ^8.6`, so no released upgrade reaches 9. calamine only opens workbooks in memory
# (`ZipArchive::by_name` + read) and never calls `extract`, so the three advisories' code is not
# reached. Review by 2026-11-17: delete these four entries as soon as calamine releases on zip 9,
# or at once if an advisory names a read path.
#
# webpki-roots/rustls-webpki: RUSTSEC-2026-0382 (rustls-webpki may accept distrusted intermediates)
# and RUSTSEC-2026-0381 (bundled root certs trust distrusted emSign intermediates) were published in
# 2026. -0382 and the 1.x copy of -0381 are FIXED by the bump in this change (rustls-webpki 0.103.16,
# webpki-roots 1.0.10). The one copy left is webpki-roots 0.26.11 under sqlx-core 0.8.6, which pins
# `^0.26`; the fix is only in `>= 1.0.10`, so it is semver-unreachable without a breaking sqlx major
# (no patched 0.26.x exists, checked 2026-10-20). sqlx uses this set only as the TLS root store for
# our own Postgres endpoints (fixed, known hosts), not to validate arbitrary servers, so the
# distrusted-emSign acceptance path is not an exposure here. Review by 2026-11-20: delete as soon as
# sqlx releases depending on webpki-roots >= 1.0.10, or at once if our DB TLS begins validating
# untrusted servers through this set.
ignore = [
    { crate = "zip@8.6.0", reason = "yanked 2026-10-16; dependency of calamine, whose newest 0.36.1 still requires zip ^8.6 (checked 2026-10-17); review by 2026-11-17" },
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 via calamine 0.36.1 (newest, requires zip ^8.6); calamine never calls extract, the affected path; review by 2026-11-17" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 via calamine 0.36.1 (newest, requires zip ^8.6); calamine never calls extract, the affected path; review by 2026-11-17" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 via calamine 0.36.1 (newest, requires zip ^8.6); calamine never calls extract, the affected path; review by 2026-11-17" },
    { id = "RUSTSEC-2024-0436", reason = "parquet 59.1.0 still directly depends on paste; no compatible released Parquet 59.x removes it as of 2026-07-23" },
    { id = "RUSTSEC-2026-0253", reason = "lru is reached only via aws-sdk-s3, whose every published release through 1.141.0 requires lru ^0.16.3 while the fix landed in 0.18.2, as of 2026-08-13" },
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.26.11 via sqlx-core 0.8.6 (pins ^0.26); fix only in >=1.0.10, semver-unreachable without a breaking sqlx major; used only as sqlx's TLS roots for our own Postgres endpoints, not arbitrary-server validation; the 1.x copy is bumped to 1.0.10; review by 2026-11-20" },
]

[licenses]
confidence-threshold = 0.92
unused-allowed-license = "allow"
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = false
unused = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
