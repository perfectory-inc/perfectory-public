# docs — monorepo-wide internal-link gate (docs 재발방지, Phase D).
#
# THE authoritative recurrence gate. Replaces gongzzang's Python markdown-link
# checker (retired) with lychee (Rust), extended repo-wide: every `**/*.md` in
# products/, platforms/, and root docs is checked, not just gongzzang's. Broken
# relative links (moved workflows, renamed migrations, relocated docs) now fail CI
# before they can rot.
#
# Runs on push[main] + every pull_request with NO path filter on purpose — a link
# fix in area A can break a link in area B, so docs everywhere must be revalidated
# on every change. Config is the single SSOT at the repo root: lychee.toml
# (OFFLINE mode = internal file links only, no network).
name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-check:
    name: required/docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # The repository-owned script reads the digest-pinned image SSOT and runs
      # offline; no wrapper Action can download an unverified release binary.
      - name: Check internal links
        run: bash scripts/ci/lychee-docs.sh
      - name: Check generated public-data catalog
        if: ${{ !cancelled() }}
        run: python3 scripts/catalog/render-public-data-catalog.py --check
      - name: Check generated pipeline map and API example
        if: ${{ !cancelled() }}
        run: python3 scripts/catalog/render-pipeline-map.py --check
      - name: Check documents
        if: ${{ !cancelled() }}
        # `--strict` fails when a maintained page has no or an unknown metadata type; `--check`
        # fails on broken local links, English-only prose and unreferenced drafts. The report is
        # not committed (root ADR-0176); it is in the job summary below.
        run: python3 scripts/catalog/audit-documentation.py --check --strict
      - name: Test document audit tool
        run: python3 -m unittest scripts/catalog/test_audit_documentation.py -v
      - name: Check ADR names, headings and numbers
        if: ${{ !cancelled() }}
        # The ADR index is the directory (root ADR-0176); this refuses a bad name or heading and two
        # files with one number — the collision two parallel PRs make without a textual conflict.
        run: python3 scripts/catalog/render-adr-index.py --check
      - name: Test ADR index tool
        run: python3 -m unittest scripts/catalog/test_adr_index.py -v
      - name: Test that unrelated document branches merge cleanly
        # Replays two branches adding adjacent ADRs and unrelated guides by the tree's own hook
        # commands, merges them, and requires no conflict and a green merged tree (root ADR-0176).
        run: python3 scripts/catalog/test_generated_docs_merge.py -v
      - name: Publish document reports to the job summary
        if: ${{ !cancelled() }}
        # Rendered, not committed (root ADR-0176): a failure to render fails the job, so the
        # generators stay runnable, but no PR carries their totals into a shared file.
        run: |
          {
            python3 scripts/catalog/render-adr-index.py
            echo
            python3 scripts/catalog/render-foundation-baseline.py
            echo
            python3 scripts/catalog/render-document-catalog.py
            echo
            python3 scripts/catalog/audit-documentation.py
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Test foundation baseline tool
        # The generator reported a flattering zero four separate ways before these cases pinned it.
        # A stale-file check alone would keep confirming whatever wrong number it last wrote.
        run: python3 -m unittest scripts/catalog/test_foundation_baseline.py -v
      - name: Check generated data contracts
        # ODCS contracts are rendered from the Rust lakehouse contracts and the pipeline graph
        # (root ADR-0123); a hand edit or a source changed without re-rendering fails here.
        run: python3 scripts/catalog/render-data-contracts.py --check
      - name: Test data contract renderer
        run: python3 -m unittest scripts/catalog/test_render_data_contracts.py -v
