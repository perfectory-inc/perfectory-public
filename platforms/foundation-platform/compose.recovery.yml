# Every service names this cap: one uncapped json-file log filled the host disk (root ADR-0118 §6,
# guard every-container-has-a-memory-cap).
x-log-cap: &log-cap
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-foundation-recovery-writer-environment: &foundation-recovery-writer-environment
  PGBACKREST_REPO1_S3_BUCKET: ${FOUNDATION_PLATFORM_R2_POSTGRES_RECOVERY_BUCKET:?set FOUNDATION_PLATFORM_R2_POSTGRES_RECOVERY_BUCKET}
  PGBACKREST_REPO1_S3_ENDPOINT: ${FOUNDATION_PLATFORM_R2_POSTGRES_RECOVERY_ENDPOINT_HOST:?set FOUNDATION_PLATFORM_R2_POSTGRES_RECOVERY_ENDPOINT_HOST}
  PGBACKREST_REPO1_S3_KEY: ${FOUNDATION_PLATFORM_POSTGRES_RECOVERY_WRITER_ACCESS_KEY_ID:?set FOUNDATION_PLATFORM_POSTGRES_RECOVERY_WRITER_ACCESS_KEY_ID}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${FOUNDATION_PLATFORM_POSTGRES_RECOVERY_WRITER_SECRET_ACCESS_KEY:?set FOUNDATION_PLATFORM_POSTGRES_RECOVERY_WRITER_SECRET_ACCESS_KEY}
  PGBACKREST_REPO1_PATH: ${FOUNDATION_RECOVERY_REPOSITORY_PATH:-/postgres/foundation}
  PGBACKREST_REPO1_CIPHER_PASS: ${FOUNDATION_RECOVERY_REPOSITORY_CIPHER_PASS:?set FOUNDATION_RECOVERY_REPOSITORY_CIPHER_PASS}

x-foundation-recovery-reader-environment: &foundation-recovery-reader-environment
  PGBACKREST_REPO1_S3_BUCKET: ${FOUNDATION_PLATFORM_R2_POSTGRES_RECOVERY_BUCKET:?set FOUNDATION_PLATFORM_R2_POSTGRES_RECOVERY_BUCKET}
  PGBACKREST_REPO1_S3_ENDPOINT: ${FOUNDATION_PLATFORM_R2_POSTGRES_RECOVERY_ENDPOINT_HOST:?set FOUNDATION_PLATFORM_R2_POSTGRES_RECOVERY_ENDPOINT_HOST}
  PGBACKREST_REPO1_S3_KEY: ${FOUNDATION_PLATFORM_POSTGRES_RECOVERY_READER_ACCESS_KEY_ID:?set FOUNDATION_PLATFORM_POSTGRES_RECOVERY_READER_ACCESS_KEY_ID}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${FOUNDATION_PLATFORM_POSTGRES_RECOVERY_READER_SECRET_ACCESS_KEY:?set FOUNDATION_PLATFORM_POSTGRES_RECOVERY_READER_SECRET_ACCESS_KEY}
  PGBACKREST_REPO1_PATH: ${FOUNDATION_RECOVERY_REPOSITORY_PATH:-/postgres/foundation}
  PGBACKREST_REPO1_CIPHER_PASS: ${FOUNDATION_RECOVERY_REPOSITORY_CIPHER_PASS:?set FOUNDATION_RECOVERY_REPOSITORY_CIPHER_PASS}

services:
  postgres:
    logging: *log-cap
    image: foundation-postgres-recovery:local
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile.recovery
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=foundation archive-push %p
      - -c
      - archive_timeout=60s
      # Who a backend served, in every line it logs and in the connection line that names its pid:
      # 2026-11-13 23:28:36Z `server process (PID 1875278) was terminated by signal 13: Broken pipe`
      # restarted every process and nothing said which client it was (prefix `%m [%p]`, no
      # connection log). Clients name themselves: PGAPPNAME in every job unit
      # (foundation-release-admission.conf), application_name in foundation-api's URL.
      - -c
      - "log_line_prefix=%m [%p] %q%a %u@%d %r "
      - -c
      - log_connections=on
      # Crash recovery syncs the data directory and its tablespaces before it replays: file by file
      # (`fsync`) that took 24 minutes on 2026-11-13 (23:28:37Z..23:52:57Z) over the 112 GB parcel_bulk
      # tablespace on the spinning /data disk. `syncfs` asks each file system once (PostgreSQL 14+, Linux).
      - -c
      - recovery_init_sync_method=syncfs
    environment:
      <<: *foundation-recovery-writer-environment
    volumes:
      - pgdata:/var/lib/postgresql/data
      - postgres_socket:/var/run/postgresql
      - pgbackrest_spool:/var/spool/pgbackrest
      - ./infra/postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - psql -U foundation_admin -d foundation -Atqc 'SELECT NOT pg_is_in_recovery()' | grep -qx t
      interval: 2s
      timeout: 2s
      retries: 30

  foundation-backup:
    logging: *log-cap
    image: foundation-postgres-recovery:local
    mem_limit: 1g
    profiles:
      - recovery
    restart: "no"
    command: ["pgbackrest-backup", "backup", "--type=full"]
    environment:
      <<: *foundation-recovery-writer-environment
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      # The tablespaces live outside pgdata (docker-compose.yml, root ADR-0082). pgBackRest follows
      # pg_tblspc into them, so a backup that cannot see this path aborts: it did, every night from
      # 2026-09-04 until 2026-10-02, after the parcel mirror moved to the bulk disk.
      - ${FOUNDATION_PLATFORM_POSTGRES_TABLESPACE_ROOT:-./target/postgres-tablespaces}:/tablespaces:ro
      - postgres_socket:/var/run/postgresql
      - pgbackrest_spool:/var/spool/pgbackrest
      - ./infra/postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    depends_on:
      postgres:
        condition: service_healthy

  foundation-restore-drill:
    logging: *log-cap
    image: foundation-postgres-recovery:local
    mem_limit: 1g
    profiles:
      - recovery
    restart: "no"
    command: ["pgbackrest-restore", "restore"]
    environment:
      <<: *foundation-recovery-reader-environment
    volumes:
      - recovery_data:/var/lib/postgresql/data
      - recovery_tablespaces:/tablespaces
      - pgbackrest_restore_spool:/var/spool/pgbackrest
      - ./infra/postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro

  foundation-restored-postgres:
    logging: *log-cap
    image: foundation-postgres-recovery:local
    mem_limit: 2g
    profiles:
      - recovery
    restart: "no"
    environment:
      <<: *foundation-recovery-reader-environment
      POSTGRES_USER: foundation_admin
      POSTGRES_PASSWORD: ${FOUNDATION_ADMIN_PASSWORD:?set FOUNDATION_ADMIN_PASSWORD}
      POSTGRES_DB: foundation
    volumes:
      - recovery_data:/var/lib/postgresql/data
      - recovery_tablespaces:/tablespaces
      - recovery_socket:/var/run/postgresql
      - pgbackrest_restore_spool:/var/spool/pgbackrest
      - ./infra/postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundation_admin -d foundation"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres_socket:
  pgbackrest_spool:
  pgbackrest_restore_spool:
  recovery_data:
  recovery_tablespaces:
  recovery_socket:
