# The scheduler for Foundation's data jobs (root ADR-0118, ADR-0122). Run through
# scripts/deploy/airflow-runtime.sh, which supplies the secrets file and the Zitadel client file;
# never `docker compose` on this file directly.
#
# Airflow reads its DAGs and the job list from the release itself, mounted at the host path, so a
# release switch (`/opt/foundation-platform/current`) is what changes the jobs. It runs nothing on
# the host itself: a job is its systemd service, which the scheduler asks the host to start over
# a key that can do only that (ADR-0122 §2).

# Every service names this cap: one uncapped json-file log filled the host disk (root ADR-0118 §6,
# guard every-container-has-a-memory-cap).
x-log-cap: &log-cap
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-airflow-environment: &airflow-environment
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  # One run per slot of the pools in orchestration/jobs.v1.json (`spark`: FLOOR alone, or one fold
  # beside the by-PNU bake, root ADR-0138; `documents`: the document text, root ADR-0477 §6), plus one
  # so a default_pool job such as outbox_publish starts while every slot is held (test_job_specs.py).
  AIRFLOW__CORE__PARALLELISM: "5"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # A job's DAG starts paused: it is switched on in the change that removes its systemd timer.
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/foundation-platform/current/orchestration/dags
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:?run airflow-runtime.sh init-secrets}"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?run airflow-runtime.sh init-secrets}@airflow-db:5432/airflow"
  AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:?run airflow-runtime.sh init-secrets}"
  AIRFLOW__API__SECRET_KEY: "${AIRFLOW_API_SECRET_KEY:?run airflow-runtime.sh init-secrets}"
  AIRFLOW__API__BASE_URL: http://127.0.0.1:19080
  # Every run reports to the data catalog (root ADR-0118 §2), on the network DataHub's GMS joins.
  AIRFLOW__OPENLINEAGE__NAMESPACE: perfectory
  AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://datahub-gms:8080", "endpoint": "openapi/openlineage/api/v1/lineage"}'
  # Where a proxied job's `run` task launches its Dagster run (root ADR-0431 §5): the webserver, on this
  # project's network.
  FOUNDATION_DAGSTER_URL: http://dagster-webserver:3000

# The Dagster observer's settings (root ADR-0333 stage 0); the two secrets are made by
# airflow-runtime.sh before any compose call, so the file loads whether the profile is on or not.
x-dagster-environment: &dagster-environment
  DAGSTER_PG_HOST: airflow-db
  DAGSTER_PG_PORT: "5432"
  DAGSTER_PG_PASSWORD: "${DAGSTER_DB_PASSWORD:?run airflow-runtime.sh init-secrets}"
  FOUNDATION_DAGSTER_AIRFLOW_URL: http://airflow-apiserver:8080
  FOUNDATION_DAGSTER_AIRFLOW_USERNAME: foundation-dagster-observe
  FOUNDATION_DAGSTER_AIRFLOW_PASSWORD: "${DAGSTER_AIRFLOW_PASSWORD:?run airflow-runtime.sh init-secrets}"
  FOUNDATION_DAGSTER_TRINO_URL: http://trino:8080
  # Where a dual run's disagreement pages (root ADR-0458): the runtime project's Alertmanager.
  FOUNDATION_DAGSTER_ALERTMANAGER_URL: http://alertmanager:9093

services:
  airflow-db:
    logging: *log-cap
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD:?run airflow-runtime.sh init-secrets}"
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-migrate:
    logging: *log-cap
    # The release's Airflow image: the pinned apache/airflow with dagster-airlift's in-airflow part
    # (orchestration/airflow/Dockerfile, root ADR-0431 §5), built by the release build and tagged by
    # release admission like the Dagster image; the host builds none (root ADR-0276 §13).
    image: foundation-platform-airflow:local
    build:
      context: .
      dockerfile: orchestration/airflow/Dockerfile
    pull_policy: never
    mem_limit: 1g
    restart: "no"
    command: ["db", "migrate"]
    environment:
      <<: *airflow-environment
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-apiserver:
    logging: *log-cap
    image: foundation-platform-airflow:local
    pull_policy: never
    mem_limit: 768m
    restart: unless-stopped
    command: ["api-server"]
    environment:
      <<: *airflow-environment
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:?run identity-platform configure-zitadel.sh}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?run identity-platform configure-zitadel.sh}"
    ports:
      - "127.0.0.1:19080:8080"
    volumes:
      - /opt/foundation-platform:/opt/foundation-platform:ro
      - ./orchestration/webserver_config.py:/opt/airflow/webserver_config.py:ro
    networks:
      - default
      - identity-shared
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1m0s
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully

  # The browser and the API server must name Zitadel by the same issuer, 127.0.0.1:18453 (root
  # ADR-0081); inside the API server's network namespace this forwards that port to Zitadel.
  airflow-zitadel-loopback:
    logging: *log-cap
    image: "alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e"
    mem_limit: 64m
    oom_score_adj: -900
    restart: unless-stopped
    network_mode: "service:airflow-apiserver"
    command:
      - "TCP-LISTEN:18453,fork,reuseaddr,bind=127.0.0.1"
      - "TCP:zitadel:18453"
    depends_on:
      airflow-apiserver:
        condition: service_started

  airflow-scheduler:
    logging: *log-cap
    image: foundation-platform-airflow:local
    pull_policy: never
    mem_limit: 1g
    restart: unless-stopped
    command: ["scheduler"]
    environment:
      <<: *airflow-environment
      # The host, its account `foundation-scheduler`, that account's private key and the host's
      # own key: the job tasks connect with this and nothing else (ADR-0122 §2).
      AIRFLOW_CONN_FOUNDATION_HOST: "${AIRFLOW_CONN_FOUNDATION_HOST:?run airflow-runtime.sh init-secrets}"
    extra_hosts:
      - "foundation-host:host-gateway"
    volumes:
      - /opt/foundation-platform:/opt/foundation-platform:ro
    networks:
      - default
      - metadata-shared
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully

  airflow-dag-processor:
    logging: *log-cap
    image: foundation-platform-airflow:local
    pull_policy: never
    mem_limit: 512m
    restart: unless-stopped
    command: ["dag-processor"]
    environment:
      <<: *airflow-environment
    volumes:
      - /opt/foundation-platform:/opt/foundation-platform:ro
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully

  # Dagster observing this Airflow (root ADR-0333 stage 0, dagster-airlift's "observe"): it runs no
  # job. Off unless orchestration/jobs.v1.json `observers.dagster.enabled` is true; airflow-runtime.sh
  # then turns on the profile, makes the instance's database and role in airflow-db and its Airflow
  # Viewer account. The image holds the locked dependencies; the code location is the release's.
  # Caps: anonymous peaks measured 2026-10-29 against Airflow 3.3.2 with these definitions (webserver
  # 271 MiB; daemon 410 MiB while an asset-check run ran), with what the host budget leaves (root
  # ADR-0138): x1.12 and x1.17, less than the release build's x1.3 (root ADR-0137). Measure both on
  # the host after the profile turns on; a cap the kernel hits is the next budget decision.
  dagster-webserver:
    logging: *log-cap
    image: foundation-platform-dagster:local
    build:
      context: .
      dockerfile: orchestration/dagster/Dockerfile
    pull_policy: never
    profiles: ["dagster-observe"]
    # Anonymous memory, the part the kernel cannot reclaim, peaked at 271 MiB (memory.peak 277 MiB with
    # its page cache, measured 2026-10-29 against Airflow 3.3.2); about x1.12. The host budget
    # (every-container-has-a-memory-cap.sh) had 0.81g left on 2026-11-05 for both containers.
    mem_limit: 304m
    restart: unless-stopped
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/home/workspace.yaml"]
    environment:
      <<: *dagster-environment
    ports:
      - "127.0.0.1:19085:3000"
    volumes:
      - /opt/foundation-platform:/opt/foundation-platform:ro
      - dagster-state:/var/lib/dagster
    depends_on:
      airflow-apiserver:
        condition: service_healthy

  dagster-daemon:
    logging: *log-cap
    image: foundation-platform-dagster:local
    pull_policy: never
    profiles: ["dagster-observe"]
    # Every run is a process of this container (the default run launcher): the daemon, the code server
    # (two while a release reloads it) and up to dagster.yaml's 5 runs, each loading the code location.
    # Measured 2026-11-09 on the host (VmHWM, 64 jobs in the dual run): daemon 190 MiB, code server
    # 169 MiB, so 190 + 2 x 169 + 5 x 169 = 1,373 MiB of anonymous memory with every run open, a run
    # counted at the code server's size; x1.17 as before. The 480m cap was reached 1,240 times in the
    # 20 minutes after its 04:31Z start that day (memory.events max), with no job run at all.
    mem_limit: 1600m
    restart: unless-stopped
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/home/workspace.yaml"]
    environment:
      <<: *dagster-environment
      # A proxied job's run reaches the host as Airflow's `run` task did (run_jobs.py, root ADR-0417): the
      # scheduler's connection from runtime.env, whose key can only run the forced command, and only from
      # this project's network.
      FOUNDATION_HOST_CONNECTION: "${AIRFLOW_CONN_FOUNDATION_HOST:?run airflow-runtime.sh init-secrets}"
    extra_hosts:
      - "foundation-host:host-gateway"
    volumes:
      - /opt/foundation-platform:/opt/foundation-platform:ro
      - dagster-state:/var/lib/dagster
    # The asset checks' runs read the lakehouse through Trino, on the compute project's network, and
    # the dual run pages through Alertmanager, on the runtime project's. The host sees a job run come
    # from this project's network (`default`, the gateway every other route loses to): the scheduler's
    # key is accepted only from there (foundation-release.sh `timers`, authorized_keys `from=`).
    networks:
      default:
        gw_priority: 1
      lakehouse-compute: {}
      foundation-runtime: {}
    depends_on:
      airflow-apiserver:
        condition: service_healthy

volumes:
  airflow-db:
  dagster-state:

networks:
  identity-shared:
    external: true
  metadata-shared:
    external: true
  # compose.lakehouse.yml's project default network, where Trino answers as `trino`.
  lakehouse-compute:
    external: true
    name: foundation-platform-compute_default
  # docker-compose.yml's project default network, where Alertmanager answers as `alertmanager`.
  foundation-runtime:
    external: true
    name: foundation-platform-runtime_default
