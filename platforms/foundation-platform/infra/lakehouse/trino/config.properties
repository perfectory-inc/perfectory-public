# Trino's own single-node config, as the image ships it, plus explicit memory limits
# (root ADR-0118 §6, ADR-0343 §2, ADR-0504). The container is capped in compose.lakehouse.yml at 16g.
#
# The heap is 70% of that cap (jvm.config): 11.2GiB. Trino's accounting sees only the heap, and on
# 2026-11-11 01:25Z the kernel killed Trino at 16.55GB anon RSS with the heap at 80% (12.8GiB): the
# ~3.7GB outside it was glibc malloc arenas (164 of them idle, 2.5GB, measured the same day),
# which MALLOC_ARENA_MAX=4 in compose now bounds. 30% of the cap is left outside the heap.
#
# Per query: 7GB of user memory on this one node; 3GB heap headroom for what Trino does not track.
# 7 + 3 = 10GiB < 11.2GiB, the sum Trino's docs require to stay under the heap. The largest query
# measured (2026-09-25) reserved 7.0GB; joins, aggregations, sorts and windows past the limit spill
# to the data disk (/spill, config/host-layout.contract.json trino_spill) instead of failing.
coordinator=true
node-scheduler.include-coordinator=true
discovery.uri=http://localhost:8080
catalog.management=${ENV:CATALOG_MANAGEMENT}
query.max-memory=7GB
query.max-memory-per-node=7GB
query.max-total-memory=8GB
memory.heap-headroom-per-node=3GB
spill-enabled=true
spiller-spill-path=/spill
max-spill-per-node=200GB
query-max-spill-per-node=100GB
