# Orchestration bridge for the foundation runtime (root ADR-0195).
# The operations map reads three stores besides DataHub: the scheduler (Airflow) for a failed
# run's log, the lakehouse catalog for each table's snapshots, and the addresses of both tools'
# own screens for staff (and the console's, which a problem's Slack notice links to, root ADR-0208).
# foundation-api reaches the scheduler's API on the identity network both
# join (`airflow-apiserver`). The sign-in, the catalog token and the screen addresses live in the
# uncommitted operations-map.env (config/runtime-secrets.contract.json); without it the map still
# answers, saying which store it could not read. The host's service checks (root ADR-0209,
# infra/systemd/foundation-service-checks.service) write one file that foundation-api serves as is.
services:
  foundation-api:
    environment:
      FOUNDATION_PLATFORM_AIRFLOW_API_URL: "http://airflow-apiserver:8080"
      FOUNDATION_PLATFORM_SERVICE_CHECKS_PATH: /run/foundation-service-checks/service-checks.json
    volumes:
      - /var/lib/foundation-platform/service-checks:/run/foundation-service-checks:ro
    env_file:
      - path: ${FOUNDATION_PLATFORM_OPERATIONS_MAP_ENV_FILE:-./operations-map.env}
        required: false
