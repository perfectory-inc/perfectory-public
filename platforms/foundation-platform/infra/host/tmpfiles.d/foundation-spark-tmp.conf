# Spark's temporary files on the data disk age out by themselves (root ADR-0611, after ADR-0198).
#
# Every Spark container mounts /data/foundation-platform/spark-tmp as its /tmp
# (config/host-layout.contract.json spark_tmp): Spark's block managers, the JVM's extracted native
# libraries, Iceberg's upload staging and Python's tempfile. A JVM that exits removes its block
# manager; one killed at its unit's time limit cannot. Nothing else removed them: on 2026-11-23 the
# tree held 72.1 GB, 203 block managers from 2026-11-11 on, with one Spark run writing in it.
#
# A run's files are never older than its unit's time limit, and no job's limit with its stop grace
# is longer than a day (the longest, the by-PNU serving bake whose spark-small step mounts this tree
# too, is 21 hours), so what has not been modified for 2 days belongs to no live run.
# test_host_retention.py holds the age above every job's limit. `e` never creates, chowns or removes
# the directory itself, which the release makes 1777.
#
# Type Path                                   Mode User Group Age
e     /data/foundation-platform/spark-tmp     -    -    -     mM:2d
