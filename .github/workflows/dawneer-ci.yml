name: dawneer-ci
on:
  # Required context must also be runnable for a history-free public root.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "consoles/dawneer/**"
      - ".github/workflows/dawneer-ci.yml"
      # The screens generate their API types from this document (`api:check`).
      - "platforms/foundation-platform/docs/openapi/lineage-review.v1.json"
      # Shared verification SSOT (ADR-0004): xtask / the cargo alias / the
      # toolchain pin change how THIS area is verified, so they must retrigger it.
      # monorepo-guard `xtask-path-coverage` enforces this for every area CI.
      - "tools/xtask/**"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
  pull_request:
    branches: [main]
  merge_group:
    # Intentionally unfiltered so required/dawneer always reports.
defaults:
  run:
    working-directory: consoles/dawneer
permissions:
  contents: read

concurrency:
  group: dawneer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Dawneer Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Rust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          workspaces: |
            consoles/dawneer
            tools/xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Single verification SSOT (ADR-0004): xtask owns fmt+clippy+test with the one
      # flag policy. The sign-in suite brings its own fake issuer and Foundation.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8 (SHA pin, ADR 0028)
        with:
          version: 9.12.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (SHA pin, ADR 0028)
        with:
          node-version: "24.20.0"
          cache: pnpm
          cache-dependency-path: consoles/dawneer/web/pnpm-lock.yaml
      - name: Verify (fmt, clippy, test)
        working-directory: ${{ github.workspace }}
        run: cargo xtask verify dawneer

  supply-chain:
    name: Dawneer supply-chain policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: consoles/dawneer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Rust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          workspaces: |
            consoles/dawneer
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-deny
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/install-cargo-deny.sh
      - name: cargo-deny
        run: cargo-deny --locked check

  required:
    name: required/dawneer
    if: ${{ always() }}
    needs: [rust, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require every Dawneer gate
        env:
          REQUIRED_RESULT_RUST: ${{ needs.rust.result }}
          REQUIRED_RESULT_SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
        working-directory: .
        run: bash scripts/ci/require-successful-needs.sh
