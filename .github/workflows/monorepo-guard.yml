name: monorepo-guard
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, w1kch9812-cmd/v8-probe-after-base]
  merge_group:
  # A new advisory reaches main without any commit. The daily run finds it before
  # the next pull request does, and the failed run carries the prepared fix
  # (root ADR-0158): cargo xtask npm open-advisory-fix-pr <run-id>.
  schedule:
    - cron: "17 21 * * *"
permissions:
  contents: read

concurrency:
  group: monorepo-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: required/repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Full history without blobs: the guard selector compares the pull request with
      # its base (root ADR-0207), as the area scope jobs do (root ADR-0202).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      # A tree's own guards cannot see another open pull request: on 2026-10-16 ADR numbers collided
      # four times and a migration version once. One GraphQL read of the open pull requests' added
      # paths with this job's read-only token (public data), and main's tree, a second or two.
      - name: ADR numbers and migration versions no other change holds
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NUMBERING_BASE: ${{ github.event.pull_request.base.sha }}
          NUMBERING_PULL_REQUEST: ${{ github.event.pull_request.number }}
          NUMBERING_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/ci/test_numbering_collisions.py
          python3 scripts/ci/numbering_collisions.py --repository "$NUMBERING_REPOSITORY" \
            --pull-request "$NUMBERING_PULL_REQUEST" --base "$NUMBERING_BASE"
      - name: Restore pinned release binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}
          restore-keys: pinned-release-binaries-v1-${{ runner.os }}-
      # main and the daily run fill and save the cache every job that downloads a pinned release
      # binary restores (root ADR-0197); pull requests and merge groups only read it, so a cold
      # runner meeting one 5xx from the release CDN no longer fails a pull request. The fetcher
      # verifies every file against its pin on the way in and on every read. A key that already
      # exists is left alone (the save warns and succeeds), so this writes once per pin set.
      - name: Fill pinned release binaries
        if: github.event_name == 'push' || github.event_name == 'schedule'
        shell: bash
        run: python3 scripts/ci/fetch_pinned.py prefetch --prune
      - name: Save pinned release binaries
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}-${{ hashFiles('tools/pinned-artifacts.json', 'tools/*.env', 'platforms/foundation-platform/config/static-release-toolchain.contract.json') }}
      - name: Set up Rust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          workspaces: |
            tools/xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `verify` runs the repository guard first and then the area's own
      # fmt/clippy/test, so this one command replaces the previous bare
      # `bash scripts/guard/monorepo-guard.sh` rather than running beside it —
      # invoking both would execute the 57-guard sweep twice in one job.
      #
      # `tooling` is tools/xtask, the fifth Cargo workspace. Until ADR-0011 no
      # area declared it, so `verify` never entered it and its ten unit tests ran
      # nowhere. This workflow is the right home: it has no `paths:` filter, so an
      # xtask change can never fail to retrigger it (xtask-path-coverage.sh treats
      # an unfiltered workflow as covered by construction).
      # The guard chain renders and checks every tree's npm overrides
      # (scripts/guard/npm-security-overrides.sh); it runs on the Node the trees pin.
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (SHA pin, ADR 0028)
        with:
          node-version: "24.20.0"
      # The pinned fetcher's own tests (root ADR-0197): a real HTTP server answers 500 and 504
      # before 200, then stays down while the fetcher serves the file from its cache.
      - name: Pinned release fetcher tests
        run: python3 scripts/ci/test_fetch_pinned.py -v
      # The per-crate build-time summary verify prints (root ADR-0269).
      - name: Build-time summary tests
        run: python3 scripts/ci/test_cargo_timings.py -v
      # The Actions cache budget's contract and its judge (root ADR-0269); the daily
      # ci-cache-budget workflow applies them to the live cache list.
      - name: Actions cache budget tests
        run: |
          python3 scripts/ci/test_actions_cache_budget.py -v
          python3 scripts/ci/actions_cache_budget.py check
      # Root ADR-0207: on a pull request and in the merge queue (root ADR-0313) the runner keeps the
      # guards whose inputs changed (tools/ci/change-scope.json `guards`); a push to main the queue
      # already passed on the same tree runs none (the token reads the queue's runs); every other
      # event runs them all. This is the one run of the guards per CI run: an area's `verify` no
      # longer runs them.
      - name: Repository guard and harness verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: cargo xtask verify tooling
      # Root ADR-0202: the scope selector's unit suite plants every refused shape
      # and its last test checks the repository's workflows against
      # tools/ci/change-scope.json. This repository-wide context always runs.
      - name: Change scope contract and selector
        run: python3 scripts/ci/test_change_scope.py
      # Root ADR-0207: the guard list and its selector; the last tests check the
      # repository's guard scripts against tools/ci/change-scope.json.
      - name: Guard scope contract and selector
        run: python3 scripts/ci/test_guard_scope.py
      - name: REUSE license compliance
        run: bash scripts/ci/reuse-lint.sh
      # Every tracked Cargo.lock and pnpm-lock.yaml in the repository, so the
      # ratchet belongs to the repository context rather than to one area's CI.
      - name: Repository OSV vulnerability ratchet
        run: cargo xtask ci osv-gate --report-path target/supply-chain/osv-report.json
      # When the ratchet (or anything before it) fails, raise the npm floors the
      # report asks for, regenerate every lock with the pinned toolchain and keep
      # the result as a patch. Nothing is pushed: no workflow holds a write token
      # (tools/github/workflow-permissions.json). The maintainer applies it with
      # cargo xtask npm open-advisory-fix-pr <run-id> (root ADR-0158).
      - name: Prepare npm advisory fix
        if: failure()
        run: cargo xtask npm prepare-advisory-fix target/supply-chain/osv-report.json target/supply-chain/npm-advisory-fix
      - name: Upload supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 (SHA pin, ADR 0028)
        with:
          name: repository-supply-chain
          path: target/supply-chain/
          if-no-files-found: warn

