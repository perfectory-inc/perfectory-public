route:
  receiver: prelaunch-audit
  group_by:
    - alertname
    - service
    - environment
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # An alert that only inhibits others (root ADR-0625: the host runs no derived compute) reaches no one.
    - matchers:
        - severity = "none"
      receiver: inhibition-only
    # Pages (root ADR-0591; owner, 2026-11-20: urgent alerts arrive in Slack, no pager): the few things
    # a person must act on: a production unit or job down or failing for hours, a screen serving data
    # past its limit, the disk nearly full, monitoring blind, a deploy stuck. One message per rule,
    # naming each of its alerts, with a channel mention while it fires; at most once an hour while the
    # set changes and once a day while it stays. 2026-11-18/19 the pages one per item would have been
    # about 68 mentions a day; per rule, about 24 (most of them nine failing units).
    # The unit-state, job-outcome and serving-freshness routes held only pages and are gone.
    - matchers:
        - severity = "page"
      receiver: slack-page
      group_by:
        - alertname
      group_wait: 1m
      group_interval: 1h
      repeat_interval: 24h
    # Every `severity: ticket` alert but the security advisories (root ADR-0591): one message per rule,
    # naming each of its alerts, at most once an hour while the set changes (an alert added or
    # resolved) and once a day while it stays. 2026-11-14..19 #alerts got about 480 messages a day,
    # about two thirds of them tickets sent one per item and again on resolve, so no line meant
    # anything. A ticket is read in a batch; a page (below) is read when it comes. Resolved is kept
    # on: without it Alertmanager sends nothing when an alert leaves the batch, and an alert that
    # comes back is still in the last message's set and is not sent again until the daily repeat
    # (DedupStage.needsUpdate, notify/notify.go @v0.28.1).
    # The operations map's problems (root ADR-0195), the job outcomes (ADR-0480), the dual run's
    # tickets (ADR-0458) and the deploy tickets, which had their own routes or the root's, come here.
    - matchers:
        - severity = "ticket"
        - service != "security"
      receiver: slack-ticket
      group_by:
        - alertname
      group_wait: 5m
      group_interval: 1h
      repeat_interval: 24h
    # A host unit that reports its successes as well as its failures
    # (scripts/ops/notify-unit-failure.sh): one notice per unit when it starts failing, one when a
    # run succeeds again, and a reminder a day while it keeps failing. 2026-10-28/29 the hourly
    # by-PNU serving monitors sent a notice per lane every hour and buried the real failures.
    - matchers:
        - service = "unit-failure"
      receiver: slack-unit-failure
      group_by:
        - alertname
        - unit
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 24h
    # Dagster decided a job's run differently from Airflow in the dual run (root ADR-0458): one notice
    # per job, and a reminder a day while the comparisons keep differing; the job's agreeing count
    # starts again from the difference, so it does not move to Dagster until the rules agree. The dual
    # run's own alerts are tickets and are batched above (root ADR-0591); this route keeps the ones
    # posted without a severity.
    - matchers:
        - service = "dual-run"
      receiver: slack-dual-run
      group_by:
        - alertname
        - job
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 24h
    # A provider that refuses our account, and the staging smoke inputs that skipped (root ADR-0363,
    # scripts/ops/provider_alert.py). 2026-10-30 VWorld wanted new terms accepted: one notice per
    # provider with the owner action when it starts, one when a login works again, a reminder a day.
    - matchers:
        - service = "provider-account"
      receiver: slack-provider-account
      group_by:
        - alertname
        - provider
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 24h
    # The repository's open security advisories (root ADR-0278): one notice per advisory when it
    # opens and one when it is gone, and no reminder. Tickets, but not batched (root ADR-0591).
    - matchers:
        - service = "security"
      receiver: slack-security
      group_by:
        - alertname
        - source
        - advisory
        - package
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 8760h

# A job waiting on a failed one says "blocked"; while the job it waits on has failed, that failure's
# own notice is the one to read, and the blocked job would only repeat it. `failed_job` is the failed
# job's id on both (alerts.rs: a failure names its own job, a blocked job the first failed job it
# waits on), so a failure quiets only the jobs blocked behind it. Until 2026-11-20 this matched on
# `alertname`, the same on both sides, so any failed job quieted every blocked one (root ADR-0591).
inhibit_rules:
  - source_matchers:
      - alertname = "FoundationScheduledJobProblem"
      - kind = "failed"
    target_matchers:
      - alertname = "FoundationScheduledJobProblem"
      - kind = "blocked"
    equal:
      - failed_job
  # The job a blocked one waits on did not fail but did nothing either (its run waits in the queue, or
  # was never started): it has no `failed` notice, and its missing outcome is the one to read. The
  # outcome rules name their job as `failed_job` too, the label a blocked job names it by. 2026-11-24
  # 01:20Z: 43 blocked notices were out, 27 of them behind eleven jobs whose missing outcome was already
  # out (nine Gold rebuilds starved of the spark pool's slot, root ADR-0605), and the page for
  # gold_public_auction_rebuild, 94 hours without a run, was read by nobody. Only `done`: a job that ran
  # and changed nothing blocks no one, and `landed` (a source not read) is never a source or a target here.
  - source_matchers:
      - alertname =~ "FoundationJobOutcomeMissing(Long)?"
      - expectation = "done"
    target_matchers:
      - alertname = "FoundationScheduledJobProblem"
      - kind = "blocked"
    equal:
      - failed_job
  # A job that failed is not done: its failure notice, and its unit's, already say so (root ADR-0442 §5:
  # one event, one notice). A job that is not done and has not failed (it waits, is skipped, refused or
  # never started) has no other notice, and keeps this one.
  - source_matchers:
      - alertname = "FoundationScheduledJobProblem"
      - kind = "failed"
    target_matchers:
      - alertname =~ "FoundationJobOutcomeMissing(Long)?"
      - expectation = "done"
    equal:
      - job_id
  - source_matchers:
      - alertname = "FoundationUnitFailedLong"
    target_matchers:
      - alertname =~ "FoundationJobOutcomeMissing(Long)?"
      - expectation = "done"
    equal:
      - unit

  # The long notice of a job's missing outcome is the short one six hours on (root ADR-0480); while
  # it fires the short one only repeats it (root ADR-0591).
  - source_matchers:
      - alertname = "FoundationJobOutcomeMissingLong"
    target_matchers:
      - alertname = "FoundationJobOutcomeMissing"
    equal:
      - job_id
      - expectation
  # foundation-api is the one exporter of the security series (root ADR-0278): while Prometheus cannot
  # scrape it, "advisories unreadable" is that scrape failure said again (2026-11-19, root ADR-0591).
  # One target, so no label to match on.
  - source_matchers:
      - alertname = "FoundationPlatformApiScrapeDown"
    target_matchers:
      - alertname = "FoundationSecurityAdvisoriesUnreadable"
  # While the host's host_scope runs no derived compute (root ADR-0625), what watches derived output says
  # only that it is not made here: the served data's freshness and the media reconciler. The collectors'
  # own pages, the units and the host are not touched. A job the scope leaves out has no outcome series
  # at all (the reconciler judges only the jobs that run here).
  - source_matchers:
      - alertname = "FoundationHostRunsNoDerivedCompute"
    target_matchers:
      - service = "serving-freshness"
  - source_matchers:
      - alertname = "FoundationHostRunsNoDerivedCompute"
    target_matchers:
      - computed_by = "derived"

receivers:
  # No destination: the alerts routed here exist to inhibit others (root ADR-0625).
  - name: inhibition-only
  # One Slack destination; a receiver per route only so that `amtool config routes test` can tell the
  # routes apart (guard alertmanager-routes-pass-their-tests, root ADR-0591).
  - name: prelaunch-audit
    # The bot token is a credential and lives outside this file: the compose file mounts it from
    # the host, because a receiver with no destination is how six weeks of alerts went nowhere
    # (2026-09-02 finding; the runbook owns the setup and ends with a delivery proof).
    #
    # Token mode, not webhook mode, by owner decision (2026-09-03): api_url is Slack's Web API
    # and the Authorization header carries the bot token. One caveat the delivery proof exists
    # for: the Web API answers HTTP 200 even for logical failures (unknown channel, revoked
    # token), so only a message seen in the channel counts as delivered.
    slack_configs: &slack
      - channel: '#alerts'
        api_url: https://slack.com/api/chat.postMessage
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/secrets/slack-bot-token
        send_resolved: true
        # A page that fires starts with a channel mention, so the owner's Slack app notifies; nothing
        # else does: tickets, resolves and the alerts the host scripts post without a severity stay
        # quiet (owner, 2026-11-20: urgent alerts arrive in Slack, no pager; root ADR-0591). The
        # mention lived in four rules' summaries before; one place now decides it.
        pretext: '{{ if and (eq .Status "firing") (eq .CommonLabels.severity "page") }}<!channel>{{ end }}'
        title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }}{{ if gt (len .Alerts) 1 }} ({{ len .Alerts.Firing }}){{ end }}'
        text: >-
          {{ range .Alerts.Firing }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}{{ with .Alerts.Resolved }}해소 {{ len . }}: {{ range . }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}{{ end }}
  - name: slack-page
    slack_configs: *slack
  - name: slack-ticket
    slack_configs: *slack
  - name: slack-unit-failure
    slack_configs: *slack
  - name: slack-dual-run
    slack_configs: *slack
  - name: slack-provider-account
    slack_configs: *slack
  - name: slack-security
    slack_configs: *slack
