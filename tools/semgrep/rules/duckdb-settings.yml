# A DuckDB of the foundation publisher takes its memory, threads and spill ceiling from one
# function, `duckdb_parquet_stage::engine_config`: one share (`MEMORY_SHARE`) of what the process
# may still take, read from the cgroup of whatever runs it (a unit, a container, an AWS task),
# DuckDB's own thread count, which follows the cgroup's CPU quota (DuckDB v2.0.0
# `GetSystemMaxThreads`), and DuckDB's own spill ceiling, 90% of what the spill's disk has free
# (`TemporaryFileManager::GetDefaultMax`).
#
# Prevents: seven ways to set it. Every stage held half the engine contract's compiled
# `execution_profile` (4096 MiB / 2) and two threads whatever its unit held; 2026-11-22 the court
# auction Silver load's first production run stopped on a 사건상세 object above that 2 GiB under a
# 3G unit, and the read was rewritten to fit the number (#1646). Beside it grew a share of the
# cgroup (two copies of 3/5), `limit_memory`, fixed MiB constants per loader (384, 600, 600), a
# 300 MiB environment value from the quality check, a `4GB` one from the Gold verdict, and a copy of
# the whole configuration in the FLOOR scratch: a task of 16 GiB on AWS would still have given most
# of them 2 GiB (root ADR-0616 §5: memory is the task's size). The disk had the same shape: a fixed
# 32 GiB spill ceiling plus a 30 GiB host reserve for the Postgres beside it, which on 2026-11-25
# refused 9 of 16 shadow Gold lanes on ai-server before they read a row (60.5 GB free).
#
# A test may hold a stage to a small budget to provoke a spill: test files (`tests.rs`, `tests/`,
# `*_tests.rs`) are left out. An inline `#[cfg(test)]` module of a source file is held to the rule
# (the engine cannot exclude it), so such a test lives in its sibling test file.
rules:
  - id: duckdb-memory-and-threads-come-from-engine-config
    languages: [regex]
    severity: ERROR
    message: >-
      This sets a DuckDB memory limit, thread count, spill ceiling or configuration of its own.
      Open the DuckDB with duckdb_parquet_stage::engine_config (or a DuckDbParquetStage): its memory
      is the one share of what the task may still take, DuckDB counts the task's CPUs itself and
      caps the spill by the task's disk.
    paths:
      include:
        - /platforms/foundation-platform/**/*.rs
        - /platforms/foundation-platform/**/*.sql
        - /tools/semgrep/rules/duckdb-settings.rs
      exclude:
        - /platforms/foundation-platform/crates/publisher/foundation-publisher-silver/src/duckdb_parquet_stage.rs
        - "**/tests.rs"
        - "**/tests/**"
        - "**/*_tests.rs"
    pattern-regex: >-
      (?i)\bConfig::default\(\)|\.max_memory\(|\.threads\(|\.with\(\s*"(?:memory_limit|max_memory|threads|worker_threads|max_temp_directory_size)"|\b(?:SET|PRAGMA|RESET)\s+(?:GLOBAL\s+|SESSION\s+|LOCAL\s+)?(?:memory_limit|max_memory|threads|worker_threads|max_temp_directory_size)\b
