[[IgnoredVulns]]
id = "GHSA-c475-qrg2-pj4r"
ignoreUntil = 2027-02-02
reason = "basic-ftp: Gongzzang 개발 도구(@puppeteer/browsers 시험 브라우저 내려받기, markdown-link-check 문서 링크 검사)가 proxy-agent→pac-proxy-agent→get-uri 로 끌어오는 5.3.1. 서비스 실행 경로에 없고 FTP 주소를 열지 않아 목록 파서 DoS 에 닿지 않는다. 수정판 6.2.1 은 메이저 변경이라 부모(get-uri) 승급 때 함께 닫는다."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2026-11-30
reason = "minimatch: Dawneer 웹과 Gongzzang 의 openapi-typescript 7.13.0(최신)→@redocly/openapi-core 1.34.x 가 고정하는 5.1.9. 수정판은 11.0.1 뿐인데 11 은 require(\"minimatch\") 를 함수로 내보내지 않아 redocly 를 깨므로 override 로 올리지 못한다. API 타입 생성 개발 도구라 서비스 실행 경로에 없고 우리 OpenAPI 문서의 고정 패턴만 맞춘다. 10.x 는 override(11.0.1)로 닫았다. redocly 1.x 가 minimatch 를 올리거나 openapi-typescript 가 openapi-core 2.x 로 옮길 때 닫는다."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
ignoreUntil = 2027-02-02
reason = "paste: 취약점이 아니라 '관리 중단' 권고다. 사진 사다리(root ADR-0427)의 AVIF 인코더 rav1e 0.8.1(최신)이 컴파일 때만 쓰는 proc-macro 로 끌어온다 — 실행 바이너리에 코드가 없다. deny.toml 이 같은 권고를 parquet 때문에 이미 열어 두었다. rav1e 가 paste 를 떼면(업스트림 이슈) 닫는다."


[[IgnoredVulns]]
id = "RUSTSEC-2026-0459"
ignoreUntil = 2027-02-02
reason = "libsqlite3-sys(번들 C SQLite CVE-2026-119375): 네 Rust lockfile 의 0.30.1 은 sqlx 0.8.6 의 sqlx-macros-core 가 sqlite 기능 없이도 lockfile 에만 풀어 넣는 sqlx-sqlite 의 것이다(sqlx 의 알려진 동작). 2026-11-09 네 워크스페이스 모두 `cargo tree --workspace --all-features --target all -e normal,build,dev -i libsqlite3-sys` 가 비었다 — 어느 빌드도 컴파일하지 않고 SQLite 를 열지 않는다. 수정판 0.39 는 sqlx 0.9 가 끌어오므로 sqlx 승급 때 닫는다."
