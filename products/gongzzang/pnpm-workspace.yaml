packages:
  - "apps/*"
  - "infrastructure"
  - "packages/*"
  - "tools/*"

# Settings that lived in .npmrc and package.json#pnpm; pnpm 11 and later read them only here
# (pnpm's v10 -> v11 migration). `overrides` below is rendered from
# tools/npm/security-overrides.contract.json (root ADR-0158); do not edit it by hand.
autoInstallPeers: true
engineStrict: true
shamefullyHoist: true
strictPeerDependencies: false
virtualStoreDirMaxLength: 20

# Dependencies whose install scripts run; any other dependency with a build script fails the install.
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  # The web preview's build adds wrangler, whose local runtime is workerd (scripts/web-preview/deploy.sh).
  workerd: true

overrides:
  "@grpc/grpc-js@>=1.0.0 <2.0.0": "^1.14.5"
  "basic-ftp@>=5.0.0 <7.0.0": "^6.2.6"
  "brace-expansion@>=5.0.0 <6.0.0": "^5.0.12"
  "esbuild@>=0.0.0 <0.29.0": "^0.28.1"
  "glob@>=13.0.0 <15.0.0": "^14.0.2"
  "http-cache-semantics@>=4.0.0 <5.0.0": "^4.3.0"
  "ip-address@>=10.0.0 <11.0.0": "^10.7.4"
  "js-yaml@>=4.0.0 <5.0.0": "^4.3.2"
  "js-yaml@>=5.0.0 <6.0.0": "^5.4.2"
  "katex@>=0.11.0 <0.20.0": "^0.19.0"
  "markdown-it@>=14.0.0 <15.0.0": "^14.3.3"
  "minimatch@>=10.0.0 <12.0.0": "^11.0.1"
  "pacote@>=21.0.0 <22.0.0": "^21.5.1"
  "postcss@>=8.0.0 <9.0.0": "^8.5.23"
  "sharp@>=0.0.0 <0.36.0": "^0.35.5"
  "smol-toml@>=1.0.0 <2.0.0": "^1.9.0"
