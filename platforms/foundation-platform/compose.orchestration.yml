# The scheduler for Foundation's data jobs (root ADR-0118, ADR-0122). Run through
# scripts/deploy/airflow-runtime.sh, which supplies the secrets file and the Zitadel client file;
# never `docker compose` on this file directly.
#
# Airflow reads its DAGs and the job list from the release itself, mounted at the host path, so a
# release switch (`/opt/foundation-platform/current`) is what changes the jobs. It runs nothing on
# the host itself: a job is its systemd service, which the scheduler asks the host to start over
# a key that can do only that (ADR-0122 §2).

# Every service names this cap: one uncapped json-file log filled the host disk (root ADR-0118 §6,
# guard every-container-has-a-memory-cap).
x-log-cap: &log-cap
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

# Where every run is reported to the data catalog (root ADR-0118 §2), on the network DataHub's GMS joins:
# Airflow's OpenLineage provider for a DAG's runs, and the op of a job Dagster decides for its own
# (orchestration/dagster/lineage.py, root ADR-0565 §7), so both reach the same endpoint.
x-openlineage-transport: &openlineage-transport '{"type": "http", "url": "http://datahub-gms:8080", "endpoint": "openapi/openlineage/api/v1/lineage"}'

x-airflow-environment: &airflow-environment
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  # One run per slot of the pools in orchestration/jobs.v1.json (`spark`: FLOOR alone, or one fold
  # beside the by-PNU bake, root ADR-0138; `documents`: the document text, root ADR-0477 §6), plus one
  # so a default_pool job such as outbox_publish starts while every slot is held (test_job_specs.py).
  AIRFLOW__CORE__PARALLELISM: "5"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # A job's DAG starts paused: it is switched on in the change that removes its systemd timer.
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/foundation-platform/current/orchestration/dags
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:?run airflow-runtime.sh init-secrets}"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?run airflow-runtime.sh init-secrets}@airflow-db:5432/airflow"
  AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:?run airflow-runtime.sh init-secrets}"
  AIRFLOW__API__SECRET_KEY: "${AIRFLOW_API_SECRET_KEY:?run airflow-runtime.sh init-secrets}"
  AIRFLOW__API__BASE_URL: http://127.0.0.1:19080
  AIRFLOW__OPENLINEAGE__NAMESPACE: perfectory
  AIRFLOW__OPENLINEAGE__TRANSPORT: *openlineage-transport
  # Where a proxied job's `run` task launches its Dagster run (root ADR-0431 §5): the webserver, on this
  # project's network.
  FOUNDATION_DAGSTER_URL: http://dagster-webserver:3000

# The Dagster observer's settings (root ADR-0333 stage 0); the two secrets are made by
# airflow-runtime.sh before any compose call, so the file loads whether the profile is on or not.
x-dagster-environment: &dagster-environment
  DAGSTER_PG_HOST: airflow-db
  DAGSTER_PG_PORT: "5432"
  DAGSTER_PG_PASSWORD: "${DAGSTER_DB_PASSWORD:?run airflow-runtime.sh init-secrets}"
  FOUNDATION_DAGSTER_AIRFLOW_URL: http://airflow-apiserver:8080
  FOUNDATION_DAGSTER_AIRFLOW_USERNAME: foundation-dagster-observe
  FOUNDATION_DAGSTER_AIRFLOW_PASSWORD: "${DAGSTER_AIRFLOW_PASSWORD:?run airflow-runtime.sh init-secrets}"
  FOUNDATION_DAGSTER_TRINO_URL: http://trino:8080
  # Where a dual run's disagreement pages (root ADR-0458): the runtime project's Alertmanager.
  FOUNDATION_DAGSTER_ALERTMANAGER_URL: http://alertmanager:9093

services:
  airflow-db:
    logging: *log-cap
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD:?run airflow-runtime.sh init-secrets}"
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-migrate:
    logging: *log-cap
    # The release's Airflow image: the pinned apache/airflow with dagster-airlift's in-airflow part
    # (orchestration/airflow/Dockerfile, root ADR-0431 §5), built by the release build and tagged by
    # release admission like the Dagster image; the host builds none (root ADR-0276 §13).
    image: foundation-platform-airflow:local
    build:
      context: .
      dockerfile: orchestration/airflow/Dockerfile
    pull_policy: never
    mem_limit: 1g
    restart: "no"
    command: ["db", "migrate"]
    environment:
      <<: *airflow-environment
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-apiserver:
    logging: *log-cap
    image: foundation-platform-airflow:local
    pull_policy: never
    # Root ADR-0574's rule, measured max x 1.5: 390 MiB working set over three days to 2026-11-24 00:45Z
    # (cAdvisor max_over_time, this container up since 11-11; memory.events max 0 in the last day), so
    # 592m. The 176m it gives back are part of what the code server's cap takes (root ADR-0583 §8): with
    # 768m here the 24G model no longer fit beside the standing services (every-container-has-a-memory-cap).
    # No job is proxied any more, so nothing but staff and the read paths ask this server until it goes.
    mem_limit: 592m
    restart: unless-stopped
    command: ["api-server"]
    environment:
      <<: *airflow-environment
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:?run identity-platform configure-zitadel.sh}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?run identity-platform configure-zitadel.sh}"
    ports:
      - "127.0.0.1:19080:8080"
    volumes:
      - /opt/foundation-platform:/opt/foundation-platform:ro
      - ./orchestration/webserver_config.py:/opt/airflow/webserver_config.py:ro
    networks:
      - default
      - identity-shared
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1m0s
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully

  # The browser and the API server must name Zitadel by the same issuer, 127.0.0.1:18453 (root
  # ADR-0081); inside the API server's network namespace this forwards that port to Zitadel.
  airflow-zitadel-loopback:
    logging: *log-cap
    image: "alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e"
    mem_limit: 64m
    oom_score_adj: -900
    restart: unless-stopped
    network_mode: "service:airflow-apiserver"
    command:
      - "TCP-LISTEN:18453,fork,reuseaddr,bind=127.0.0.1"
      - "TCP:zitadel:18453"
    depends_on:
      airflow-apiserver:
        condition: service_started

  airflow-scheduler:
    logging: *log-cap
    image: foundation-platform-airflow:local
    pull_policy: never
    mem_limit: 1g
    restart: unless-stopped
    command: ["scheduler"]
    environment:
      <<: *airflow-environment
      # The host, its account `foundation-scheduler`, that account's private key and the host's
      # own key: the job tasks connect with this and nothing else (ADR-0122 §2).
      AIRFLOW_CONN_FOUNDATION_HOST: "${AIRFLOW_CONN_FOUNDATION_HOST:?run airflow-runtime.sh init-secrets}"
    extra_hosts:
      - "foundation-host:host-gateway"
    volumes:
      - /opt/foundation-platform:/opt/foundation-platform:ro
    networks:
      - default
      - metadata-shared
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully

  airflow-dag-processor:
    logging: *log-cap
    image: foundation-platform-airflow:local
    pull_policy: never
    mem_limit: 512m
    restart: unless-stopped
    command: ["dag-processor"]
    environment:
      <<: *airflow-environment
    volumes:
      - /opt/foundation-platform:/opt/foundation-platform:ro
    depends_on:
      airflow-migrate:
        condition: service_completed_successfully

  # Dagster observing this Airflow (root ADR-0333 stage 0, dagster-airlift's "observe"): it runs no
  # job. Off unless orchestration/jobs.v1.json `observers.dagster.enabled` is true; airflow-runtime.sh
  # then turns on the profile, makes the instance's database and role in airflow-db and its Airflow
  # Viewer account. The image holds the locked dependencies; the code location is the release's.
  # Caps: anonymous peaks measured 2026-10-29 against Airflow 3.3.2 with these definitions (webserver
  # 271 MiB; daemon 410 MiB while an asset-check run ran), with what the host budget leaves (root
  # ADR-0138): x1.12 and x1.17, less than the release build's x1.3 (root ADR-0137). Measure both on
  # the host after the profile turns on; a cap the kernel hits is the next budget decision.
  dagster-webserver:
    logging: *log-cap
    image: foundation-platform-dagster:local
    build:
      context: .
      dockerfile: orchestration/dagster/Dockerfile
    pull_policy: never
    profiles: ["dagster-observe"]
    # Anonymous memory, the part the kernel cannot reclaim, peaked at 271 MiB on 2026-10-29 (54 jobs
    # observed) and the cap was 304m. On 2026-11-13 (71 jobs, each with a run job and a dual-run check)
    # it stood at the cap: anon 298.6 MiB of 304, no swap, memory.events max 46 in the 36 minutes after a
    # start, so what it needs was not measurable under it. A proxied job's Airflow task launches and
    # polls its run here (root ADR-0431 §5), so the cap leaves room before the first job is proxied:
    # x1.5 of the capped reading, measured again after the first proxied family's first day.
    #
    # The only webserver that can change Dagster, and it answers only its two callers (root ADR-0565 §8):
    # Dagster OSS has no sign-in, so `writer_gate.py` (in the image) runs Dagster's own webserver behind
    # an allow-list per listener: on this project's network what a proxied job's `run` task sends, on
    # the unix socket in /run/foundation-dagster (0700, infra/tmpfiles/foundation-dagster-writer.conf)
    # what the deploy and an operator's run-now send (scripts/deploy/job_orchestrator.py). No host port:
    # staff and every reader use dagster-webserver-read-only, which the loopback port now publishes.
    mem_limit: 448m
    restart: unless-stopped
    command: ["python", "/opt/dagster/gate/writer_gate.py", "-h", "0.0.0.0", "-p", "3000",
              "-w", "/opt/dagster/home/workspace.yaml"]
    environment:
      <<: *dagster-environment
    volumes:
      - /opt/foundation-platform:/opt/foundation-platform:ro
      - dagster-state:/var/lib/dagster
      - /run/foundation-dagster:/run/foundation-dagster
    depends_on:
      airflow-apiserver:
        condition: service_healthy

  # The webserver every reader asks (root ADR-0565 §8): the same GraphQL and UI without a mutation
  # (`--read-only`, which also refuses the REST reports). foundation-api asks it for the runs and logs
  # of the jobs Dagster decides, on the identity network both join, as it reaches airflow-apiserver
  # (compose.orchestration-bridge.yml); the asset reconciler's metrics and staff (through the SSH tunnel)
  # on the host's loopback (jobs.v1.json observers.dagster.ui). It loads no code: the location is
  # dagster-code-server's. 182 MiB measured 2026-11-19 with a gRPC location (laptop, 1.13.27, with or
  # without --read-only), x1.5 as above; measured again on the host after the first deploy. Its 288m
  # come out of Trino's cap (compose.lakehouse.yml), which the Trino readers' moves leave idle.
  dagster-webserver-read-only:
    logging: *log-cap
    image: foundation-platform-dagster:local
    pull_policy: never
    profiles: ["dagster-observe"]
    mem_limit: 288m
    restart: unless-stopped
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/home/workspace.yaml",
              "--read-only"]
    environment:
      <<: *dagster-environment
    ports:
      - "127.0.0.1:19085:3000"
    volumes:
      - dagster-state:/var/lib/dagster
    networks:
      default: {}
      identity-shared: {}
    depends_on:
      dagster-code-server:
        condition: service_healthy

  # The code location's own server (root ADR-0565 §9; Dagster's documented Docker deployment runs the
  # code location as a gRPC server of its own). `dagster code-server start` loads the definitions in a
  # subprocess, so a release reloads them (airflow-runtime.sh: reloadRepositoryLocation) and this
  # container keeps running: a run is a process of this container (the default run launcher), and a run
  # launched before the reload finishes on its own code (measured on dagster 1.13.27, 2026-11-18: a
  # 40-second run started, the location reloaded mid-run, the run ended SUCCESS with the old code).
  # Before, every deploy restarted the daemon and killed every run in it; one asset-check run stayed
  # STARTED from 2026-11-14 03:12Z for four days. A change of this service's image or settings still
  # recreates it; run monitoring then fails the runs it held at their max runtime (dagster.yaml).
  # Its memory is every run's: a proxy (about 100 MiB), the code process (169 MiB measured 2026-11-09,
  # VmHWM; two while a reload swaps them) and up to dagster.yaml's 7 runs, each counted at the code
  # process's size: 100 + 2 x 169 + 7 x 169 = 1,621 MiB. Root ADR-0574's rule holds it too: 2026-11-20 the
  # container peaked at 1,109 MiB (cAdvisor, 13 h), x1.5 = 1,664 MiB; a run's process held 172-181 MiB
  # VmRSS, the gRPC code process 209 MiB. The host's caps add up to its 62g (every-container-has-a-memory-cap).
  # Measured again for the last group (root ADR-0583 §8): 2026-11-21 16:23Z to 11-23 01:10Z, with Gold and
  # Silver decided here, the container reached 1,576 MiB working set and hit its 1700m cap 135 times
  # (cAdvisor container_memory_events_max_total). The peak is held by the cap, so 1.5 x 1700m: 2550m.
  dagster-code-server:
    logging: *log-cap
    image: foundation-platform-dagster:local
    pull_policy: never
    profiles: ["dagster-observe"]
    mem_limit: 2550m
    restart: unless-stopped
    command: ["dagster", "code-server", "start", "-h", "0.0.0.0", "-p", "4000",
              "-f", "/opt/foundation-platform/current/orchestration/dagster/definitions.py",
              "-d", "/opt/foundation-platform/current/orchestration/dagster", "--location-name", "foundation"]
    environment:
      <<: *dagster-environment
      # A proxied job's run reaches the host as Airflow's `run` task did (run_jobs.py, root ADR-0417): the
      # scheduler's connection from runtime.env, whose key can only run the forced command, and only from
      # this project's network. Only this container holds it: runs are its processes.
      FOUNDATION_HOST_CONNECTION: "${AIRFLOW_CONN_FOUNDATION_HOST:?run airflow-runtime.sh init-secrets}"
      # A job Dagster decides reports its runs from its op, as its DAG did (lineage.py).
      FOUNDATION_OPENLINEAGE_TRANSPORT: *openlineage-transport
    extra_hosts:
      - "foundation-host:host-gateway"
    volumes:
      - /opt/foundation-platform:/opt/foundation-platform:ro
      - dagster-state:/var/lib/dagster
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "-p", "4000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 1m0s
    # The asset checks' runs read the lakehouse through Trino, on the compute project's network, and
    # the dual run pages through Alertmanager, on the runtime project's; a run reports to DataHub's GMS on
    # the shared metadata network. The host sees a job run come
    # from this project's network (`default`, the gateway every other route loses to): the scheduler's
    # key is accepted only from there (foundation-release.sh `timers`, authorized_keys `from=`).
    networks:
      default:
        gw_priority: 1
      lakehouse-compute: {}
      foundation-runtime: {}
      metadata-shared: {}
    depends_on:
      airflow-apiserver:
        condition: service_healthy

  dagster-daemon:
    logging: *log-cap
    image: foundation-platform-dagster:local
    pull_policy: never
    profiles: ["dagster-observe"]
    # The daemon alone: it reads the code location from dagster-code-server and launches runs there,
    # so neither the code nor any run is its process any more. Root ADR-0574 rule, measured max x 1.5:
    # 2026-11-19, the container of this shape (since 02:11Z) reached 379 MiB working set of its 384m cap
    # (cAdvisor max_over_time; memory.peak = the cap, memory.events max 329, oom_kill 0; anon 235 MiB,
    # page cache 56 MiB). The peak is held down by the cap, so 1.5 x 384m is the floor, not a guess
    # upward: 576m. Measured again before each group moves to Dagster (root ADR-0583 §8).
    mem_limit: 576m
    restart: unless-stopped
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/home/workspace.yaml"]
    environment:
      <<: *dagster-environment
    volumes:
      - dagster-state:/var/lib/dagster
    networks:
      default: {}
    depends_on:
      dagster-code-server:
        condition: service_healthy

volumes:
  airflow-db:
  dagster-state:

networks:
  identity-shared:
    external: true
  metadata-shared:
    external: true
  # compose.lakehouse.yml's project default network, where Trino answers as `trino`.
  lakehouse-compute:
    external: true
    name: foundation-platform-compute_default
  # docker-compose.yml's project default network, where Alertmanager answers as `alertmanager`.
  foundation-runtime:
    external: true
    name: foundation-platform-runtime_default
