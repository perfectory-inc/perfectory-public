# the host names the uid that writes the operator switches (root ADR-0282 §3,
# orchestration/jobs.v1.json state_directories). No login, no home.
g foundation-api 10001
u foundation-api 10001:10001 "foundation-api container (docker-compose.yml)" / /usr/sbin/nologin
