name: Foundation Platform CI

on:
  # A history-free public-root push has no comparable parent for path filters;
  # keep an explicit, auditable way to run this required context on that root.
  workflow_dispatch:
  # Pull requests are intentionally unfiltered. A path-filtered workflow can
  # leave its required check pending forever when GitHub skips the workflow.
  pull_request:
    branches: [main]
  merge_group:
  # A pull request verifies only the crates it reaches (root ADR-0269); every night
  # main verifies every crate, as the merge queue does.
  schedule:
    - cron: "41 17 * * *"
  # A push to main the merge queue already passed on the same tree does nothing (root ADR-0313).
  push:
    branches:
      - main
permissions:
  contents: read

defaults:
  run:
    working-directory: platforms/foundation-platform

concurrency:
  group: foundation-platform-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # sccache's shared Rust compiler cache on R2 (root ADR-0294 §A). All three are repo secrets so a
  # same-repo branch's Rust jobs read and write the cache while a fork pull request gets none and
  # builds without it. The endpoint is a secret too — not because it is a key (it names the bucket's
  # account), but because public-repository-safety.sh forbids an account-specific R2 binding in the
  # clear. check-workflow-policy.sh admits exactly these three names here.
  SCCACHE_R2_ENDPOINT: ${{ secrets.SCCACHE_R2_ENDPOINT }}
  AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}

jobs:
  # Root ADR-0202: whether this workflow's area changed (tools/ci/change-scope.json). An untouched
  # area skips every job below and required/foundation still reports success. On a push to main
  # the token reads whether the merge queue already passed this tree (root ADR-0313).
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.select.outputs.affected }}
      skipped: ${{ steps.jobs.outputs.skipped }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Select
        id: select
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: python3 scripts/ci/change_scope.py select --workflow foundation-ci.yml
      # Root ADR-0324: a job with no work never takes a runner. Every job waited 20-250 s for one
      # (#907), and the jobs that only found they had nothing to do were a third of the queue.
      # The selectors' own tests run here, where the selection is made.
      - name: Select the jobs that have work
        id: jobs
        working-directory: .
        env:
          AFFECTED: ${{ steps.select.outputs.affected }}
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: |
          set -euo pipefail
          if [ "$AFFECTED" = true ]; then
            python3 scripts/ci/test_foundation_ci_scope.py
            python3 scripts/ci/test_foundation_postgres_production_shape.py
          fi
          python3 scripts/ci/foundation_ci_scope.py --skipped-jobs --affected "$AFFECTED" \
            --event-name "$CHANGE_SCOPE_EVENT" --base "$CHANGE_SCOPE_BASE" --head "$CHANGE_SCOPE_HEAD" \
            --github-output "$GITHUB_OUTPUT"

  rust-quality:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' && !contains(fromJSON(needs.scope.outputs.skipped), 'rust-quality') }}
    name: Rust fmt, unit tests, clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Restore pinned release binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}
          restore-keys: pinned-release-binaries-v1-${{ runner.os }}-

      - name: Set up Rust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          workspaces: |
            platforms/foundation-platform
            tools/xtask
          # The entries saved before ADR-0210 hold no dependency builds (the stash took
          # them) and a key is never overwritten, so this cache starts under a new name.
          shared-key: rust-quality-dependencies
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # sccache shares the compiler cache on R2 (root ADR-0294). Its own step after rust-setup and the
      # rust-cache key read, so rust-setup stays a non-fetcher and sccache's env does not change the
      # cache key. Only jobs that run this step reach the pinned downloader; this job restores the
      # pinned cache above, which check-pinned-downloads.py requires of a fetcher's job.
      - name: Set up sccache
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/sccache-setup.sh
      # Workspace crates keep file:line backtraces but not full debug info: a cold build of the
      # workspace measured 4m10s -> 3m04s. Dependencies keep their `debug = 1` override, and this
      # is set after rust-cache read its key, so that key and its contents do not change. The
      # stash of main's workspace crates that stood here (ADR-0201) is retired: measured
      # 2026-10-18, restoring it cost about what it saved, and its 3-5 GB pushed the dependency
      # cache the merge queue reads out of the 10 GB limit (root ADR-0269).
      - name: Workspace crates keep line tables only
        run: echo "CARGO_PROFILE_DEV_DEBUG=line-tables-only" >>"$GITHUB_ENV"

      # Node only for the repository guard's `node` checks. The pnpm suites run in
      # `suites` (root ADR-0199), so this job creates no pnpm store: a pnpm cache
      # here failed main's post step ("Path(s) ... do(es) not exist") whenever a
      # gateway lockfile changed and the cache key was new.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (SHA pin, ADR 0028)
        with:
          node-version: "24.20.0"

      # Foundation-specific: the committed Catalog OpenAPI artifact must match a
      # fresh export (this builds+runs export-catalog-openapi, which compiles what
      # it needs — the standalone build step is redundant with xtask clippy below).
      # Only when foundation-api is among the crates verified (root ADR-0313): the export compiles it,
      # and a pull request that reaches no crate compiled it anyway.
      - name: Verify generated Catalog OpenAPI artifact
        shell: bash
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: |
          set -euo pipefail
          selected=0
          python3 ../../scripts/ci/change_scope.py crates --workspace platforms/foundation-platform \
            --includes foundation-api || selected=$?
          if [ "$selected" -eq 3 ]; then
            exit 0
          fi
          [ "$selected" -eq 0 ] || exit "$selected"
          cargo run --locked --quiet -p foundation-api --bin export-catalog-openapi -- /tmp/catalog.v1.json
          cmp docs/openapi/catalog.v1.json /tmp/catalog.v1.json

      # Single verification SSOT (ADR-0004): xtask owns fmt+clippy+test with the
      # one flag policy. Runs from the repo root (this job defaults to the area).
      # The cargo half; the Python and Node half runs on its own runner in `suites`
      # below (root ADR-0199). xtask's tests refuse a workflow that runs one half
      # of an area without the other.
      - name: Verify (fmt, clippy, test)
        working-directory: ${{ github.workspace }}
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: cargo xtask verify foundation --part cargo --affected

      # On a pull request only when the publisher is among the crates it verifies (root
      # ADR-0269): verify no longer builds the publisher otherwise, and compiling it here ran
      # past the 300 s limit below (#673). Every other event still runs it; a change to the
      # installer alone is the Windows job's gate on pull requests.
      - name: Verify exact static-release executable toolchain
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: |
          set -euo pipefail
          selected=0
          python3 scripts/ci/change_scope.py crates --workspace platforms/foundation-platform \
            --includes foundation-outbox-publisher || selected=$?
          if [ "$selected" -eq 3 ]; then
            exit 0
          fi
          [ "$selected" -eq 0 ] || exit "$selected"
          tool_directory="$RUNNER_TEMP/static-release-toolchain"
          python3 scripts/tiles/static_release_toolchain_contract.py install \
            --destination "$tool_directory" --platform linux-x86_64 --timeout-seconds 30
          export PATH="$tool_directory:$PATH"
          cd platforms/foundation-platform
          timeout --foreground 300s cargo run --locked -p foundation-outbox-publisher -- \
            verify-static-release-toolchain


  suites:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' && !contains(fromJSON(needs.scope.outputs.skipped), 'suites') }}
    name: Python and Node suites
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Restore pinned release binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}
          restore-keys: pinned-release-binaries-v1-${{ runner.os }}-

      - name: Set up Rust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          workspaces: |
            tools/xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Root ADR-0269: a pull request that reaches no suite skips them, and then nothing creates a
      # pnpm store, so setup-node's post step would fail to save one ("Path Validation Error", #683).
      # pnpm and Node with their cache are set up only when the suites run; an empty store is never
      # saved under the lockfile's key. The verify step below asks the same selector and says why.
      - name: Select the suites
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: |
          set -euo pipefail
          answer="$(python3 scripts/ci/change_scope.py suites --workspace platforms/foundation-platform)"
          echo "$answer"
          # pnpm and Node are needed only when a Node package runs: every suite (`all`), or a
          # selection that names one (`node` lines).
          case "${answer%%[[:space:]]*}" in
            all) echo "FOUNDATION_CI_GATE_SELECTED=true" >>"$GITHUB_ENV" ;;
            some)
              if grep -q '^node[[:space:]]' <<<"$answer"; then
                echo "FOUNDATION_CI_GATE_SELECTED=true" >>"$GITHUB_ENV"
              else
                echo "FOUNDATION_CI_GATE_SELECTED=false" >>"$GITHUB_ENV"
              fi
              ;;
            *) echo "unreadable suite selection: $answer" >&2; exit 1 ;;
          esac

      - name: Set up pnpm
        if: ${{ env.FOUNDATION_CI_GATE_SELECTED == 'true' }}
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8 (SHA pin, ADR 0028)
        with:
          version: 9.12.0

      - name: Set up Node
        if: ${{ env.FOUNDATION_CI_GATE_SELECTED == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0 (SHA pin, ADR 0028)
        with:
          node-version: "24.20.0"
      # setup-node's own pnpm cache saves on every ref, so each merge-queue branch kept a copy
      # no later run can read (root ADR-0269). The store is restored everywhere and saved from
      # main only, under the same node-cache- key.
      - name: Locate pnpm store
        if: ${{ env.FOUNDATION_CI_GATE_SELECTED == 'true' }}
        id: pnpm-store
        shell: bash
        run: echo "dir=$(pnpm store path --silent)" >>"$GITHUB_OUTPUT"
      - name: Restore pnpm store
        if: ${{ env.FOUNDATION_CI_GATE_SELECTED == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 (SHA pin, ADR 0028)
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: node-cache-foundation-${{ runner.os }}-pnpm-${{ hashFiles('platforms/foundation-platform/services/*-gateway/pnpm-lock.yaml') }}
          restore-keys: node-cache-foundation-${{ runner.os }}-pnpm-

      # The Python and Node half of `verify foundation` (root ADR-0199): the same suites,
      # declared in xtask, on a runner that does not share its CPU with cargo.
      - name: Verify (Python and Node suites)
        working-directory: ${{ github.workspace }}
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: cargo xtask verify foundation --part suites --affected
      - name: Save pnpm store
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 (SHA pin, ADR 0028)
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: node-cache-foundation-${{ runner.os }}-pnpm-${{ hashFiles('platforms/foundation-platform/services/*-gateway/pnpm-lock.yaml') }}

  static-release-toolchain-windows:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' && !contains(fromJSON(needs.scope.outputs.skipped), 'static-release-toolchain-windows') }}
    name: Static-release executable toolchain (Windows)
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore pinned release binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}
          restore-keys: pinned-release-binaries-v1-${{ runner.os }}-
      # main fills and saves the Windows cache of pinned release binaries this job restores
      # (root ADR-0197; the Linux cache is filled by the repository guard). A key that already
      # exists is left alone (the save warns and succeeds), so this writes once per pin set.
      - name: Fill pinned release binaries
        if: github.event_name == 'push' || github.event_name == 'schedule'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: python scripts/ci/fetch_pinned.py prefetch --prune
      - name: Save pinned release binaries
        if: github.event_name == 'push' || github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}-${{ hashFiles('tools/pinned-artifacts.json', 'tools/*.env', 'platforms/foundation-platform/config/static-release-toolchain.contract.json') }}

      - name: Select Windows static-release toolchain gate
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          FOUNDATION_CI_EVENT_NAME: ${{ github.event_name }}
          FOUNDATION_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          FOUNDATION_CI_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
          FOUNDATION_CI_REPOSITORY: ${{ github.workspace }}
        run: |
          python scripts/ci/foundation_ci_scope.py `
            --gate static-release-toolchain-windows `
            --event-name $env:FOUNDATION_CI_EVENT_NAME `
            --base $env:FOUNDATION_CI_BASE `
            --head $env:FOUNDATION_CI_HEAD `
            --repository $env:FOUNDATION_CI_REPOSITORY `
            --github-env $env:GITHUB_ENV

      - name: Set up Rust
        if: ${{ env.FOUNDATION_CI_GATE_SELECTED == 'true' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      - name: Rust cache
        if: ${{ env.FOUNDATION_CI_GATE_SELECTED == 'true' }}
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          workspaces: |
            platforms/foundation-platform
            tools/xtask
          # Saves nothing (root ADR-0269): this gate runs only when its toolchain inputs change, and
          # its 1.5 GB Windows entry, refreshed by every main build that selected it, pushed the
          # Linux dependency caches the merge queue reads out of the 10 GB limit.
          save-if: false

      - name: Verify exact static-release executable toolchain
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          if ($env:FOUNDATION_CI_GATE_SELECTED -ne "true") {
            Write-Host "Static-release Windows toolchain is unaffected; gate succeeds without verification."
            exit 0
          }
          $toolDirectory = Join-Path $env:RUNNER_TEMP "static-release-toolchain"
          python scripts/tiles/static_release_toolchain_contract.py install `
            --destination $toolDirectory --platform windows-x86_64 --timeout-seconds 30
          $env:PATH = "$toolDirectory$([IO.Path]::PathSeparator)$env:PATH"
          Set-Location platforms/foundation-platform
          cargo run --locked -p foundation-outbox-publisher -- verify-static-release-toolchain

  supply-chain:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' && !contains(fromJSON(needs.scope.outputs.skipped), 'supply-chain') }}
    name: Supply-chain release gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false
      - name: Restore pinned release binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/perfectory/pinned
          key: pinned-release-binaries-v1-${{ runner.os }}
          restore-keys: pinned-release-binaries-v1-${{ runner.os }}-

      - name: Set up Rust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          # Reads the dependency cache rust-quality saves (root ADR-0269).
          workspaces: |
            platforms/foundation-platform
            tools/xtask
          shared-key: rust-quality-dependencies
          save-if: false
      - name: Install cargo-deny
        working-directory: ${{ github.workspace }}
        run: cargo xtask ci install-cargo-deny

      - name: Install SBOM tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if ! command -v syft >/dev/null 2>&1; then
            # The pin lives in tools/syft.env; the one pinned fetcher downloads, verifies and
            # caches it (root ADR-0197).
            archive="$RUNNER_TEMP/syft.tar.gz"
            python3 "$GITHUB_WORKSPACE/scripts/ci/fetch_pinned.py" tool syft --output "$archive"
            tar xzf "$archive" -C "$HOME/.local/bin" syft
          fi

      - name: Run supply-chain tools (cargo-deny, SBOM)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/supply-chain-tools
          cargo-deny check --hide-inclusion-graph
          source_version="${GITHUB_SHA:-$(git rev-parse --verify HEAD)}"
          syft "dir:." --exclude='./.git/**' --exclude='./target/**' --source-name=foundation-platform --source-version="$source_version" --output=cyclonedx-json=target/supply-chain-tools/cyclonedx-bom.json

      - name: Upload supply-chain artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 (SHA pin, ADR 0028)
        with:
          name: supply-chain-reports
          # path: is relative to $GITHUB_WORKSPACE — defaults.run.working-directory does NOT apply to uses: steps
          path: |
            platforms/foundation-platform/target/supply-chain-tools/cyclonedx-bom.json
          if-no-files-found: warn

  postgres-integration:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' && !contains(fromJSON(needs.scope.outputs.skipped), 'postgres-integration') }}
    name: Postgres integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine@sha256:fe9821935d163abca5611e3e0a6a7c73c8c547f3412ed2036ec0ed8f789390da
        ports:
          - 5432/tcp
        env:
          POSTGRES_USER: foundation_platform
          POSTGRES_PASSWORD: foundation_platform_dev_2026
          POSTGRES_DB: foundation_platform
        options: >-
          --health-cmd "pg_isready -U foundation_platform -d foundation_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Set dynamic database URL
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: echo "DATABASE_URL=postgres://foundation_platform:foundation_platform_dev_2026@localhost:${POSTGRES_PORT}/foundation_platform" >> "$GITHUB_ENV"

      - name: Set up Rust
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      # Root ADR-0313: a change that reaches no crate needs no database, no apt and no compile. On
      # #870 (one ADR) this job spent 4m07s on apt-get and 18 s on a migration build for 0 tests.
      - name: Select crates
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: |
          set -euo pipefail
          answer="$(python3 scripts/ci/change_scope.py crates --workspace platforms/foundation-platform)"
          echo "$answer"
          if [ "${answer%%[[:space:]]*}" = all ] || grep -q '^affected[[:space:]]' <<<"$answer"; then
            echo "FOUNDATION_CI_GATE_SELECTED=true" >>"$GITHUB_ENV"
          else
            echo "FOUNDATION_CI_GATE_SELECTED=false" >>"$GITHUB_ENV"
          fi
      - name: Rust cache
        if: ${{ env.FOUNDATION_CI_GATE_SELECTED == 'true' }}
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          workspaces: |
            platforms/foundation-platform
            tools/xtask
          # Reads the Rust job's dependency cache and saves none of its own (root ADR-0269): with
          # the workspace-hack both jobs build the same dependency features, and a second 2–3.4 GB
          # entry pushed that cache out of the 10 GB limit, so merge-queue runs rebuilt every crate.
          shared-key: rust-quality-dependencies
          save-if: false

      - name: Install database client
        shell: bash
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "No Foundation crate is verified; the database client is not needed."
            exit 0
          fi
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1 && sudo -n true; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends postgresql-client
            else
              echo "::error::postgresql-client is missing and the GitHub-hosted runner does not provide passwordless sudo"
              exit 1
            fi
          fi
          psql --version

      # Root ADR-0259 §8: a change's new migrations run onto main's schema holding a synthetic row
      # in every table production holds rows in, not only onto the empty database below.
      - name: Apply new migrations onto production-shaped rows
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          SHAPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "No Foundation crate is verified; no migration runs."
            exit 0
          fi
          cargo xtask ci postgres-production-shape "$DATABASE_URL" "$SHAPE_BASE"

      - name: Run migrations through the production runner
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "No Foundation crate is verified; the migration runner is not built."
            exit 0
          fi
          FOUNDATION_MIGRATOR_DATABASE_URL="$DATABASE_URL" cargo run --locked --quiet -p foundation-api --bin foundation-migrate

      - name: Seed local vector tile manifest
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "No Foundation crate is verified; nothing is seeded."
            exit 0
          fi
          psql "$DATABASE_URL" -f infra/db/seeds/local_vector_tile_manifest.sql

      # The integration test COMMAND is the single SSOT in xtask (ADR-0004), the
      # same one `scripts/verify/integration.sh foundation` runs locally against a
      # disposable DB. DATABASE_URL (set above) is the already-provisioned database.
      - name: Run ignored integration tests (xtask SSOT)
        working-directory: ${{ github.workspace }}
        env:
          FOUNDATION_PLATFORM_RUNTIME_ENV: ci
          FOUNDATION_PLATFORM_EXECUTION_CONTEXT: ci
          CHANGE_SCOPE_EVENT: ${{ github.event_name }}
          CHANGE_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CHANGE_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "No Foundation crate is verified; no integration test runs."
            exit 0
          fi
          cargo xtask integration foundation --affected

  kafka-integration:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' && !contains(fromJSON(needs.scope.outputs.skipped), 'kafka-integration') }}
    name: Kafka and Schema Registry integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      FOUNDATION_KAFKA_COMPOSE_PROJECT: foundation-kafka-ci-${{ github.run_id }}
      FOUNDATION_TEST_KAFKA_REQUIRED: "1"
      INTELLIGENCE_TEST_KAFKA_HOST_PORT: 19092
      INTELLIGENCE_TEST_KARAPACE_HOST_PORT: 18081

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select Kafka integration gate
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          FOUNDATION_CI_EVENT_NAME: ${{ github.event_name }}
          FOUNDATION_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          FOUNDATION_CI_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
          FOUNDATION_CI_REPOSITORY: ${{ github.workspace }}
        run: |
          python3 scripts/ci/foundation_ci_scope.py \
            --gate kafka-integration \
            --event-name "$FOUNDATION_CI_EVENT_NAME" \
            --base "$FOUNDATION_CI_BASE" \
            --head "$FOUNDATION_CI_HEAD" \
            --repository "$FOUNDATION_CI_REPOSITORY" \
            --github-env "$GITHUB_ENV"

      - name: Start Postgres service
        shell: bash
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Kafka contracts are unaffected; Postgres is not started."
            exit 0
          fi
          set -euo pipefail
          docker run -d --rm --name foundation-kafka-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_USER=foundation_platform \
            --env POSTGRES_PASSWORD=foundation_platform_dev_2026 \
            --env POSTGRES_DB=foundation_platform \
            --health-cmd "pg_isready -U foundation_platform -d foundation_platform" \
            --health-interval 5s --health-timeout 5s --health-retries 10 \
            postgis/postgis:17-3.5-alpine@sha256:fe9821935d163abca5611e3e0a6a7c73c8c547f3412ed2036ec0ed8f789390da
          for _ in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' foundation-kafka-postgres)" = healthy ]; then
              echo "DATABASE_URL=postgres://foundation_platform:foundation_platform_dev_2026@localhost:5432/foundation_platform" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Kafka integration Postgres did not become healthy"
          exit 1

      - name: Set up Rust
        if: ${{ env.FOUNDATION_CI_GATE_SELECTED == 'true' }}
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/ci/rust-setup.sh
      - name: Rust cache
        if: ${{ env.FOUNDATION_CI_GATE_SELECTED == 'true' }}
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1 (SHA pin, ADR 0028)
        with:
          # Reads the dependency cache rust-quality saves (root ADR-0269).
          workspaces: |
            platforms/foundation-platform
            tools/xtask
          shared-key: rust-quality-dependencies
          save-if: false

      - name: Install database client
        shell: bash
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Kafka contracts are unaffected; database client installation is not needed."
            exit 0
          fi
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Install Kafka Rust native build dependencies
        shell: bash
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Kafka contracts are unaffected; native dependency installation is not needed."
            exit 0
          fi
          set -euo pipefail
          # Keep this host-side live gate on the same complete native header set
          # declared by tools/xtask for Foundation's --all-features build.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libssl-dev libsasl2-dev libcurl4-openssl-dev zlib1g-dev

      - name: Run migrations through the production runner
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Kafka contracts are unaffected; migrations are not needed."
            exit 0
          fi
          FOUNDATION_MIGRATOR_DATABASE_URL="$DATABASE_URL" cargo run --locked --quiet -p foundation-api --bin foundation-migrate

      - name: Run real Kafka/Schema Registry live gate
        working-directory: ${{ github.workspace }}
        env:
          FOUNDATION_PLATFORM_RUNTIME_ENV: ci
          FOUNDATION_PLATFORM_EXECUTION_CONTEXT: ci
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Kafka contracts are unaffected; live gate succeeds without starting Kafka."
            exit 0
          fi
          cargo xtask live kafka

      - name: Clean Kafka compose resources
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Kafka contracts are unaffected; no containers require cleanup."
            exit 0
          fi
          cleanup_status=0
          timeout --foreground 120s docker compose -p "$FOUNDATION_KAFKA_COMPOSE_PROJECT" -f platforms/intelligence-platform/docker/c2-event-backbone.compose.yml down -v --remove-orphans || cleanup_status=$?
          # 컨테이너가 이미 없을 수 있다. 존재할 때만 지우므로 실패를 삼킬 필요가 없다
          # (`|| true` 는 진짜 실패도 함께 감춘다).
          if [ -n "$(docker ps -aq -f name=^foundation-kafka-postgres$)" ]; then
            docker rm -f foundation-kafka-postgres >/dev/null
          fi
          exit "$cleanup_status"

  compose-smoke:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' && !contains(fromJSON(needs.scope.outputs.skipped), 'compose-smoke') }}
    name: Independent Foundation Compose smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOUNDATION_ADMIN_PASSWORD: compose_admin_ci
      FOUNDATION_MIGRATOR_PASSWORD: compose_migrator_ci
      FOUNDATION_API_PASSWORD: compose_api_ci
      FOUNDATION_DB_PORT: 15434
      FOUNDATION_API_PORT: 18080
      FOUNDATION_REDIS_PORT: 16379
      FOUNDATION_PLATFORM_RUNTIME_ENV: ci
      FOUNDATION_PLATFORM_EXECUTION_CONTEXT: ci
      FOUNDATION_PLATFORM_OBJECT_STORAGE_DRIVER: log
      IDENTITY_API_BASE_URL: https://identity.example.test
      ZITADEL_ISSUER_URL: http://127.0.0.1:18081
      FOUNDATION_PLATFORM_ZITADEL_AUDIENCE: foundation-api

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select Compose smoke gate
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          FOUNDATION_CI_EVENT_NAME: ${{ github.event_name }}
          FOUNDATION_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          FOUNDATION_CI_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
          FOUNDATION_CI_REPOSITORY: ${{ github.workspace }}
        run: |
          python3 scripts/ci/foundation_ci_scope.py \
            --gate compose-smoke \
            --event-name "$FOUNDATION_CI_EVENT_NAME" \
            --base "$FOUNDATION_CI_BASE" \
            --head "$FOUNDATION_CI_HEAD" \
            --repository "$FOUNDATION_CI_REPOSITORY" \
            --github-env "$GITHUB_ENV"

      - name: Build and start clean Compose stack
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Foundation Compose inputs are unaffected; stack startup is not needed."
            exit 0
          fi
          scripts/compose-smoke.sh -- start-api

      - name: Wait for Foundation API readiness
        shell: bash
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Foundation Compose inputs are unaffected; readiness is already satisfied."
            exit 0
          fi
          set -euo pipefail
          container_id="$(timeout --foreground 10s docker compose --profile compose-smoke ps -q foundation-api-smoke)"
          test -n "$container_id"
          test "$(timeout --foreground 10s docker inspect --format '{{.State.Health.Status}}' "$container_id")" = healthy

      - name: Verify one-shot helper UIDs
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Foundation Compose inputs are unaffected; UID verification is not needed."
            exit 0
          fi
          scripts/compose-smoke.sh -- verify-uids

      - name: Re-run migration chain on the same volume
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Foundation Compose inputs are unaffected; migration replay is not needed."
            exit 0
          fi
          scripts/compose-smoke.sh -- rerun-api

      - name: Verify migration and least-privilege runtime contract
        shell: bash
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Foundation Compose inputs are unaffected; runtime contract is already satisfied."
            exit 0
          fi
          set -euo pipefail
          contract="$(docker compose exec -T postgres psql -X -A -t -v ON_ERROR_STOP=1 -U foundation_admin -d foundation -c "
            SELECT
              NOT EXISTS (
                SELECT 1 FROM pg_catalog.pg_roles
                WHERE rolname IN ('foundation_migrator','foundation_api')
                  AND (rolsuper OR rolcreatedb OR rolcreaterole OR rolinherit OR rolreplication OR rolbypassrls)
              )
              AND has_schema_privilege('foundation_api', 'catalog', 'USAGE')
              AND NOT has_schema_privilege('foundation_api', 'catalog', 'CREATE')
              AND has_table_privilege('foundation_api', 'catalog.industrial_complex', 'SELECT,INSERT,UPDATE,DELETE')
              AND NOT EXISTS (
                SELECT 1 FROM public._sqlx_migrations
                WHERE NOT success
              );")"
          test "$contract" = "t"
          ! docker compose exec -T foundation-api env | grep -E 'FOUNDATION_(ADMIN|MIGRATOR)_PASSWORD|foundation_(admin|migrator)'

      - name: Clean Compose resources
        if: always()
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Foundation Compose inputs are unaffected; no containers require cleanup."
            exit 0
          fi
          timeout --foreground 120s docker compose down -v --remove-orphans

  boundary-slice:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' && !contains(fromJSON(needs.scope.outputs.skipped), 'boundary-slice') }}
    name: Boundary vertical slice
    runs-on: ubuntu-24.04
    # The slice compiles the publisher from source inside a pinned container before it can publish,
    # so its budget is closer to compose-smoke's than to a test job's.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select boundary slice gate
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          FOUNDATION_CI_EVENT_NAME: ${{ github.event_name }}
          FOUNDATION_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          FOUNDATION_CI_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
          FOUNDATION_CI_REPOSITORY: ${{ github.workspace }}
        run: |
          python3 scripts/ci/foundation_ci_scope.py \
            --gate boundary-slice \
            --event-name "$FOUNDATION_CI_EVENT_NAME" \
            --base "$FOUNDATION_CI_BASE" \
            --head "$FOUNDATION_CI_HEAD" \
            --repository "$FOUNDATION_CI_REPOSITORY" \
            --github-env "$GITHUB_ENV"

      # The only path that carries a publication unit from a source snapshot all the way to a
      # decoded tile: PostGIS projection load, CAS runtime-manifest promotion, Martin serving the
      # release the pointer names, and an MVT decoder asserting the layer and its properties. Every
      # step of it was already covered by some test; that a step's output is the next step's input
      # was not, and no amount of per-step testing can show it. It provisions its own Postgres and
      # Martin from digest-pinned images and needs no credentials, so it runs here unchanged rather
      # than as a second copy shaped for CI.
      #
      # It covers `admin` and `complex` in one run, sharing the containers rather than paying for a
      # second job's images and compile. For `complex` it also proves the negative: the layer is
      # empty in a tile Martin cuts from a written-but-unpromoted load, and populated in the same
      # tile after the promotion.
      #
      # It is slower than its work: the stock `rust` image does not carry the components
      # `rust-toolchain.toml` asks for, so rustup fetches four of them at run time — the same hidden
      # download that was moved into the verification image. Baking a slice image would remove it,
      # and that is a separate change: this job's images are digest-pinned public ones, while the
      # verification image is built locally and CI has no copy.
      - name: Prove the boundary serving path end to end
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Boundary slice not selected for this event (inputs unaffected, or a pull request: the merge queue runs it); see the selector output above."
            exit 0
          fi
          bash scripts/tiles/boundary-slice-proof.sh

  spark-runtime:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' && !contains(fromJSON(needs.scope.outputs.skipped), 'spark-runtime') }}
    name: Spark and Iceberg runtime tests
    runs-on: ubuntu-24.04
    # Pulls the pinned Spark image and the Iceberg runtime jars, then starts a JVM per test file,
    # one file per two CPUs at a time. The log ends with every file's duration, slowest first.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the Spark runtime file runner
        working-directory: ${{ github.workspace }}
        run: python3 scripts/ci/test_foundation_spark_runtime_files.py -v
      - name: Select Spark runtime gate
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          FOUNDATION_CI_EVENT_NAME: ${{ github.event_name }}
          FOUNDATION_CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          FOUNDATION_CI_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.event.after || github.sha }}
          FOUNDATION_CI_REPOSITORY: ${{ github.workspace }}
        run: |
          python3 scripts/ci/foundation_ci_scope.py             --gate spark-runtime             --event-name "$FOUNDATION_CI_EVENT_NAME"             --base "$FOUNDATION_CI_BASE"             --head "$FOUNDATION_CI_HEAD"             --repository "$FOUNDATION_CI_REPOSITORY"             --github-env "$GITHUB_ENV"

      # The Spark tests in infra/lakehouse/spark/tests skip on the default runner, which has no
      # PySpark: the Iceberg commit and snapshot-pin tests among them (root ADR-0139). Here they run
      # in the compose `spark` image with the engine contract's Iceberg runtime, and a test that
      # still skips for want of it fails the job.
      - name: Run the Spark and Iceberg tests in the pinned runtime
        working-directory: ${{ github.workspace }}
        run: |
          if [ "${FOUNDATION_CI_GATE_SELECTED:-false}" != true ]; then
            echo "Spark job inputs are unaffected; the Spark runtime tests succeed without containers."
            exit 0
          fi
          bash scripts/verify/foundation-spark-runtime.sh

  # Root ADR-0345: the release build of .github/workflows/foundation-release-build.yml, built here as
  # a dry run: every image, the executable and the jars from the same script, read from main's build
  # cache, and nothing attested, pushed or uploaded (this job holds no write permission). It runs when
  # merging would give main a release build (foundation_ci_scope.py RELEASE_JOB). 2026-10-29: #939
  # compiled in a file the publisher image did not copy; every pull request passed, every release
  # build on main failed, and the host deployed nothing for 11 hours.
  release-image:
    needs: [scope]
    if: ${{ needs.scope.outputs.affected == 'true' && !contains(fromJSON(needs.scope.outputs.skipped), 'release-image') }}
    name: Release build dry run (no attestation, no push)
    runs-on: ubuntu-24.04
    # The release builds on main, 2026-10-18 to 10-29: p50 15 min, p99 60 min, longest 62 (140 runs).
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (SHA pin, ADR 0028)
        with:
          persist-credentials: false
      - name: Room for the build
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/release-build-runner-room.sh
      - name: Build the release, attest and publish nothing
        working-directory: ${{ github.workspace }}
        run: python3 scripts/deploy/foundation-release-build.py --out "$RUNNER_TEMP/release" --cache-ref "ghcr.io/$GITHUB_REPOSITORY_OWNER/foundation-release" --cache-read-only

  required:
    name: required/foundation
    if: ${{ always() && (needs.scope.result != 'success' || needs.scope.outputs.affected == 'true') }}
    needs: [scope, rust-quality, suites, static-release-toolchain-windows, supply-chain, postgres-integration, kafka-integration, compose-smoke, boundary-slice, spark-runtime, release-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require every Foundation gate
        env:
          CHANGE_SCOPE_RUN: ${{ needs.scope.outputs.affected }}
          CHANGE_SCOPE_SKIPPED: ${{ needs.scope.outputs.skipped }}
          REQUIRED_RESULT_SCOPE: ${{ needs.scope.result }}
          REQUIRED_RESULT_RUST_QUALITY: ${{ needs.rust-quality.result }}
          REQUIRED_RESULT_SUITES: ${{ needs.suites.result }}
          REQUIRED_RESULT_STATIC_RELEASE_TOOLCHAIN_WINDOWS: ${{ needs.static-release-toolchain-windows.result }}
          REQUIRED_RESULT_SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          REQUIRED_RESULT_POSTGRES_INTEGRATION: ${{ needs.postgres-integration.result }}
          REQUIRED_RESULT_KAFKA_INTEGRATION: ${{ needs.kafka-integration.result }}
          REQUIRED_RESULT_COMPOSE_SMOKE: ${{ needs.compose-smoke.result }}
          REQUIRED_RESULT_BOUNDARY_SLICE: ${{ needs.boundary-slice.result }}
          REQUIRED_RESULT_SPARK_RUNTIME: ${{ needs.spark-runtime.result }}
          REQUIRED_RESULT_RELEASE_IMAGE: ${{ needs.release-image.result }}
        working-directory: .
        run: bash scripts/ci/require-successful-needs.sh
