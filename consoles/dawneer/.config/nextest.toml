# cargo-nextest settings for the Dawneer workspace (`cargo xtask verify dawneer` runs its Rust tests
# under nextest, root ADR-0205).

# The profile CI runs (`NEXTEST_PROFILE=ci`, set by scripts/ci/rust-setup.sh; root ADR-0269), as
# oxidecomputer/omicron's: a failing test runs twice more so a flake is named FLAKY in the log, and
# it still fails the run. It inherits everything above.
[profile.ci]
retries = 2
flaky-result = "fail"
failure-output = "immediate-final"
