route:
  receiver: prelaunch-audit
  group_by:
    - alertname
    - service
    - environment
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # The operations map's problems (root ADR-0195): one notice per job and kind when it starts
    # and one when it resolves, never a reminder while it stays the same. The notification log
    # keeps what was sent for --data.retention (120h), so a problem still open after five days is
    # announced once more; nothing else repeats it.
    - matchers:
        - service = "data-flow"
      group_by:
        - alertname
        - job_id
        - kind
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 8760h
    # The repository's open security advisories (root ADR-0278): one notice per advisory when it
    # opens and one when it is gone, the same way as the operations map's problems.
    - matchers:
        - service = "security"
      group_by:
        - alertname
        - source
        - advisory
        - package
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 8760h

# A job waiting on a failed one says "blocked"; while any job has failed, its own notice is the
# one to read, and every blocked job would only repeat it.
inhibit_rules:
  - source_matchers:
      - alertname = "FoundationScheduledJobProblem"
      - kind = "failed"
    target_matchers:
      - alertname = "FoundationScheduledJobProblem"
      - kind = "blocked"
    equal:
      - alertname

receivers:
  - name: prelaunch-audit
    # The bot token is a credential and lives outside this file: the compose file mounts it from
    # the host, because a receiver with no destination is how six weeks of alerts went nowhere
    # (2026-09-02 finding; the runbook owns the setup and ends with a delivery proof).
    #
    # Token mode, not webhook mode, by owner decision (2026-09-03): api_url is Slack's Web API
    # and the Authorization header carries the bot token. One caveat the delivery proof exists
    # for: the Web API answers HTTP 200 even for logical failures (unknown channel, revoked
    # token), so only a message seen in the channel counts as delivered.
    slack_configs:
      - channel: '#alerts'
        api_url: https://slack.com/api/chat.postMessage
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/secrets/slack-bot-token
        send_resolved: true
        title: '{{ .Status | toUpper }} {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}
