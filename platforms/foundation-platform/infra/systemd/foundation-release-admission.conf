# Installed by foundation-release.sh for every registered data job's unit (root ADR-0134 §3).
# A template instance gets it on the template (`foundation-x@.service.d`), so an instance
# started by hand that no registry lists is checked as well.
# The + prefix runs this fixed check as the administrator even for an unprivileged job.
[Service]
UnsetEnvironment=PYTHONPATH PYTHONHOME BASH_ENV ENV SHELLOPTS BASHOPTS BASH_XTRACEFD LD_PRELOAD LD_LIBRARY_PATH LD_AUDIT LD_DEBUG LD_PROFILE CDPATH GLOBIGNORE
ExecStartPre=+/opt/perfectory-control/current/scripts/deploy/foundation-release-admission.py verify-current
# A run of the job itself, not a hand or transient one: a lock another run holds makes it wait
# (exit 0, outcome waiting) instead of failing (scripts/ops/held-lock.sh).
Environment=FOUNDATION_JOB_SERVICE=1
# The job names itself to Postgres (libpq and sqlx read PGAPPNAME), so a backend's log line and its
# connection line say which unit it served (compose.recovery.yml log_line_prefix, 2026-11-13 crash).
Environment=PGAPPNAME=%N
# A run stopped on purpose (the deploy's stop of an interruptible job it holds, root ADR-0301 §2, or an
# operator's `systemctl stop`) ends by SIGTERM and is not a failure: the deploy records it owed a run and
# its outcome `waiting stopped by the deploy`. 2026-10-20..11-13 43 deploy stops ended
# `Failed with result 'signal'` and called the owner (W83). A time limit's SIGTERM is still
# `Failed with result 'timeout'`: systemd keeps that result whatever the exit status.
SuccessExitStatus=SIGTERM
