# intelligence-platform cargo-deny policy (derived from foundation-platform's config;
# advisory exceptions reset — this workspace's accepted findings must be earned here).

[graph]
# hakari writes the workspace-hack crate (root ADR-0269); its plain version lines are the point,
# not a second declaration. Every crate it names is a dependency of a member, so out of the graph
# it takes nothing out of the licence, advisory and ban checks.
exclude = ["intelligence-workspace-hack"]
all-features = true

[advisories]
yanked = "deny"
# Fail on unmaintained/unsound advisories anywhere in the dependency graph, not just
# workspace-local crates, so transitive advisories are caught rather than silently
# scope-excluded. Accepted findings must be listed explicitly in `ignore` with a
# justification (see foundation-platform adversarial review PCR2-73 / remediation #10).
unmaintained = "all"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.26.x via sqlx-core (^0.26, no patched 0.26.x); sqlx TLS roots for our own Postgres, not arbitrary-server validation; 1.x bumped to 1.0.10, -0382/-0383 fixed by the bump; review by 2026-11-20" },
]

[licenses]
confidence-threshold = 0.92
unused-allowed-license = "allow"
private = { ignore = true }
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"
# openssl stays banned, with one accepted, tracked wrapper chain (2026-07-20):
# schema_registry_converter 4.9 depends on reqwest 0.13 with default-tls, which
# resolves to native-tls → openssl on Linux. The real fix is pointing
# schema_registry_converter/reqwest at rustls features — a Cargo.lock change that
# must be re-tested in the area container (Docker engine was down when this
# policy landed). Any NEW dependent of openssl outside this chain still fails.
# TODO: switch schema_registry_converter to rustls, then delete these wrappers.
deny = [
    { crate = "openssl", use-instead = "rustls", wrappers = ["native-tls"] },
    { crate = "openssl-sys", use-instead = "rustls", wrappers = ["native-tls", "openssl"] },
    # Vector index / embedding provider crates (Intelligence ADR-0002). Prevents: the honest mistake of
    # pinning an unapproved embedding provider or vector index without the engine ADR that ADR-0002
    # makes its approval condition. Matches the resolved graph (direct, dev, build, transitive and
    # renamed `package =` dependencies), so naming one in prose — chat_policy.rs ALLOWED_LATIN_TERMS
    # lists qdrant and pgvector as spelling data — is not a dependency. Lifting a ban: write the
    # engine ADR first, then update docs/technology-stack.md and this list in the same commit.
    { crate = "qdrant", reason = "Intelligence ADR-0002: no unapproved vector index" },
    { crate = "qdrant-client", reason = "Intelligence ADR-0002: no unapproved vector index" },
    { crate = "pgvector", reason = "Intelligence ADR-0002: no unapproved vector index" },
    { crate = "lancedb", reason = "Intelligence ADR-0002: no unapproved vector index" },
    { crate = "lance", reason = "Intelligence ADR-0002: no unapproved vector index" },
    { crate = "milvus", reason = "Intelligence ADR-0002: no unapproved vector index" },
    { crate = "weaviate", reason = "Intelligence ADR-0002: no unapproved vector index" },
    { crate = "weaviate-client", reason = "Intelligence ADR-0002: no unapproved vector index" },
    { crate = "meilisearch", reason = "Intelligence ADR-0002: no unapproved search index" },
    { crate = "tantivy", reason = "Intelligence ADR-0002: no unapproved search index" },
    { crate = "opensearch", reason = "Intelligence ADR-0002: no unapproved search index" },
    { crate = "elasticsearch", reason = "Intelligence ADR-0002: no unapproved search index" },
    { crate = "fastembed", reason = "Intelligence ADR-0002: no unapproved embedding provider" },
    { crate = "candle-core", reason = "Intelligence ADR-0002: no unapproved embedding provider" },
    { crate = "candle-transformers", reason = "Intelligence ADR-0002: no unapproved embedding provider" },
    { crate = "tiktoken-rs", reason = "Intelligence ADR-0002: no unapproved embedding provider" },
    { crate = "async-openai", reason = "Intelligence ADR-0002: no unapproved embedding provider" },
    { crate = "openai-api-rs", reason = "Intelligence ADR-0002: no unapproved embedding provider" },
]

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = false
unused = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
